<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#101418">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>Tilt Snake — NumberFun</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #101418;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      font-family: Andika, -apple-system, ui-monospace, Menlo, monospace;
    }

    canvas {
      display: block;
      position: fixed;
      inset: 0;
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: rgba(10, 14, 18, .88);
      color: #cfd8e0;
      z-index: 10;
      text-align: center;
      padding: 24px;
    }

    .overlay .title {
      font-size: 22px;
    }

    .overlay .sub {
      font-size: 13px;
      color: #8a97a3;
      margin-top: 14px;
      max-width: 340px;
    }

    .overlay button.go {
      font-size: 20px;
      padding: 16px 32px;
      border-radius: 14px;
      border: none;
      background: #4da3ff;
      color: #fff;
      margin-top: 16px;
    }

    .overlay .btnrow {
      display: flex;
      gap: 14px;
    }

    .overlay button.quiet {
      background: rgba(40, 64, 88, .95);
      color: #cfd8e0;
      border: 1px solid #3a4a58;
    }

    /* the end-bar fades up in the bottom strip while the coiled snake
       and its numeral stay on screen above it */
    #doneBar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 10px 18px;
      z-index: 12;
      color: #cfd8e0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }

    #doneBar.show {
      opacity: 1;
      pointer-events: auto;
    }

    #doneBar .prompt {
      font-size: 18px;
      font-weight: 600;
    }

    #doneBar button {
      font-size: 17px;
      font-family: inherit;
      padding: 10px 24px;
      border-radius: 12px;
      border: none;
      background: #4da3ff;
      color: #fff;
    }

    #doneBar button.quiet {
      background: rgba(40, 64, 88, .95);
      color: #cfd8e0;
      border: 1px solid #3a4a58;
    }

    #tableRow {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      max-width: 340px;
      margin-top: 20px;
    }

    #tableRow button {
      width: 52px;
      height: 52px;
      font-size: 18px;
      border-radius: 12px;
      border: 1px solid #3a4a58;
      background: rgba(30, 42, 54, .9);
      color: #cfd8e0;
    }

    .hidden {
      display: none !important;
    }
  </style>
  <link rel="preload" href="fonts/andika-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/andika-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts/andika.css">
</head>

<body>

  <canvas id="c"></canvas>

  <div id="rotOverlay" class="overlay hidden">
    <div class="title">Rotate back</div>
    <div class="sub">The game waits for you.</div>
  </div>

  <div id="tableOverlay" class="overlay">
    <div class="title">Tilt Snake</div>
    <div class="sub">Pick a table, then collect <b>in order</b>.</div>
    <div id="tableRow"></div>
  </div>

  <div id="overlay" class="overlay hidden">
    <div class="title" id="tableLabel"></div>
    <div class="sub">Tilt, or drag a finger, to steer.</div>
    <button class="go" id="go">Tap to enable tilt</button>
    <div class="sub" id="why"></div>
  </div>

  <div id="doneBar">
    <span class="prompt">Another snake?</span>
    <button id="againYes">Yes</button>
    <button class="quiet" id="againNo">No</button>
  </div>

  <script src="anim.js?v=14"></script>

  <script>
    'use strict';

    /* ---------- tunables ---------- */
    const SNAKE_SPEED = 150;   // design-px/s at full tilt / full drive
    const TURN_RATE = 5.0;    // rad/s hard cap on heading change
    const TURN_RESPOND = 6;   // /s proportional approach to target heading
    const TILT_DEAD = 0.4;    // gravity magnitude below which heading holds
    const FULL_TILT = 3.5;    // gravity magnitude giving full speed
    const IDLE_DRIVE = 0.15;  // fraction of speed while level / holding
    const TOUCH_FULL = 120;   // drag distance (design-px) giving full speed
    const AUTO_FULL = 90;    // tap-target approach distance for full speed
    const SMOOTHING = 0.18;   // low-pass on gravity input
    const HEAD_R = 18;
    const SEG_R = 15;
    const SEG_GAP = 30;       // centre spacing between tail segments
    const NUM_R = 20;         // radius of scattered numeral circles
    const NUM_MARGIN = 56;    // keep numerals this far from screen edge
    const NUM_SEP = NUM_R * 2 + 34;  // min separation between numerals
    const FLASH_SECS = 0.6;   // refusal ring duration
    const EAT_DIST = HEAD_R + NUM_R - 4;
    const TARGET_GLOW = true; // soft pulse on the next numeral to collect
    const HINT_AFTER = 10;     // s idle before the target pulses harder
    // s without a catch before the next numeral is marked, by game of this
    // visit; later games have no marking at all
    const HINT_DELAYS = [0, 3, 6];
    const TAP_PAD = 10;     // extra tap tolerance around numerals, px
    const MANUAL_TILT = 1.5;    // tilt magnitude that cancels tap-autopilot
    // after a tapped catch the snake dithers — heads for one number, changes
    // its mind for another, then gives way slowly to the slope — which
    // leaves time for the next tap to land
    const FEINT_DIST = 35;      // design-px travelled toward each feint number (about a segment)
    const FEINT_MAX = 1.2;      // s cap on each feint, in case a wall stops it
    const FEINT_DRIVE = 0.35;   // fraction of speed while dithering
    const SETTLE_TURN = 1.4;    // rad/s — the slow turn downhill
    const SETTLE_MAX = 2.5;     // s cap on that turn
    const BUMP_SECS = 1.1;      // s of puzzled wobble after the head meets a wall
    const BUMP_DRIVE = 0.3;     // fraction of speed during it
    const BUMP_WOBBLE = 0.4;    // rad of the head-shake
    const BUMP_INWARD = 0.35;   // rad the path along a wall leans away from it
    const BUMP_LOOP = 0.6;      // rad past straight-out when looping out of a corner
    const BUMP_CORNER = 60;     // design-px from a wall's end that counts as a corner
    // propped and left alone, the snake sleepwalks a slow figure of eight
    // along the downhill wall instead of pressing into it
    const SLEEP_DRIVE = 0.3;    // fraction of speed while sleepwalking
    const SLEEP_LOOP = 45;      // design-px each loop of the eight reaches off the wall
    const SLEEP_END = 20;       // design-px kept clear of the wall's ends
    const SLEEP_BAND = 60;      // how near the wall it must slide before it starts
    const SLEEP_LEAD = 40;      // design-px ahead on the path it steers for
    const SLEEP_EYES = 0.5;     // drowsy eyelids, as a share of open
    const BLINK_MIN = 2.4, BLINK_MAX = 6;  // s between blinks
    const BLINK_SECS = 0.28;               // lid dip duration

    // Many Android devices report the motion axes with the opposite sign
    // convention to iOS — tilt arrives inverted. Auto-flip on Android;
    // append ?tilt=normal or ?tilt=invert to the URL to force either way.
    const qs = new URLSearchParams(location.search);
    const AXIS_FLIP = qs.get('tilt') === 'invert' ? true
      : qs.get('tilt') === 'normal' ? false
        : /android/i.test(navigator.userAgent);

    /* ---------- game state ---------- */
    let table = 7;
    let state = 'menu';          // menu | ready | play | celebrate | done
    let head = { x: 0, y: 0 };   // positioned by reset() before play
    let heading = -Math.PI / 2;
    let segs = [];               // collected tail segments, index 0 = nearest head (×1..×12)
    let trail = [];              // the head's recent path, newest first; the tail follows it
    let nums = [];               // {v, x, y, flashUntil}
    let nextIdx = 0;             // next multiple ordinal to collect
    let startT = 0, doneMs = 0, misses = 0;
    let autoTarget = null;       // numeral the snake is being steered to by tap
    let tiltBase = null;         // lean held when the tap landed — a deliberate
    //   re-tilt cancels the autopilot; the resting angle must not
    let lastCollectT = 0;        // performance.now() of last collection / start
    let gamesDone = 0;           // games finished this visit, for hint fading
    let holdPhase = 0;           // dither after a tapped catch: 0 off, 1-2 feints, 3 turning downhill
    let holdT0 = 0;              // when the current phase began
    let feintFrom = null;        // where the current feint began
    let feintTo = null;          // the numeral the snake is pretending to head for
    let bumpUntil = 0, bumpT0 = 0, bumpTarget = 0;  // puzzled spell after meeting a wall
    let sleepy = false, sleepWall = null, sleepT = 0;  // sleepwalk state; sleepT runs along the eight
    let lastDrive = 0;           // last frame's drive, so sleepwalking slows in gently
    let nextBlinkAt = 0, blinkT0 = -1;

    /* ---------- canvas: virtual resolution ----------
       The whole game is laid out in "design px" — a board DESIGN_W wide,
       matching the iPhone-8 space the tunables were chosen in. One scale
       K (screen width / design width) maps design→real px at render time,
       so positions, radii and speed all scale together: SNAKE_SPEED is a
       constant fraction of screen per second on any device. Height is
       left to breathe — taller screens simply get more logical room. */
    const DESIGN_W = 375;
    /* On screens far wider than the design px, scaling objects by K makes
       a bus-sized snake and starves the logical height. Cap K and let the
       logical world widen instead: iPhone-8 behaviour is untouched
       (K = 1), a 1440px desktop gets ~1.8× objects in a bigger field. */
    const K_MAX = 1.8;        // largest object scale we allow
    const MIN_DESIGN_H = 480; // logical board never shorter than this
    const cv = document.getElementById('c');
    const ctx = cv.getContext('2d');
    let W = 0, H = 0, Wd = 0, Hd = 0, DPR = 1, K = 1;
    function resize() {
      // visualViewport, not innerHeight: iOS reports layout space that
      // includes area under the browser toolbar — vv is what is actually
      // visible, so dealt numerals can't land under the chrome
      const vv = window.visualViewport;
      const w = vv ? vv.width : window.innerWidth;
      const h = vv ? vv.height : window.innerHeight;
      // transient degenerate sizes during fullscreen transitions would
      // collapse the scale transform and blank the canvas — ignore them
      if (w < 50 || h < 50) return;
      DPR = Math.min(window.devicePixelRatio || 1, 3);
      W = w; H = h;
      K = Math.min(W / DESIGN_W, H / MIN_DESIGN_H, K_MAX);
      Wd = W / K; Hd = H / K;
      cv.width = W * DPR; cv.height = H * DPR;
      cv.style.width = W + 'px'; cv.style.height = H + 'px';
      ctx.setTransform(DPR * K, 0, 0, DPR * K, 0, 0);
      // a mid-game resize can shrink the logical board — clamp things in
      nums.forEach(n => {
        n.x = Math.min(Math.max(n.x, NUM_MARGIN), Wd - NUM_MARGIN);
        n.y = Math.min(Math.max(n.y, NUM_MARGIN), Hd - NUM_MARGIN);
      });
      head.x = Math.min(Math.max(head.x, HEAD_R), Wd - HEAD_R);
      head.y = Math.min(Math.max(head.y, HEAD_R), Hd - HEAD_R);
    }
    window.addEventListener('resize', resize);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
    // fullscreen transitions settle to new dims after the event —
    // measure again once they've landed
    document.addEventListener('fullscreenchange', () => {
      resize();
      setTimeout(resize, 400);
    });
    resize();

    // telemetry stub — event list kept in memory; a fetch() POST to a
    // serverless endpoint can be wired in here later (anon session id only)
    const events = [];
    const sid = Math.random().toString(36).slice(2, 10);
    function logEvent(type, data) {
      events.push({ t: Math.round(performance.now()), sid, type, ...data });
    }

    /* ---------- layout ---------- */
    function dealNumerals() {
      nums = [];
      let guard = 0;
      while (nums.length < 12 && guard++ < 4000) {
        const x = NUM_MARGIN + Math.random() * (Wd - 2 * NUM_MARGIN);
        const y = NUM_MARGIN + Math.random() * (Hd - 2 * NUM_MARGIN);
        if (Math.hypot(x - head.x, y - head.y) < 140) continue;
        if (nums.every(n => Math.hypot(n.x - x, n.y - y) >= NUM_SEP))
          nums.push({ v: table * (nums.length + 1), x, y, flashUntil: 0 });
      }
      // small boards can exhaust the scatter before all twelve land —
      // a missing numeral means an unreachable target (observed: the 12th
      // never dealt, hint arrow then dereferenced it and the loop died).
      // Fall back to jittered grid slots so all twelve always exist.
      if (nums.length < 12) {
        const cols = Math.max(2, Math.floor((Wd - 2 * NUM_MARGIN) / NUM_SEP));
        const rows = Math.ceil(12 / cols);
        const cw = (Wd - 2 * NUM_MARGIN) / cols;
        const ch = (Hd - 2 * NUM_MARGIN) / rows;
        const spots = [];
        for (let r = 0; r < rows; r++)
          for (let c = 0; c < cols; c++)
            spots.push({
              x: NUM_MARGIN + cw * (c + 0.5) + (Math.random() - 0.5) * cw * 0.4,
              y: NUM_MARGIN + ch * (r + 0.5) + (Math.random() - 0.5) * ch * 0.4
            });
        for (let i = spots.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [spots[i], spots[j]] = [spots[j], spots[i]];
        }
        // pass 1: near-normal separation; pass 2: merely non-overlapping
        for (const sep of [NUM_SEP * 0.8, NUM_R * 2 + 6])
          for (const s of spots) {
            if (nums.length >= 12) break;
            if (Math.hypot(s.x - head.x, s.y - head.y) < 100) continue;
            if (nums.every(n => Math.hypot(n.x - s.x, n.y - s.y) >= sep))
              nums.push({ v: table * (nums.length + 1), x: s.x, y: s.y, flashUntil: 0 });
          }
        // pass 3 (airtight): head spawns centre-board and can exclude the
        // exact slots needed — sweep a coarse lattice for anything that
        // fits at all, requiring only non-overlap and non-instant-eat
        for (let y = NUM_MARGIN + NUM_R; y <= Hd - NUM_MARGIN - NUM_R && nums.length < 12; y += 44)
          for (let x = NUM_MARGIN + NUM_R; x <= Wd - NUM_MARGIN - NUM_R && nums.length < 12; x += 44)
            if (Math.hypot(x - head.x, y - head.y) > EAT_DIST + NUM_R + 10
              && nums.every(n => Math.hypot(n.x - x, n.y - y) >= NUM_R * 2 + 2))
              nums.push({ v: table * (nums.length + 1), x, y, flashUntil: 0 });
      }
      // scatter order is already random positions; values are assigned
      // 1..12 so 'in order' means hunting the next value, not the nearest
    }

    function reset(tbl) {
      table = tbl;
      head = { x: Wd / 2, y: Hd * 0.62 };
      heading = -Math.PI / 2;
      segs = []; trail = [];
      nextIdx = 0;
      misses = 0;
      dealNumerals();
      nextBlinkAt = performance.now() + 2000 + Math.random() * 2000;
      blinkT0 = -1;
      doneBar.classList.remove('show');
      logEvent('deal', { table, count: nums.length });
    }

    /* ---------- table picker + permission overlay ---------- */
    const tableOverlay = document.getElementById('tableOverlay');
    const overlay = document.getElementById('overlay');
    const doneBar = document.getElementById('doneBar');
    const whyEl = document.getElementById('why');
    const row = document.getElementById('tableRow');
    for (let t = 2; t <= 12; t++) {
      const b = document.createElement('button');
      b.textContent = '×' + t;
      b.addEventListener('click', () => {
        reset(t);
        document.getElementById('tableLabel').textContent = '×' + t + ' table';
        tableOverlay.classList.add('hidden');
        overlay.classList.remove('hidden');
        state = 'ready';
      });
      row.appendChild(b);
    }

    function motionNeedsPermission() {
      return typeof DeviceMotionEvent !== 'undefined'
        && typeof DeviceMotionEvent.requestPermission === 'function';
    }

    document.getElementById('go').addEventListener('click', async () => {
      try {
        if (motionNeedsPermission()) {
          const res = await DeviceMotionEvent.requestPermission();
          if (res !== 'granted') {
            whyEl.textContent = 'Permission "' + res +
              '" — tilt unavailable, but touch-drag still works.';
            document.getElementById('go').textContent = 'Play with touch';
            document.getElementById('go').onclick = () => { overlay.classList.add('hidden'); startPlay(); };
            return;
          }
        }
        overlay.classList.add('hidden');
        if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => { });
        const el = document.documentElement;
        const req = el.requestFullscreen || el.webkitRequestFullscreen;
        Promise.resolve(req ? req.call(el) : null)
          .catch(() => { })
          .then(() => {
            if (screen.orientation && screen.orientation.lock)
              screen.orientation.lock('portrait').catch(() => { });
          });
        startPlay();
      } catch (e) {
        whyEl.textContent = 'Motion request failed: ' + e.message;
      }
    });
    if (!motionNeedsPermission()) {
      document.getElementById('go').textContent = 'Play';
      whyEl.textContent = 'No tap needed here.';
    }

    function startPlay() {
      state = 'play';
      holdPhase = 0;
      bumpUntil = 0;
      startT = performance.now();
      lastCollectT = performance.now();
      logEvent('start', { table });
    }

    function finish() {
      state = 'celebrate';
      doneMs = Math.round(performance.now() - startT);
      touch = null;
      autoTarget = null;
      logEvent('complete', { table, ms: doneMs, misses });
      gamesDone++;
      const fullSegs = [
        { x: head.x, y: head.y, expected: 0, filled: true, blank: false },
        ...segs.map(s => ({ x: s.x, y: s.y, expected: s.v, filled: true, blank: false }))
      ];
      Anim.begin({
        ctx, W: Wd, H: Hd,
        board: { x: 12, y: 56, w: Wd - 24, h: Hd - 116 },
        segD: HEAD_R * 2,
        table,
        segs: fullSegs,
        kind: 'wind',
        hold: true,
        onDone: showDone
      });
    }

    function showDone() {
      state = 'done';
      doneBar.classList.add('show');
    }

    document.getElementById('againYes').addEventListener('click', () => {
      doneBar.classList.remove('show');
      segs = []; nums = []; trail = [];
      tableOverlay.classList.remove('hidden');
      state = 'menu';
    });
    document.getElementById('againNo').addEventListener('click', () => {
      location.href = 'index.html';
    });

    /* ---------- input ---------- */
    let smX = 0, smY = 0, tiltOn = false;
    window.addEventListener('devicemotion', (e) => {
      const g = e.accelerationIncludingGravity;
      if (!g || g.x === null) return;
      const gx = AXIS_FLIP ? -g.x : g.x;
      const gy = AXIS_FLIP ? -g.y : g.y;
      smX += (gx - smX) * SMOOTHING;
      smY += (gy - smY) * SMOOTHING;
      tiltOn = true;
    });

    let touch = null;
    cv.addEventListener('pointerdown', (t) => {
      if (state !== 'play') return;
      // a tap on the next numeral sends the snake straight to it;
      // a tap on any other numeral is a refusal, not a steer
      const i = nums.findIndex(n => !n.collected &&
        Math.hypot(n.x - t.clientX / K, n.y - t.clientY / K) < NUM_R + TAP_PAD);
      if (i >= 0) {
        if (i === nextIdx) {
          autoTarget = nums[i];
          // the autopilot yields only to a *change* of lean — resting
          // tilt (any held angle) must not cancel it
          tiltBase = { x: smX, y: smY };
        }
        else if (performance.now() > nums[i].flashUntil) {
          nums[i].flashUntil = performance.now() + FLASH_SECS * 1000;
          misses++;
        }
        return;
      }
      touch = { x: t.clientX / K, y: t.clientY / K };
    });
    cv.addEventListener('pointermove', (t) => { if (t.buttons) touch = { x: t.clientX / K, y: t.clientY / K }; });
    window.addEventListener('pointerup', () => touch = null);
    window.addEventListener('pointercancel', () => touch = null);
    cv.addEventListener('touchmove', (t) => t.preventDefault(), { passive: false });

    /* ---------- orientation guard ---------- */
    const rotOverlay = document.getElementById('rotOverlay');
    let paused = false;
    // desktops exempt — a wide window is legitimate there
    const handheld = matchMedia('(pointer: coarse)').matches;
    function checkOrientation() {
      // viewport dims, not the orientation label: during a rotation iOS
      // fires the events while matchMedia/orientation still report the
      // OLD facing — dims tell the truth at call time
      const portrait = H >= W;
      paused = handheld && !portrait;
      rotOverlay.classList.toggle('hidden', !paused);
    }
    function scheduleOrientationCheck() {
      checkOrientation();
      setTimeout(checkOrientation, 350);   // re-read once the turn settles
    }
    window.addEventListener('orientationchange', scheduleOrientationCheck);
    window.addEventListener('resize', scheduleOrientationCheck);
    checkOrientation();
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) { smX = smY = 0; lastT = performance.now(); }
    });

    /* ---------- step ---------- */
    let lastT = performance.now();

    function wrapAngle(d) {
      while (d > Math.PI) d -= 2 * Math.PI;
      while (d < -Math.PI) d += 2 * Math.PI;
      return d;
    }

    // a random uncollected numeral other than the one wanted next (and other
    // than the last feint), preferring ones roughly ahead so the snake
    // doesn't fold back over its own body — null when none is left
    function pickFeint(not) {
      const pool = nums.filter((n, i) => !n.collected && i !== nextIdx && n !== not);
      const ahead = pool.filter(n =>
        Math.abs(wrapAngle(Math.atan2(n.y - head.y, n.x - head.x) - heading)) < 1.6);
      const from = ahead.length ? ahead : pool;
      return from.length ? from[Math.floor(Math.random() * from.length)] : null;
    }

    // the head meets a wall (hx/hy: inward direction of the wall touched):
    // blink, and plan a puzzled wobble that carries on along the wall, or
    // loops out near a corner, instead of a bounce
    function bump(hx, hy, now) {
      if (blinkT0 < 0) blinkT0 = now;
      const ex = Math.cos(heading), ey = Math.sin(heading);
      // in a corner, deal with the wall the head is driving into hardest
      let nx = hx, ny = hy;
      if (nx && ny) { if (-ex * nx > -ey * ny) ny = 0; else nx = 0; }
      // the way along the wall closest to the current heading
      let tx = -ny, ty = nx;
      if (tx * ex + ty * ey < 0) { tx = -tx; ty = -ty; }
      const along = Math.atan2(ty, tx), inward = Math.atan2(ny, nx);
      const side = Math.sign(wrapAngle(along - inward)) || 1;
      const room = (tx > 0 ? Wd - head.x : tx < 0 ? head.x : ty > 0 ? Hd - head.y : head.y) - HEAD_R;
      bumpTarget = room < BUMP_CORNER
        ? inward - side * BUMP_LOOP      // loop out and back the other way
        : along - side * BUMP_INWARD;    // carry on, leaning off the wall
      bumpT0 = now;
      bumpUntil = now + BUMP_SECS * 1000;
    }

    // steering for the sleepwalk, or null when the snake isn't down at the
    // downhill wall (fresh: it wasn't sleepwalking last frame)
    function sleepwalk(fresh) {
      const mag = Math.hypot(smX, smY);
      if (mag <= TILT_DEAD) return null;
      const gx = smX / mag, gy = -smY / mag;   // downhill, as tilt steering reads it
      const m = HEAD_R + 12, B = SLEEP_LOOP;
      let wall, ux, uy, nx, ny, cx, cy, A;
      if (Math.abs(gx) > Math.abs(gy)) {
        wall = gx > 0 ? 'R' : 'L'; ux = 0; uy = 1; nx = gx > 0 ? -1 : 1; ny = 0;
        cx = gx > 0 ? Wd - m - B : m + B; cy = Hd / 2; A = Hd / 2 - m - SLEEP_END;
      } else {
        wall = gy > 0 ? 'B' : 'T'; ux = 1; uy = 0; nx = 0; ny = gy > 0 ? -1 : 1;
        cx = Wd / 2; cy = gy > 0 ? Hd - m - B : m + B; A = Wd / 2 - m - SLEEP_END;
      }
      const depth = (head.x - cx) * nx + (head.y - cy) * ny;   // distance up from the eight's middle
      if (fresh || wall !== sleepWall) {
        if (depth > B + SLEEP_BAND) return null;
        sleepWall = wall;
        // join the eight at the point level with the head, going the way it faces
        const s = Math.max(-1, Math.min(1, ((head.x - cx) * ux + (head.y - cy) * uy) / A));
        sleepT = Math.asin(s);
        if (Math.cos(heading) * ux + Math.sin(heading) * uy < 0) sleepT = Math.PI - sleepT;
      } else if (depth > B + SLEEP_BAND * 2) { sleepWall = null; return null; }
      const pt = t => [cx + ux * A * Math.sin(t) + nx * B * Math.sin(2 * t),
        cy + uy * A * Math.sin(t) + ny * B * Math.sin(2 * t)];
      let p = pt(sleepT);
      for (let i = 0; i < 80 && Math.hypot(p[0] - head.x, p[1] - head.y) < SLEEP_LEAD; i++)
        p = pt(sleepT += 0.02);
      return Math.atan2(p[1] - head.y, p[0] - head.x);
    }

    function step(dt, now) {
      if (state !== 'play' || paused) return;
      const fresh = !sleepy;
      sleepy = false;

      let target = null;
      let drive = IDLE_DRIVE;
      if (touch) {
        autoTarget = null;
        const dx = touch.x - head.x, dy = touch.y - head.y;
        target = Math.atan2(dy, dx);
        drive = Math.max(IDLE_DRIVE, Math.min(Math.hypot(dx, dy) / TOUCH_FULL, 1));
      } else if (autoTarget) {
        // firm manual tilt overrides the tap-autopilot — measured as a
        // change from the lean held at tap time, since gravity's x/y
        // components are large at ANY held angle
        if (tiltOn && tiltBase &&
          Math.hypot(smX - tiltBase.x, smY - tiltBase.y) > MANUAL_TILT)
          autoTarget = null;
        else {
          const dx = autoTarget.x - head.x, dy = autoTarget.y - head.y;
          target = Math.atan2(dy, dx);
          drive = Math.max(IDLE_DRIVE, Math.min(Math.hypot(dx, dy) / AUTO_FULL, 1));
        }
      } else if (holdPhase) {
        // dithering after a tapped catch; a deliberate re-tilt ends it
        if (tiltOn && tiltBase &&
          Math.hypot(smX - tiltBase.x, smY - tiltBase.y) > MANUAL_TILT)
          holdPhase = 0;
        if (holdPhase === 1 || holdPhase === 2) {
          if (!feintTo) feintTo = pickFeint(null);
          if (feintTo && (now - holdT0 > FEINT_MAX * 1000 ||
            Math.hypot(head.x - feintFrom.x, head.y - feintFrom.y) > FEINT_DIST)) {
            holdPhase++;
            holdT0 = now;
            feintFrom = { x: head.x, y: head.y };
            feintTo = holdPhase === 2 ? pickFeint(feintTo) : null;
          }
          if (holdPhase < 3 && feintTo) {
            target = Math.atan2(feintTo.y - head.y, feintTo.x - head.x);
            drive = FEINT_DRIVE;
          } else holdPhase = 3;
        }
        if (holdPhase === 3) {
          // give way to the slope with a slow turn; on the level there is
          // nothing to give way to, so ordinary play resumes
          const mag = tiltOn ? Math.hypot(smX, smY) : 0;
          if (mag <= TILT_DEAD) holdPhase = 0;
          else {
            const d = wrapAngle(Math.atan2(-smY, smX) - heading);
            heading += Math.max(-SETTLE_TURN * dt, Math.min(SETTLE_TURN * dt, d));
            drive = FEINT_DRIVE;
            if (Math.abs(d) < 0.15 || now - holdT0 > SETTLE_MAX * 1000) holdPhase = 0;
          }
        }
      } else if (now < bumpUntil) {
        // puzzled after meeting a wall: a head-shake on the way along it
        const k = (now - bumpT0) / (BUMP_SECS * 1000);
        target = bumpTarget + BUMP_WOBBLE * Math.sin(4 * Math.PI * k) * (1 - k);
        drive = BUMP_DRIVE;
      } else if (tiltOn) {
        const st = sleepwalk(fresh);
        if (st !== null) {
          sleepy = true;
          target = st;
          drive = lastDrive + (SLEEP_DRIVE - lastDrive) * Math.min(1, 2 * dt);
        } else {
          const mag = Math.hypot(smX, smY);
          if (mag > TILT_DEAD) {
            target = Math.atan2(-smY, smX);
            drive = Math.max(IDLE_DRIVE, Math.min(mag / FULL_TILT, 1));
          }
        }
      }
      if (target !== null) {
        const d = wrapAngle(target - heading);
        // proportional approach (smooth arrival, no overshoot) capped
        // by TURN_RATE for large swings
        const amt = d * Math.min(1, TURN_RESPOND * dt);
        heading += Math.max(-TURN_RATE * dt, Math.min(TURN_RATE * dt, amt));
      }

      lastDrive = drive;
      head.x += Math.cos(heading) * SNAKE_SPEED * drive * dt;
      head.y += Math.sin(heading) * SNAKE_SPEED * drive * dt;

      // walls: no bounce — a blink and a puzzled turn along the wall keep
      // the body flowing instead of folding back on itself
      const hx = head.x < HEAD_R ? 1 : head.x > Wd - HEAD_R ? -1 : 0;
      const hy = head.y < HEAD_R ? 1 : head.y > Hd - HEAD_R ? -1 : 0;
      head.x = Math.max(HEAD_R, Math.min(Wd - HEAD_R, head.x));
      head.y = Math.max(HEAD_R, Math.min(Hd - HEAD_R, head.y));
      if ((hx || hy) && now > bumpUntil) bump(hx, hy, now);

      // tail follows the head's own path, as a real snake's body does: each
      // segment sits a further SEG_GAP back along the trail the head drew.
      // Where the trail is too short yet, it is pulled behind the one ahead.
      const t0 = trail[0];
      if (!t0 || Math.hypot(head.x - t0.x, head.y - t0.y) > 1) trail.unshift({ x: head.x, y: head.y });
      let lead = head, ti = 0, back = 0, a = head;
      segs.forEach((sg, k) => {
        const want = (k + 1) * SEG_GAP;
        let onTrail = false;
        while (ti < trail.length) {
          const b = trail[ti];
          const d = Math.hypot(b.x - a.x, b.y - a.y);
          if (back + d >= want) {
            const f = (want - back) / (d || 1);
            sg.x = a.x + (b.x - a.x) * f;
            sg.y = a.y + (b.y - a.y) * f;
            onTrail = true;
            break;
          }
          back += d; a = b; ti++;
        }
        if (!onTrail) {
          const dx = lead.x - sg.x, dy = lead.y - sg.y;
          const d = Math.hypot(dx, dy) || 1;
          sg.x = lead.x - dx / d * SEG_GAP;
          sg.y = lead.y - dy / d * SEG_GAP;
        }
        lead = sg;
      });
      if (trail.length > ti + 40) trail.length = ti + 40;

      // numeral contact
      nums.forEach((n, i) => {
        if (n.collected) return;
        if (Math.hypot(n.x - head.x, n.y - head.y) < EAT_DIST) {
          if (i === nextIdx) {
            n.collected = true;
            if (autoTarget === n) {
              holdPhase = 1;
              holdT0 = now;
              feintFrom = { x: head.x, y: head.y };
              feintTo = null;
              tiltBase = { x: smX, y: smY };
            }
            autoTarget = null;
            lastCollectT = now;
            // lowest multiple stays behind the head (index 0); newest capture
            // joins the tail end, stepped one SEG_GAP behind the current tip
            const prev = segs.length >= 2 ? segs[segs.length - 2] : head;
            let tx = lead.x - prev.x, ty = lead.y - prev.y;
            const td = Math.hypot(tx, ty);
            if (td > 1e-3) { tx /= td; ty /= td; }
            else { tx = -Math.cos(heading); ty = -Math.sin(heading); }
            segs.push({ x: lead.x + tx * SEG_GAP, y: lead.y + ty * SEG_GAP, v: n.v });
            nextIdx++;
            logEvent('collect', { v: n.v, ord: nextIdx });
            if (nextIdx === 12) finish();
          } else if (!holdPhase && !sleepy && now > n.flashUntil) {   // a bump while dithering or sleepwalking is not the child's
            n.flashUntil = now + FLASH_SECS * 1000;
            misses++;
            logEvent('refuse', { v: n.v, want: table * (nextIdx + 1) });
          }
        }
      });
    }

    /* ---------- draw ---------- */

    /* 1 = eyes open, dipping briefly toward shut and back — one smooth
       sinusoid so there are no blink states to manage */
    function blinkScale(now) {
      if (blinkT0 < 0) {
        if (now < nextBlinkAt) return 1;
        blinkT0 = now;
      }
      const k = (now - blinkT0) / 1000 / BLINK_SECS;
      if (k >= 1) {
        blinkT0 = -1;
        nextBlinkAt = now + (BLINK_MIN + Math.random() * (BLINK_MAX - BLINK_MIN)) * 1000;
        return 1;
      }
      return 1 - Math.sin(k * Math.PI) * 0.88;
    }

    function drawNum(n, isTarget, hot) {
      const flash = n.flashUntil > performance.now();
      ctx.beginPath();
      ctx.arc(n.x, n.y, NUM_R, 0, Math.PI * 2);
      ctx.fillStyle = flash ? '#5a4a28' : (isTarget ? '#1d3a4f' : '#1a2430');
      ctx.fill();
      ctx.strokeStyle = flash ? '#e0a53a' : (isTarget ? '#4da3ff' : '#2c3e50');
      ctx.lineWidth = isTarget ? 2.5 : 1.5;
      ctx.stroke();
      if (isTarget && TARGET_GLOW) {
        ctx.beginPath();
        ctx.arc(n.x, n.y, NUM_R + (hot ? 9 : 5)
          + Math.sin(performance.now() / (hot ? 160 : 300)) * 3, 0, Math.PI * 2);
        ctx.strokeStyle = hot ? 'rgba(77,163,255,0.7)' : 'rgba(77,163,255,0.35)';
        ctx.lineWidth = hot ? 3 : 2;
        ctx.stroke();
      }
      ctx.fillStyle = flash ? '#e0a53a' : '#cfd8e0';
      ctx.font = 'bold ' + (NUM_R - 2) + 'px Andika, -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(n.v, n.x, n.y + 1);
    }

    function draw(now) {
      if (state === 'celebrate' || state === 'done') {
        Anim.frame(now);
        return;
      }
      ctx.clearRect(0, 0, Wd, Hd);

      const idle = (state === 'play' && lastCollectT)
        ? (performance.now() - lastCollectT) / 1000 : 0;
      const hintAt = HINT_DELAYS[gamesDone];
      const marked = hintAt !== undefined && idle >= hintAt;
      nums.forEach((n, i) => {
        const t = i === nextIdx && marked;
        if (!n.collected) drawNum(n, t, t && idle > HINT_AFTER);
      });

      // the snake takes its table's colour — same table-coding as the
      // rest of the family (head gradient and body both derive from it)
      const hue = (table * 31 + 200) % 360;

      // tail, drawn back-to-front
      for (let i = segs.length - 1; i >= 0; i--) {
        const sg = segs[i];
        ctx.beginPath();
        ctx.arc(sg.x, sg.y, SEG_R, 0, Math.PI * 2);
        ctx.fillStyle = 'hsl(' + hue + ',60%,45%)';
        ctx.fill();
        ctx.strokeStyle = 'hsl(' + hue + ',55%,36%)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 15px Andika, -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(sg.v, sg.x, sg.y + 1);
      }

      if (state === 'play' || state === 'done' || state === 'ready') {
        // head — same construction as Snake Puzzle: radial-shaded ball,
        // rim stroke, pupil pair forward and across. Here the eyes stay
        // on the heading — where they point is steering information —
        // and blink the same way.
        ctx.beginPath();
        ctx.arc(head.x, head.y, HEAD_R, 0, Math.PI * 2);
        const grd = ctx.createRadialGradient(
          head.x - HEAD_R * 0.33, head.y - HEAD_R * 0.33, HEAD_R * 0.2,
          head.x, head.y, HEAD_R);
        grd.addColorStop(0, 'hsl(' + hue + ',62%,64%)');
        grd.addColorStop(1, 'hsl(' + hue + ',56%,28%)');
        ctx.fillStyle = grd;
        ctx.fill();
        ctx.strokeStyle = 'hsl(' + hue + ',58%,40%)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        const ex = Math.cos(heading), ey = Math.sin(heading);
        const px = -ey, py = ex;
        const sq = blinkScale(performance.now()) * (sleepy ? SLEEP_EYES : 1);
        [[1, 0], [-1, 0]].forEach(([sgn]) => {
          ctx.beginPath();
          ctx.ellipse(head.x + ex * HEAD_R * 0.38 + px * sgn * HEAD_R * 0.36,
            head.y + ey * HEAD_R * 0.38 + py * sgn * HEAD_R * 0.36,
            HEAD_R * 0.16, Math.max(HEAD_R * 0.16 * sq, HEAD_R * 0.03),
            heading, 0, Math.PI * 2);
          ctx.fillStyle = '#101418';
          ctx.fill();
        });
      }

    }

    function frame(now) {
      const dt = Math.min((now - lastT) / 1000, 0.05);
      lastT = now;
      step(dt, now);
      try { draw(now); } catch (e) { /* a bad frame must never kill the loop */ }
      requestAnimationFrame(frame);
    }
    // lab aids: ?t=N jumps straight into table N; ?done auditions the
    // completion from a sample 12-segment trail
    if (qs.has('t')) {
      reset(Math.min(12, Math.max(2, +qs.get('t') || table)));
      tableOverlay.classList.add('hidden');
      startPlay();
    }
    if (qs.has('done')) {
      reset(Math.min(12, Math.max(2, +qs.get('t') || table)));
      tableOverlay.classList.add('hidden');
      overlay.classList.add('hidden');
      segs = [];
      for (let i = 0; i < 12; i++) {
        segs.push({
          x: head.x - Math.sin(i * 0.35) * 18,
          y: head.y + (i + 1) * SEG_GAP * 0.85,
          v: table * (i + 1)
        });
      }
      startT = performance.now() - 18000;
      finish();
    }
    requestAnimationFrame(frame);
  </script>
