<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#101418">
  <title>Den Lab — NumberFun</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #101418;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      font-family: Andika, -apple-system, system-ui, sans-serif;
    }

    canvas {
      display: block;
      position: fixed;
      inset: 0;
    }

    #btnBar {
      position: fixed;
      right: 12px;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
      display: flex;
      gap: 10px;
      z-index: 12;
    }

    #btnBar button {
      font-size: 17px;
      font-family: inherit;
      padding: 10px 22px;
      border-radius: 12px;
      border: none;
      background: #4da3ff;
      color: #fff;
    }

    #btnBar button.quiet {
      background: rgba(40, 64, 88, .95);
      color: #cfd8e0;
      border: 1px solid #3a4a58;
    }
  </style>
  <link rel="preload" href="fonts/andika-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/andika-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts/andika.css">
</head>

<body>

  <canvas id="c"></canvas>

  <div id="btnBar">
    <button class="quiet" id="poseBtn">Pose</button>
    <button id="goBtn">Home</button>
  </div>

  <script src="anim.js?v=15"></script>

  <script>
    'use strict';

    /* den-lab — a proving ground, not a product (pose-lab's sibling).
       ONE completed snake from Snake Puzzle's world, ONE journey: the
       head steers home to the den's bottom-left spot under the normal
       trail motion, and rests. Nothing else — the gather, the pile,
       and the lap all come later, if this travel pleases the eye.

       ?t=N    pin a table (2..12, default 5)
       ?go=0   wait for the Home button instead of auto-travelling
       ?x=&y=  pin a different destination (css px from left / top)
       ?den=   (nav.js) seat snakes in the den to travel towards */

    /* ---------- tunables ---------- */
    const REST_SECS = 1.4;          // the dealt pose rests before setting off
    const HOME = { x: 46, y: -54 }; // the den's front spot, y up from bottom
    const TOP_RESERVE = 92;         // clearance below the menu button
    const BOT_RESERVE = 116;        // room for the buttons
    const BOARD_PAD = 16;
    const BLINK_MIN = 2.4, BLINK_MAX = 6, BLINK_SECS = 0.28;

    /* ---------- canvas ---------- */
    const cv = document.getElementById('c');
    const ctx = cv.getContext('2d');
    let W = 0, H = 0, DPR = 1;
    let bX = 0, bY = 0, bW = 0, bH = 0;
    let segD = 48;

    function resize() {
      const vv = window.visualViewport;
      W = vv ? vv.width : window.innerWidth;
      H = vv ? vv.height : window.innerHeight;
      if (W < 50 || H < 50) return;
      DPR = Math.min(window.devicePixelRatio || 1, 3);
      cv.width = W * DPR; cv.height = H * DPR;
      cv.style.width = W + 'px'; cv.style.height = H + 'px';
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      bX = BOARD_PAD; bY = TOP_RESERVE;
      bW = W - 2 * BOARD_PAD; bH = H - TOP_RESERVE - BOT_RESERVE;
      segD = Math.max(34, Math.min(72, Math.min(bW, bH) * 0.14));
      if (segs.length) layout();
    }
    window.addEventListener('resize', resize);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

    /* ---------- state ---------- */
    const N = 13;
    const qs = new URLSearchParams(location.search);
    let table = Math.min(12, Math.max(2, +qs.get('t') || 5));
    let rail = [], segs = [];
    let state = 'posed';            // posed | moving | rested
    let gaze = 0, nextBlinkAt = 0, blinkT0 = -1;
    let restT = 0;

    const goBtn = document.getElementById('goBtn');
    const poseBtn = document.getElementById('poseBtn');

    function tableColour(t) { return 'hsl(' + ((t * 31 + 200) % 360) + ',60%,45%)'; }

    function layout() {
      const sq = Math.min(bW, bH);
      for (let i = 0; i < N; i++) {
        segs[i].x = bX + (bW - sq) / 2 + rail[i].x * sq;
        segs[i].y = bY + (bH - sq) / 2 + rail[i].y * sq;
      }
    }

    function deal() {
      rail = Anim.pose({
        board: { x: bX, y: bY, w: bW, h: bH }, segD, count: N
      }).rail;
      segs = [];
      for (let i = 0; i < N; i++) {
        segs.push({
          x: 0, y: 0, expected: i === 0 ? 0 : i * table,
          filled: true, blank: false
        });
      }
      layout();
      state = 'posed';
      restT = performance.now();
      gaze = Math.atan2(segs[0].y - segs[1].y, segs[0].x - segs[1].x);
      nextBlinkAt = restT + 2000 + Math.random() * 2000;
      blinkT0 = -1;
      goBtn.textContent = 'Home';
    }

    /* the journey: hand the whole completed snake to the engine for a
       single seek at the den spot — the shared trail motion does all
       the steering; onDone fires when the head arrives */
    function travel() {
      if (state === 'moving') return;
      state = 'moving';
      Anim.begin({
        ctx, W, H,
        board: { x: bX, y: bY, w: bW, h: bH },
        segD, table, segs,
        kind: 'den',
        target: { x: +qs.get('x') || HOME.x, y: +qs.get('y') || H + HOME.y },
        skipBeat: true,
        onDone: () => { state = 'rested'; goBtn.textContent = 'Again'; }
      });
    }

    goBtn.addEventListener('click', () => {
      if (state === 'moving') return;
      deal();          // fresh pose, then straight home again
      travel();
    });
    poseBtn.addEventListener('click', deal);

    /* ---------- resting-pose draw (until the engine takes over) ---------- */
    function numeral(v, cx, cy, size, colour) {
      ctx.font = '700 ' + size + 'px Andika, -apple-system, system-ui, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = colour;
      ctx.fillText(v, cx, cy);
    }
    function blinkScale(now) {
      if (blinkT0 < 0) {
        if (now < nextBlinkAt) return 1;
        blinkT0 = now;
      }
      const k = (now - blinkT0) / 1000 / BLINK_SECS;
      if (k >= 1) {
        blinkT0 = -1;
        nextBlinkAt = now + (BLINK_MIN + Math.random() * (BLINK_MAX - BLINK_MIN)) * 1000;
        return 1;
      }
      return 1 - Math.sin(k * Math.PI) * 0.88;
    }
    function drawHead(s, facing, now) {
      const r = segD / 2;
      const hue = (table * 31 + 200) % 360;
      const g = ctx.createRadialGradient(
        s.x - r * 0.33, s.y - r * 0.33, r * 0.2, s.x, s.y, r);
      g.addColorStop(0, 'hsl(' + hue + ',62%,64%)');
      g.addColorStop(1, 'hsl(' + hue + ',56%,28%)');
      ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, 7);
      ctx.fillStyle = g; ctx.fill();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = 'hsl(' + hue + ',58%,40%)';
      ctx.stroke();
      const ex = Math.cos(facing), ey = Math.sin(facing);
      const px = -ey, py = ex;
      const sq = blinkScale(now);
      for (const side of [-1, 1]) {
        ctx.beginPath();
        ctx.ellipse(s.x + ex * r * 0.38 + px * side * r * 0.36,
          s.y + ey * r * 0.38 + py * side * r * 0.36,
          r * 0.16, Math.max(r * 0.16 * sq, r * 0.03), facing, 0, 7);
        ctx.fillStyle = '#101418'; ctx.fill();
      }
    }
    function drawPose(now) {
      ctx.fillStyle = '#101418';
      ctx.fillRect(0, 0, W, H);
      ctx.beginPath();
      segs.forEach((s, i) => i ? ctx.lineTo(s.x, s.y) : ctx.moveTo(s.x, s.y));
      ctx.strokeStyle = 'rgba(90,110,130,.25)';
      ctx.lineWidth = 3;
      ctx.stroke();
      const facing = Math.atan2(segs[0].y - segs[1].y, segs[0].x - segs[1].x);
      for (let i = N - 1; i >= 0; i--) {
        const s = segs[i], r = segD / 2;
        if (i === 0) { drawHead(s, facing, now); continue; }
        ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, 7);
        ctx.fillStyle = tableColour(table); ctx.fill();
        numeral(s.expected, s.x, s.y, segD * 0.34, '#fff');
      }
    }

    function frame(now) {
      try {
        if (state === 'posed') {
          drawPose(now);
          if (qs.get('go') !== '0' &&
            (now - restT > REST_SECS * 1000 || qs.has('departAt')))
            travel();
        } else {
          Anim.frame(now);
        }
      } catch (e) {
        /* a bad frame must not kill the loop — but a lab should say why */
        ctx.fillStyle = '#e0a53a';
        ctx.font = '13px monospace';
        ctx.fillText('ERR ' + (e && e.message || e), 10, 24);
      }
      requestAnimationFrame(frame);
    }

    resize();
    deal();
    // synchronous first paint (the recital lesson) — and with
    // ?departAt the journey runs at parse end, so a baked still shows
    // the travelled state, never the race
    try {
      if (qs.has('departAt')) { travel(); Anim.frame(performance.now()); }
      else drawPose(performance.now());
    } catch (e) {
      ctx.fillStyle = '#e0a53a'; ctx.font = '13px monospace';
      ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.fillText('ERR ' + (e && e.message || e), 10, 24);
      if (e && e.stack) ctx.fillText(e.stack.split('\n')[1] || '', 10, 44);
    }
    requestAnimationFrame(frame);
  </script>

  <script src="nav.js?v=14"></script>
</body>

</html>
