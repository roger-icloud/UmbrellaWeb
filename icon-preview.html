<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>icon preview</title>
<style>
  body{background:#101418;color:#cfd8dc;font-family:system-ui,sans-serif;margin:24px}
  h1{font-size:16px;font-weight:600}
  .row{display:flex;gap:28px;align-items:flex-end;margin:24px 0}
  .cell{text-align:center}
  .cell p{font-size:11px;opacity:.6;margin:6px 0 0}
  .tile{border-radius:22%;display:block}
  .light{background:#fff;padding:14px;border-radius:8px}
  .label{font-size:11px;opacity:.5;margin-bottom:6px}
</style></head><body>
<h1>icon-coil.svg — draft</h1>
<div class="row">
  <div class="cell"><img src="icons/icon-coil.svg" width="256" class="tile"><p>256 (rounded tile)</p></div>
  <div class="cell"><img src="icons/icon-coil.svg" width="180" class="tile"><p>180 apple-touch</p></div>
  <div class="cell"><img src="icons/icon-coil.svg" width="128" class="tile"><p>128</p></div>
</div>
<div class="row">
  <div class="cell"><img src="icons/icon-coil.svg" width="64"><p>64</p></div>
  <div class="cell"><img src="icons/icon-coil.svg" width="48"><p>48</p></div>
  <div class="cell"><img src="icons/icon-coil.svg" width="32"><p>32</p></div>
  <div class="cell"><img src="icons/icon-coil.svg" width="16"><p>16 favicon</p></div>
</div>
<div class="row light">
  <div class="cell"><img src="icons/icon-coil.svg" width="128" class="tile"><p>on light</p></div>
</div>
<div class="row">
  <div class="cell"><p class="label">current</p><img src="icon-192.png" width="96"><p>old S-snake</p></div>
  <div class="cell"><p class="label">draft</p><img src="icons/icon-coil.svg" width="96"><p>coil</p></div>
</div>
</body></html>
