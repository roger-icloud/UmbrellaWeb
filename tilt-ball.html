<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#101418">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>Tilt Ball — NumberFun</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #101418;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      font-family: -apple-system, ui-monospace, Menlo, monospace;
    }

    canvas {
      display: block;
      position: fixed;
      inset: 0;
    }

    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: rgba(10, 14, 18, .85);
      color: #cfd8e0;
      z-index: 10;
      text-align: center;
      padding: 24px;
    }

    #overlay button {
      font-size: 20px;
      padding: 16px 32px;
      border-radius: 14px;
      border: none;
      background: #4da3ff;
      color: #fff;
      margin-top: 16px;
    }

    #overlay .sub {
      font-size: 13px;
      color: #8a97a3;
      margin-top: 14px;
      max-width: 340px;
    }

    #rotOverlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: rgba(10, 14, 18, .85);
      color: #cfd8e0;
      z-index: 9;
      text-align: center;
      padding: 24px;
    }

    #rotOverlay .sub {
      font-size: 13px;
      color: #8a97a3;
      margin-top: 14px;
      max-width: 340px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

  <canvas id="c"></canvas>

  <div id="rotOverlay" class="hidden">
    <div style="font-size:22px">Rotate back</div>
    <div class="sub">Tilt maths assumes portrait — paused until you're upright again.</div>
  </div>

  <div id="overlay">
    <div style="font-size:22px">Tilt Ball</div>
    <div class="sub">Steer the numbered ball into a hole that divides it.
      Tilt steers; so does dragging a finger.</div>
    <button id="go">Tap to enable tilt</button>
    <div class="sub" id="why">iOS requires this tap before it will share motion data.</div>
  </div>

  <script>
    'use strict';

    /* ---------- tunables ----------
       Steering matches the tilt-snake head: tilt (or a dragged finger)
       sets a target heading, the ball turns toward it proportionally
       capped by TURN_RATE, and speed scales with tilt magnitude. */
    const SMOOTHING = 0.18;   // low-pass on gravity input (0=none … 1=frozen)
    const BALL_SPEED = 150;   // design-px/s at full drive — same as SNAKE_SPEED
    const TURN_RATE = 5.0;    // rad/s hard cap on heading change
    const TURN_RESPOND = 6;   // /s proportional approach to target heading
    const TILT_DEAD = 0.4;    // gravity magnitude below which heading holds
    const FULL_TILT = 3.5;    // gravity magnitude giving full speed
    const IDLE_DRIVE = 0.15;  // fraction of speed while level / holding
    const TOUCH_FULL = 120;   // drag distance (design-px) giving full speed
    const EJECT_SECS = 0.45;  // coast after a refusal before steering resumes
    const FRICTION = 0.35;    // eject-coast damping per second
    const RESTITUTION = 0.55;   // wall bounciness 0..1
    const BALL_R = 26;
    const MAX_SPEED = 2600;   // safety cap

    /* ---------- bar-billiards holes ----------
       ROGER NOTE —
       · Holes are offered progressively (STAGES below); every deal is
         guaranteed a home among the holes on the table. Ambiguity is a
         feature — 35 can go into 5 or 7; the deeper fit twinkles and
         counts toward unlocking the next stage.
       · Wrong hole = refusal (amber rim flash, ball pushed back out);
         right hole = the ball sinks and a fresh value fades in.
       · Table reads like bar billiards: easy tests near the player,
         hard tests remote. The "?" hole accepts whatever no offered
         hole takes — it never claims primality, only "no match".
       · Things to consider/develop:
         – twinkle graduation: more varied glints when >2 holes fit,
           or for the experienced — parked as a later flourish
         – steering settled (2026-10-25): snake-head heading drive;
           the FORCE/VELOCITY/STEER modes and top-right button are
           retired.
         – capture feel: HOLE_R vs BALL_R gap, PUSH strength. */
    const HOLE_R = 30;        // hole rim radius
    const CAPTURE_IN = 14;    // ball centre must come this far inside the rim
    const HOLE_PUSH = 300;    // refusal ejection speed
    const HOLE_FLASH = 0.6;   // s of amber rim on refusal
    const SINK_SECS = 0.55;   // right-hole sink animation
    const BALL_FADE = 0.8;    // s for a dealt ball to fade in
    const HOLE_FADE = 0.8;    // s for a newly-unlocked hole to fade in
    const DEAL_MIN = 2;
    /* the table reads like bar billiards: the easy tests sit nearest
       the player (the ball is dealt low), the demanding ones are
       furthest — remote = difficult. Approach angle, not tightness,
       carries the difficulty; a rim is a rim.
       {v:0} is the "?" hole — it accepts whatever no OFFERED hole
       takes, so it can't lie: 49 fits 7 when 7 is out, else "?" —
       the hole never claims primality, it just asks the question. */
    const HOLES = [
      // near row — last-digit and digit-sum tests, easy approach
      { v: 2,  fx: 0.14, fy: 0.58 },
      { v: 3,  fx: 0.38, fy: 0.58 },
      { v: 5,  fx: 0.62, fy: 0.58 },
      { v: 10, fx: 0.86, fy: 0.58 },
      // middle row — table-membership tests, a deliberate aim
      { v: 7,  fx: 0.25, fy: 0.38 },
      { v: 8,  fx: 0.50, fy: 0.38 },
      { v: 9,  fx: 0.75, fy: 0.38 },
      // far row — the deep shots, cushion as backstop
      { v: 13, fx: 0.50, fy: 0.19 },
      { v: 0,  fx: 0.14, fy: 0.19, label: '?' },
    ];

    /* ---------- curriculum: stages ----------
       One scalar, `stage`, drives everything: which holes sit on the
       table, which numbers can be dealt, and when the "?" goes live.
       Rows open front-to-back — the table grows deeper as the
       questions do. This table is the management surface — edit
       rows, not code.
       · every deal is guaranteed a home among the offered holes
       · NEW_HOLE_BIAS of deals come from the newest hole's multiples
         (stage 0 has no "newest" — both holes are new)
       · MULTI_FIT_BIAS of deals carry a choice — values fitting >1
         hole are the only deals that can twinkle or advance
       · ADVANCE_STREAK consecutive sinks into the deepest fitting
         hole advance the stage — shallow choices reset the streak,
         forced (single-option) sinks neither advance nor reset
       Session-only for now; a saved profile just restores `stage`. */
    const STAGES = [
      { holes: [2, 5], ceiling: 20 },                        // last-digit tests
      { holes: [2, 3, 5], ceiling: 40 },                      // digit-sum arrives
      { holes: [2, 3, 5, 10], ceiling: 50 },                  // near row complete
      { holes: [2, 3, 5, 8, 9, 10], ceiling: 70 },            // mid row: membership
      { holes: [2, 3, 5, 7, 8, 9, 10], ceiling: 80 },         // 7: real division
      { holes: [2, 3, 5, 7, 8, 9, 10, 13], ceiling: 90 },     // far row: 26/39/52/78
      { holes: [2, 3, 5, 7, 8, 9, 10, 13, 0], ceiling: 100 }, // "?" goes live
    ];
    const NEW_HOLE_BIAS = 0.4;   // deals from the newest hole's multiples
    const MULTI_FIT_BIAS = 0.35; // deals offering a discrimination
    const ADVANCE_STREAK = 3;    // deepest-choice sinks in a row to stage up
    const TWINKLE_SECS = 0.7;    // glint marking a deepest-choice sink

    // Many Android devices report the motion axes with the opposite sign
    // convention to iOS. Auto-flip on Android; ?tilt=normal / ?tilt=invert
    // in the URL forces either way for testing.
    const qs = new URLSearchParams(location.search);
    const AXIS_FLIP = qs.get('tilt') === 'invert' ? true
      : qs.get('tilt') === 'normal' ? false
        : /android/i.test(navigator.userAgent);

    /* ---------- canvas: virtual resolution ----------
       Same scheme as snake.html: the sim runs in "design px" on a board
       DESIGN_W wide and a single scale K maps it to the device at render
       time, so distances and accelerations are a constant fraction of
       screen on any device. Height breathes. */
    const DESIGN_W = 375;
    /* same cap as tilt-snake: past K_MAX, widen the logical world rather
       than inflating the ball to parade size */
    const K_MAX = 1.8;
    const MIN_DESIGN_H = 480;
    const cv = document.getElementById('c');
    const ctx = cv.getContext('2d');
    let W = 0, H = 0, Wd = 0, Hd = 0, DPR = 1, K = 1;

    function resize() {
      const vv = window.visualViewport;
      const w = vv ? vv.width : window.innerWidth;
      const h = vv ? vv.height : window.innerHeight;
      if (w < 50 || h < 50) return;   // transient degenerate sizes
      DPR = Math.min(window.devicePixelRatio || 1, 3);
      W = w; H = h;
      K = Math.min(W / DESIGN_W, H / MIN_DESIGN_H, K_MAX);
      Wd = W / K; Hd = H / K;
      cv.width = W * DPR; cv.height = H * DPR;
      cv.style.width = W + 'px'; cv.style.height = H + 'px';
      ctx.setTransform(DPR * K, 0, 0, DPR * K, 0, 0);
      ball.x = Math.min(Math.max(ball.x, BALL_R), Wd - BALL_R);
      ball.y = Math.min(Math.max(ball.y, BALL_R), Hd - BALL_R);
    }
    window.addEventListener('resize', resize);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
    document.addEventListener('fullscreenchange', () => {
      resize();
      setTimeout(resize, 400);
    });

    /* ---------- state ---------- */
    const ball = { x: 0, y: 0, vx: 0, vy: 0 };
    let ballNum = 0;           // the numeral the ball carries (2..100)
    let lastNum = 0;           // avoid consecutive repeats
    let ballBorn = 0;          // fade-in clock (performance.now ms)
    let sink = null;           // {t0, hole} while a right hole swallows it
    let flashUntil = 0;        // wrong-hole amber rim timestamp
    let holeFlash = null;      // which hole is flashing
    let stage = 0;             // curriculum level (index into STAGES)
    let streak = 0;            // consecutive deepest-choice sinks
    let twinkleHole = null;    // hole carrying the deepest-choice glint
    let twinkleUntil = 0;
    resize();
    ball.x = Wd / 2; ball.y = Hd / 2;

    const holeX = h => h.fx * Wd, holeY = h => h.fy * Hd;

    function holeFits(h, n) {
      return h.v === 0
        ? !activeHoles().some(o => o.v !== 0 && n % o.v === 0)
        : n % h.v === 0;
    }

    /* the holes on the table at this stage — index into HOLES */
    const activeHoles = () =>
      HOLES.filter(h => STAGES[stage].holes.includes(h.v));

    /* which active holes would accept n — the fitting set */
    function fitsSet(n) {
      return activeHoles().filter(h => holeFits(h, n));
    }

    /* deepest fitting hole = the insight being tested —
       the prime hole is excluded: it's never a discrimination */
    function deepestHole(n) {
      let best = null;
      for (const h of fitsSet(n))
        if (h.v !== 0 && (!best || h.v > best.v)) best = h;
      return best;
    }

    function dealBall(now) {
      const ceil = STAGES[stage].ceiling;
      const act = activeHoles();
      /* build the pool: every value guaranteed a home among the
         offered holes; on the prime stage everything qualifies */
      const pool = [];
      for (let n = DEAL_MIN; n <= ceil; n++)
        if (act.some(h => holeFits(h, n))) pool.push(n);
      /* two biases, two jobs: NEW_HOLE_BIAS serves the just-unlocked
         holes' multiples so each new test is discovered promptly —
         computed as "added this stage" since a stage can open several
         holes; MULTI_FIT_BIAS serves values fitting >1 offered hole —
         the only deals that offer a discrimination, the only deals
         that can twinkle or advance */
      const prev = stage === 0 ? [] : STAGES[stage - 1].holes;
      const newVs = STAGES[stage].holes.filter(v => !prev.includes(v));
      const fresh = pool.filter(n => newVs.some(v => holeFits(HOLES.find(h => h.v === v), n)));
      const multi = pool.filter(n => fitsSet(n).length > 1);
      do {
        const roll = Math.random();
        const src = fresh.length && roll < NEW_HOLE_BIAS ? fresh
          : multi.length && roll < NEW_HOLE_BIAS + MULTI_FIT_BIAS ? multi
          : pool;
        ballNum = src[Math.floor(Math.random() * src.length)];
      } while (ballNum === lastNum && pool.length > 1);
      lastNum = ballNum;
      ball.x = Wd / 2 + (Math.random() - 0.5) * Wd * 0.3;
      ball.y = Hd * 0.72;
      ball.vx = ball.vy = 0;
      ballBorn = now;
      sink = null;
    }

    function advanceStage(now) {
      stage = Math.min(stage + 1, STAGES.length - 1);
      streak = 0;
      for (const h of activeHoles()) if (h.born === undefined) h.born = now;
    }
    let smX = 0, smY = 0;            // smoothed gravity
    let tiltOn = false;
    let touch = null;                // {x,y} while dragging
    let heading = -Math.PI / 2;      // direction of travel
    let ejectUntil = 0;              // timestamp: refusal coast ends
    let paused = false;              // true while rotated out of portrait

    /* ---------- motion permission (iOS 13+) ---------- */
    const overlay = document.getElementById('overlay');
    const whyEl = document.getElementById('why');

    function motionNeedsPermission() {
      return typeof DeviceMotionEvent !== 'undefined'
        && typeof DeviceMotionEvent.requestPermission === 'function';
    }

    document.getElementById('go').addEventListener('click', async () => {
      try {
        if (motionNeedsPermission()) {
          const res = await DeviceMotionEvent.requestPermission();
          if (res !== 'granted') {
            whyEl.textContent = 'Permission was "' + res +
              '" — tilt unavailable. Touch-drag still works; close this overlay?';
            document.getElementById('go').textContent = 'Continue without tilt';
            motionNeedsPermission.always = true;
            document.getElementById('go').onclick = () => overlay.classList.add('hidden');
            return;
          }
        }
        overlay.classList.add('hidden');
        tiltOn = true;
        // keep screen awake while probing (best-effort)
        if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => { });
        // try JS fullscreen (needs this user gesture); orientation lock has
        // better odds inside fullscreen, so attempt it after — both may be
        // refused, and the detect-and-warn guard copes either way
        const el = document.documentElement;
        const req = el.requestFullscreen || el.webkitRequestFullscreen;
        Promise.resolve(req ? req.call(el) : null)
          .catch(() => { })
          .then(() => {
            if (screen.orientation && screen.orientation.lock)
              screen.orientation.lock('portrait').catch(() => { });
          });
      } catch (e) {
        whyEl.textContent = 'Motion request failed: ' + e.message;
      }
    });

    // Non-iOS browsers expose no requestPermission; still offer the button as an OK.
    if (!motionNeedsPermission()) {
      document.getElementById('go').textContent = 'Start';
      whyEl.textContent = 'This browser does not gate motion behind a permission prompt.';
    }
    if (qs.has('peek')) overlay.classList.add('hidden');   // stills diagnostic

    window.addEventListener('devicemotion', (e) => {
      const g = e.accelerationIncludingGravity;
      if (!g || g.x === null) return;
      const gx = AXIS_FLIP ? -g.x : g.x;
      const gy = AXIS_FLIP ? -g.y : g.y;
      smX += (gx - smX) * SMOOTHING;
      smY += (gy - smY) * SMOOTHING;
    });

    /* ---------- touch steering ---------- */
    function setTouch(t) { touch = { x: t.clientX / K, y: t.clientY / K }; }
    cv.addEventListener('pointerdown', setTouch);
    cv.addEventListener('pointermove', (t) => { if (t.buttons) setTouch(t); });
    window.addEventListener('pointerup', () => touch = null);
    window.addEventListener('pointercancel', () => touch = null);
    cv.addEventListener('touchmove', (t) => t.preventDefault(), { passive: false });

    /* ---------- orientation guard ---------- */
    const rotOverlay = document.getElementById('rotOverlay');
    const handheld = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
    function checkOrientation() {
      const portrait = screen.orientation && screen.orientation.type
        ? screen.orientation.type.startsWith('portrait')
        : matchMedia('(orientation: portrait)').matches;
      // only handhelds need the upright guard — desktop landscape is legitimate
      paused = handheld && !portrait;
      rotOverlay.classList.toggle('hidden', portrait || !handheld);
    }
    window.addEventListener('orientationchange', checkOrientation);
    window.addEventListener('resize', checkOrientation);
    checkOrientation();

    // returning from lock/tab-switch: motion values can be stale —
    // drop the smoothed state so the ball doesn't lurch on resume
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) { smX = smY = 0; lastT = performance.now(); }
    });

    /* ---------- physics ----------
       Same steering model as tilt-snake's head: tilt (or a dragged
       finger) names a target heading, the ball turns toward it
       proportionally capped by TURN_RATE, and speed scales with
       tilt magnitude / drag distance. A refusal ejection coasts the
       ball out under FRICTION for EJECT_SECS, then steering resumes. */
    let lastT = performance.now();

    function wrapAngle(d) {
      while (d > Math.PI) d -= 2 * Math.PI;
      while (d < -Math.PI) d += 2 * Math.PI;
      return d;
    }

    function step(dt) {
      if (paused) return;

      if (performance.now() < ejectUntil) {
        const damp = Math.exp(-FRICTION * dt);
        ball.vx *= damp; ball.vy *= damp;
      } else {
        let target = null, drive = IDLE_DRIVE;
        if (touch) {
          const dx = touch.x - ball.x, dy = touch.y - ball.y;
          target = Math.atan2(dy, dx);
          drive = Math.max(IDLE_DRIVE, Math.min(Math.hypot(dx, dy) / TOUCH_FULL, 1));
        } else if (tiltOn) {
          // portrait assumption: gravity.x → screen right, gravity.y →
          // up-screen, so tilt top-of-device away → roll down ⇒ use -y
          const mag = Math.hypot(smX, smY);
          if (mag > TILT_DEAD) {
            target = Math.atan2(-smY, smX);
            drive = Math.max(IDLE_DRIVE, Math.min(mag / FULL_TILT, 1));
          }
        }
        if (target !== null) {
          const d = wrapAngle(target - heading);
          const amt = d * Math.min(1, TURN_RESPOND * dt);
          heading += Math.max(-TURN_RATE * dt, Math.min(TURN_RATE * dt, amt));
        }
        ball.vx = Math.cos(heading) * BALL_SPEED * drive;
        ball.vy = Math.sin(heading) * BALL_SPEED * drive;
      }

      const sp = Math.hypot(ball.vx, ball.vy);
      if (sp > MAX_SPEED) { ball.vx *= MAX_SPEED / sp; ball.vy *= MAX_SPEED / sp; }

      ball.x += ball.vx * dt;
      ball.y += ball.vy * dt;

      /* walls: reflect heading (the drive) AND velocity (the eject
         coast) — whichever mode the ball is in, it comes back in play */
      if (ball.x < BALL_R) { ball.x = BALL_R; heading = Math.PI - heading; ball.vx = Math.abs(ball.vx) * RESTITUTION; }
      if (ball.x > Wd - BALL_R) { ball.x = Wd - BALL_R; heading = Math.PI - heading; ball.vx = -Math.abs(ball.vx) * RESTITUTION; }
      if (ball.y < BALL_R) { ball.y = BALL_R; heading = -heading; ball.vy = Math.abs(ball.vy) * RESTITUTION; }
      if (ball.y > Hd - BALL_R) { ball.y = Hd - BALL_R; heading = -heading; ball.vy = -Math.abs(ball.vy) * RESTITUTION; }

      /* holes: the ball sinks only where its number belongs */
      if (sink) {
        const hx = holeX(sink.hole), hy = holeY(sink.hole);
        sink.k = Math.min(sink.k + dt / SINK_SECS, 1);
        const e = sink.k;
        ball.x += (hx - ball.x) * Math.min(1, 10 * dt);
        ball.y += (hy - ball.y) * Math.min(1, 10 * dt);
        ball.vx = ball.vy = 0;
        if (e >= 1) dealBall(performance.now());
      } else {
        for (const h of activeHoles()) {
          const dx = ball.x - holeX(h), dy = ball.y - holeY(h);
          const d = Math.hypot(dx, dy);
          if (d < HOLE_R - CAPTURE_IN) {
            if (holeFits(h, ballNum)) {
              sink = { hole: h, k: 0 };
              ball.vx = ball.vy = 0;
              /* deepest-choice detection: a discrimination only exists
                 when more than one hole fits — forced sinks are neutral */
              const fits = fitsSet(ballNum);
              if (fits.length > 1) {
                if (h === deepestHole(ballNum)) {
                  streak++;
                  twinkleHole = h;
                  twinkleUntil = performance.now() + TWINKLE_SECS * 1000;
                  if (streak >= ADVANCE_STREAK) advanceStage(performance.now());
                } else {
                  streak = 0;
                }
              }
            } else {
              flashUntil = performance.now() + HOLE_FLASH * 1000;
              holeFlash = h;
              ejectUntil = performance.now() + EJECT_SECS * 1000;
              const ux = dx / (d || 1), uy = dy / (d || 1);
              const sp = Math.max(Math.hypot(ball.vx, ball.vy), HOLE_PUSH);
              ball.vx = ux * sp; ball.vy = uy * sp;
              ball.x = holeX(h) + ux * (HOLE_R - CAPTURE_IN + 1);
              ball.y = holeY(h) + uy * (HOLE_R - CAPTURE_IN + 1);
            }
            break;
          }
        }
      }
    }

    /* ---------- draw ---------- */
    function draw(now) {
      ctx.clearRect(0, 0, Wd, Hd);

      /* the holes — sunken dark circles, rim, factor numeral; only the
         stage's offered set, each fading in on the frame it's unlocked */
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (const h of activeHoles()) {
        const appear = h.born === undefined ? 1
          : Math.min((now - h.born) / (HOLE_FADE * 1000), 1);
        ctx.globalAlpha = appear;
        const hx = holeX(h), hy = holeY(h);
        const flashing = h === holeFlash && now < flashUntil;
        ctx.fillStyle = h.v === 0 ? '#141a14' : '#0a0d10';
        ctx.beginPath(); ctx.arc(hx, hy, HOLE_R, 0, Math.PI * 2); ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = flashing ? '#e0a53a' :
          (h.v === 0 ? 'rgba(53,199,149,.45)' : 'rgba(120,150,175,.5)');
        ctx.beginPath(); ctx.arc(hx, hy, HOLE_R - 1, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = flashing ? '#e0a53a' : '#cfd8e0';
        ctx.font = (h.v === 0 ? '600 13px' : '600 18px') +
          ' -apple-system, system-ui, sans-serif';
        ctx.fillText(h.label || String(h.v), hx, hy);
        ctx.globalAlpha = 1;
      }

      /* the deepest-choice glint — a brief sparkle on the hole that
         took the ball, marking "there was a deeper answer and you
         found it"; never fires on a forced (single-fit) sink */
      if (twinkleHole && now < twinkleUntil) {
        const k = 1 - (twinkleUntil - now) / (TWINKLE_SECS * 1000);
        const a = Math.sin(k * Math.PI);          // 0→1→0 fade
        const gx = holeX(twinkleHole) + HOLE_R * 0.55;
        const gy = holeY(twinkleHole) - HOLE_R * 0.55;
        const s = 6 + 4 * a;                      // arm length swells mid-glint
        ctx.strokeStyle = `rgba(255,244,196,${a * 0.9})`;
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(gx - s, gy); ctx.lineTo(gx + s, gy);
        ctx.moveTo(gx, gy - s); ctx.lineTo(gx, gy + s);
        ctx.moveTo(gx - s * 0.45, gy - s * 0.45); ctx.lineTo(gx + s * 0.45, gy + s * 0.45);
        ctx.moveTo(gx + s * 0.45, gy - s * 0.45); ctx.lineTo(gx - s * 0.45, gy + s * 0.45);
        ctx.stroke();
      }

      /* the ball — fades/scales in on deal, shrinks away on sinking */
      if (!ballNum) return;
      const age = (now - ballBorn) / 1000;
      let a = Math.min(age / BALL_FADE, 1);
      let r = BALL_R * (0.6 + 0.4 * Math.min(age / BALL_FADE, 1));
      if (sink) { r *= (1 - sink.k) * (1 - sink.k); a *= 1 - sink.k; }
      if (r < 0.5 || a <= 0) return;
      ctx.globalAlpha = a;
      const grd = ctx.createRadialGradient(
        ball.x - r * 0.35, ball.y - r * 0.35, r * 0.2,
        ball.x, ball.y, r);
      grd.addColorStop(0, '#8ec9ff');
      grd.addColorStop(1, '#1660c8');
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = '700 ' + Math.round(r * 0.9) + 'px -apple-system, system-ui, sans-serif';
      ctx.fillText(String(ballNum), ball.x, ball.y + 1);
      ctx.globalAlpha = 1;
    }

    function frame(now) {
      const dt = Math.min((now - lastT) / 1000, 0.05);
      lastT = now;
      step(dt);
      draw(now);
      requestAnimationFrame(frame);
    }
    dealBall(performance.now());
    requestAnimationFrame(frame);
  </script>
