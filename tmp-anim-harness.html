<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>anim harness</title>
<style>body{margin:0;background:#101418}canvas{display:block}</style></head>
<body><canvas id="cv"></canvas>
<script src="anim.js?v=23"></script>
<script>
'use strict';
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const W = 800, H = 600;
cv.width = W; cv.height = H;
const segD = 36, N = 13;
let run = 0;
function mkSegs() {
  const segs = [{ x: 400, y: 140, expected: 0 }];
  for (let i = 1; i < N; i++)
    segs.push({ x: 400 - i * 26, y: 140 + Math.sin(i) * 4, expected: i * 5, filled: true });
  return segs;
}
let t0 = 0, times = [];
function begin() {
  run++;
  t0 = performance.now();
  Anim.begin({
    ctx, W, H,
    board: { x: 12, y: 56, w: W - 24, h: H - 116 },
    segD, table: 5 + run, segs: mkSegs(), kind: 'home',
    target: { x: 80 + run * 120, y: 560 },
    onDone: () => console.log('run', run, 'done'),
    onFade: () => console.log('run', run, 'fade')
  });
}
let status = '', pending = false;
window.addEventListener('error', e => {
  status = 'ERR ' + e.message + '@' + (e.filename || '').split('/').pop() + ':' + e.lineno;
});
let sawGone = false;
function frame(now) {
  Anim.frame(now);
  if (Anim.state === 'gone' && !sawGone) {
    sawGone = true;
    times.push('r' + run + '=' + ((now - t0) / 1000).toFixed(1) + 's');
  }
  if (Anim.state === 'gone' && run < 3 && !pending) {
    pending = true;
    setTimeout(() => { pending = false; sawGone = false; begin(); }, 400);
  }
  else if (Anim.state === 'gone' && run >= 3) status = 'all runs complete';
  ctx.font = '14px monospace'; ctx.fillStyle = '#e0a53a';
  ctx.fillText('run=' + run + ' ' + Anim.state + ' [' + times.join(' ') + '] ' + status, 12, 20);
  requestAnimationFrame(frame);
}
begin();
requestAnimationFrame(frame);
</script></body></html>
