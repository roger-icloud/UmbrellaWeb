<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#101418">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>Snake Puzzle — NumberFun</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #101418;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      font-family: Andika, -apple-system, system-ui, sans-serif;
    }

    canvas {
      display: block;
      position: fixed;
      inset: 0;
    }

    #chipRow {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      padding: 0 12px;
      z-index: 5;
    }

    #chipRow button {
      min-width: 44px;
      height: 44px;
      font-size: 15px;
      font-family: inherit;
      border-radius: 10px;
      border: 1px solid #3a4a58;
      background: rgba(30, 42, 54, .9);
      color: #cfd8e0;
    }

    /* a table finished this visit keeps a faint ring in its colour */
    #chipRow button.made {
      box-shadow: 0 0 0 2px var(--made);
    }

    #chipRow button.on {
      border-color: #4da3ff;
      color: #fff;
      background: rgba(40, 64, 88, .95);
    }

    /* table choice happens between games only — once a child starts
       dragging, the chips dim so the puzzle owns the screen */
    #chipRow button:disabled {
      opacity: .22;
      pointer-events: none;
    }

    #chipRow.locked button {
      opacity: .35;
      pointer-events: none;
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: rgba(10, 14, 18, .88);
      color: #cfd8e0;
      z-index: 10;
      text-align: center;
      padding: 24px;
    }

    .overlay .title {
      font-size: 22px;
    }

    .overlay .sub {
      font-size: 13px;
      color: #8a97a3;
      margin-top: 14px;
      max-width: 340px;
    }

    .overlay button.go {
      font-size: 20px;
      padding: 16px 32px;
      border-radius: 14px;
      border: none;
      background: #4da3ff;
      color: #fff;
      margin-top: 16px;
    }

    .overlay .btnrow {
      display: flex;
      gap: 14px;
    }

    .overlay button.quiet {
      background: rgba(40, 64, 88, .95);
      color: #cfd8e0;
      border: 1px solid #3a4a58;
    }

    /* the end-bar fades up in the bottom strip while the coiled snake
       and its numeral stay on screen above it */
    #doneBar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 10px 18px;
      z-index: 12;
      color: #cfd8e0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }

    #doneBar.show {
      opacity: 1;
      pointer-events: auto;
    }

    #doneBar .prompt {
      font-size: 18px;
      font-weight: 600;
    }

    #doneBar button {
      font-size: 17px;
      font-family: inherit;
      padding: 10px 24px;
      border-radius: 12px;
      border: none;
      background: #4da3ff;
      color: #fff;
    }

    #doneBar button.quiet {
      background: rgba(40, 64, 88, .95);
      color: #cfd8e0;
      border: 1px solid #3a4a58;
    }

    .hidden {
      display: none !important;
    }

  </style>
  <link rel="preload" href="fonts/andika-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/andika-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts/andika.css">
  <meta name="description" content="Fill the missing beads on a number snake — a calm times-table puzzle where two tables can cross.">
</head>

<body>

  <canvas id="c"></canvas>
  <div id="snakeCameo" style="position:fixed;inset:0;pointer-events:none;overflow:hidden"></div>
  <div id="chipRow"></div>

  <div id="rotOverlay" class="overlay hidden">
    <div class="title">Turn upright</div>
    <div class="sub">The game waits for you.</div>
  </div>

  <div id="doneBar">
    <span class="prompt">Another snake?</span>
    <button id="againYes">Yes</button>
    <button class="quiet" id="againNo">No</button>
  </div>

  <script src="snake.js?v=2"></script>
  <script src="anim.js?v=16"></script>
  <script src="progress.js"></script>

  <script>
    'use strict';

    /* ---------- tunables ---------- */
    /* the ladder: each finished snake makes the next a step harder.
       Same for every child (exploratory, not yet adaptive); held for
       the visit only. gaps = empty places, big = how strongly the gaps
       lean to the large multiples, run = gaps side by side */
    const LADDER = [
      { gaps: 4, big: 0,   run: 0 },  // as it was
      { gaps: 4, big: 0.7, run: 0 },  // larger multiples more often
      { gaps: 5, big: 0.7, run: 0 },  // a fifth gap
      { gaps: 5, big: 0.7, run: 2 },  // a pair side by side
      { gaps: 6, big: 0.8, run: 3 },  // a run of three
      { gaps: 7, big: 0.8, run: 3 },  // seven gaps, a run of three
      { gaps: 9, big: 0.8, run: 4 },  // nine gaps, a run of four
      { gaps: 11, big: 0, run: 0 },   // bald — every place but the x1
                                      // foothold is missing; finishing
                                      // this rung brings the second snake
    ];
    const BIG_FROM = 7;         // "large" means ×7 and above
    const DROP_TOL = 1.1;       // drop acceptance radius, in segment diameters
    const SPAWN_POS = { x: 0.88, y: 0.12 }; // normalized point the numbers appear at
    /* the number's arrival — a moment after the snake, with a pop
       and a spreading ring: "here I am, ready to be placed" */
    const SPAWN_DELAY = 0.9;    // s after the snake before the first number
    const SPAWN_NEXT = 0.35;    // s after a placement before the next number
    const FLOURISH_SECS = 0.6;  // the pop: grows past full size, settles
    const RING_SECS = 0.9;      // the ring of light spreading from it
    const READY_EVERY = 2.6;    // s between softer rings while it waits; 0 = none
    const SHAKE_SECS = 0.45;    // refusal shake on the mistaken segment
    const RETURN_MS = 700;      // a missed piece glides home, not snaps
    const HESITATE_SECS = 5;    // a piece left waiting this long counts
                                // as hesitation for the fluency jump
    const TOUCH_LIFT = 1.0;     // bead-widths the piece rides above a finger
    const TOUCH_RING = 0.95;    // the doughnut: a coin the finger pushes,
                                // not a stick it balances
    const FLASH_SECS = 0.6;     // amber ring on a refused drop
    const TOP_RESERVE = 92;     // clearance below the menu button
    const BOT_RESERVE = 116;    // room for the table chips
    const BOARD_PAD = 16;
    const IDLE_WRIG_S = 10;     // s of stillness before the restless wriggle
    const WRIG_CYCLE = 7;       // s between wriggle bursts while idle
    const WRIG_SECS = 1.6;      // s in one burst
    const WRIG_AMP = 0.14;      // peak sway, × segD — draw-time only
    /* head animation — the pose is static, so the life is in the eyes:
       they drift toward the piece waiting to be placed and blink now
       and then (same grammar as the shared SnakeEyesView) */
    const GAZE_MAX = 0.85;      // rad the eyes may wander off the facing direction
    const GAZE_EASE = 0.14;     // per-frame approach of gaze to its target
    const BLINK_MIN = 2.4, BLINK_MAX = 6;  // s between blinks
    const BLINK_SECS = 0.28;    // lid dip duration
    /* the celebration — the snake stays where it is: its segments light
       ×1…×12, a satisfied wiggle, then it looks up at you and winks */
    const BEAT_STAGGER = 0.11;  // s between segment highlights, head → tail
    const BEAT_HOLD = 0.45;     // each highlight lingers this long
    const CHEER_AT = 1.6;       // s in: the wiggle starts, over the beat's tail
    const CHEER_SECS = 1.4;     // s of wiggling
    const CHEER_AMP = 0.3;      // peak sway, × segD
    const LOOK_AT = 2.8;        // s in: the head turns to face you
    const LOOK_SECS = 0.5;      // s for the turn
    const LOOK_GROW = 0.1;      // the head comes a little toward you
    const WINK_AT = 3.5;        // s in: one slow wink
    const WINK_SECS = 0.7;      // s for the wink, held shut in the middle
    const ASK_AT = 4.2;         // s in: "Another snake?" fades up
    const MADE_RING = 0.7;      // ring a finished table's chip keeps; 0 = none
    /* the opening — once per device, on the first visit */
    const DEMO_TABLE = 2;       // easy to follow
    const DEMO_BLANKS = 2;      // numbers the opening completes
    const DEMO_START = 1.6;     // s the snake is seen before the first number
    const DEMO_LOOK = 1.8;      // s the new number is seen before it's carried
    const DEMO_LIFT = 0.5;      // s it lifts before it moves, and settles after
    const DEMO_CARRY = 2.4;     // s to carry it home
    const DEMO_NEXT = 1.2;      // s after a placement before the next number
    const DEMO_PAUSE = 2.6;     // s the finished snake stands
    const DEMO_WRIG = 2.2;      // s of completion wriggle in the pause
                                // — the only wiggle the opening plays
                                // (Roger, 2026-11-17)
    const DEMO_DARK = 1.1;      // s fade out
    const DEMO_UP = 1.1;        // s fade up to the fresh puzzle
    /* the opening's number floats; a child's drag stays plain */
    const FLOAT_RISE = 0.35;    // × segment: how high it lifts before moving
    const SHADOW = 0.8;         // shadow strength under it; 0 = none
    const SHADOW_GROUND = true; // true: shadow keeps to the straight path
                                // false: shadow stays directly beneath it
    const SHADOW_STYLE = 'outline';  // 'dark' shadow, 'light' — a pale
                                  // reflection on the dark floor, or
                                  // 'outline' — a faint ring on the floor
                                  // (?shadow=light / ?shadow=outline
                                  // try them without editing)

    /* ---------- canvas ---------- */
    const cv = document.getElementById('c');
    const ctx = cv.getContext('2d');
    let W = 0, H = 0, DPR = 1;
    let bX = 0, bY = 0, bW = 0, bH = 0;   // board rect (css px)
    let segD = 48, segDBase = 48;

    function resize() {
      const vv = window.visualViewport;
      W = vv ? vv.width : window.innerWidth;
      H = vv ? vv.height : window.innerHeight;
      if (W < 50 || H < 50) return;
      DPR = Math.min(window.devicePixelRatio || 1, 3);
      cv.width = W * DPR; cv.height = H * DPR;
      cv.style.width = W + 'px'; cv.style.height = H + 'px';
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      bX = BOARD_PAD; bY = TOP_RESERVE;
      bW = W - 2 * BOARD_PAD; bH = H - TOP_RESERVE - BOT_RESERVE;
      segDBase = Math.max(34, Math.min(72, Math.min(bW, bH) * 0.14));
      segD = duoOn ? Math.round(segDBase * 0.85) : segDBase;
      layout();
    }
    window.addEventListener('resize', resize);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

    /* ---------- poses ----------
       Poses come from Anim.pose — the shared heading-walk grammar:
       segment-adjacent points exactly one spacing apart, so the body
       is continuous AND already trail-ready. The celebration lifts the
       dealt pose as-is; nothing rearranges at the handover. rail is
       normalized 0..1 over a square centred on the board. */

    /* ---------- colours (same table-coding as the family) ---------- */
    function tableColour(t) { return 'hsl(' + ((t * 31 + 200) % 360) + ',60%,45%)'; }
    function lcm(a, b) { let x = Math.max(a, b); while (x % a || x % b) x++; return x; }

    /* ---------- state ---------- */
    const N = 13;                 // head + twelve body segments
    let table = 3;
    let rail = [];               // normalized points
    let segs = [];               // {x,y, expected, filled, blank}
    let blanks = [];             // indices into segs awaiting values
    let remaining = [];          // values still to spawn
    let spawned = null;          // {value, x, y, born} — the piece in hand
    let dragging = false;
    let touchDrag = false;         // finger drags lift the piece above
    let shakeTgt = null, shakeT = 0;  // {sn, i} — the refused bead
    let flashTgt = null, flashT = 0;
    let gaze = 0, nextBlinkAt = 0, blinkT0 = -1;
    let hasInteracted = false;
    let state = 'choose';        // choose | play | celebrate | done —
    // Roger 2026-11-18: the board opens uncommitted; the first chip
    // tap deals (the old default ×3 choice is the visitor's now)
    let startT = 0, doneMs = 0;
    let lastAct = 0;             // last touch — a still patch wriggles
    let misses = 0;
    let hesits = 0;            // pieces left waiting past HESITATE_SECS
    let poseSeed = 0;            // seed of the dealt pose — shareable
    let cheerT = 0;              // when the celebration began
    let winAct = 'wink';         // this completion's closing expression
    const qs = new URLSearchParams(location.search);

    /* two snakes sharing one bead — rung 2 of the tables progression
       (Roger, 2026-11-15): the only blank on the board is the
       crossover, the one number belonging to both tables; the child
       can read it off either snake and meets the overlap without a
       word of instruction. ?duo=a,b pins the pair; bare ?duo picks a
       pair with exactly one shared multiple within x12. Chips hide —
       the pair is fixed for the round. */
    const DUO_ARG = qs.get('duo');
    const DUO = DUO_ARG !== null;
    const DUO_PAIRS = [
      [2, 7], [2, 9], [2, 11], [3, 7], [3, 8], [3, 10], [3, 11],
      [4, 7], [4, 9], [4, 11], [5, 6], [5, 7], [5, 8], [5, 9], [5, 11],
      [5, 12], [6, 7], [6, 11], [7, 8], [7, 9], [7, 10], [7, 11],
      [7, 12], [8, 9], [8, 11], [9, 10], [9, 11], [10, 11], [10, 12],
      [11, 12]];
    const duoOk = ([a, b]) => {
      const v = lcm(a, b);
      return v / a >= 2 && v / b >= 2 && v / a <= 12 && v / b <= 12;
    };
    function duoPair() {
      const m = /^\s*(\d+)\s*,\s*(\d+)\s*$/.exec(DUO_ARG || '');
      if (m) {
        const p = [Math.min(+m[1], +m[2]), Math.max(+m[1], +m[2])];
        if (p[0] >= 2 && p[1] <= 12 && p[0] !== p[1] && duoOk(p))
          return p;
      }
      /* in natural progression the pair keeps the table the child
         was just playing, so the newcomer is the only stranger */
      const anchored = DUO_PAIRS.filter(p => p[0] === table || p[1] === table);
      const src = anchored.length ? anchored : DUO_PAIRS;
      return src[(Math.random() * src.length) | 0];
    }
    let table2 = 0;                 // the second snake's table (duo)
    let rail2 = [], segs2 = [];     // its pose and beads
    let xA = -1, xB = -1, xVal = 0; // crossover: index in each, value
    let xQueue = [];               // which snake each shared disk is for
    let duoNext = false;            // set once the bald rung is finished
    let duoPick = 0;                // partner the child chose (0 = auto-pair)
    let duoOn = false;              // this deal plays two snakes
    // the ladder rung, for this visit only; ?rung=N starts on rung N (from 1)
    const RUNG_KEY = 'snakePuzzleRung';
    let rung = 0;
    function setRung(n) {
      rung = Math.max(0, Math.min(LADDER.length - 1, n));
      try { sessionStorage.setItem(RUNG_KEY, String(rung)); } catch (e) {}
    }
    try { rung = +sessionStorage.getItem(RUNG_KEY) || 0; } catch (e) {}
    if (qs.has('rung')) setRung((+qs.get('rung') || 1) - 1);
    // the tables finished this visit — their chips keep a faint ring
    const MADE_KEY = 'snakePuzzleMade';
    let made = [];
    try { made = JSON.parse(sessionStorage.getItem(MADE_KEY)) || []; } catch (e) {}
    function addMade(t) {
      if (!made.includes(t)) made.push(t);
      try { sessionStorage.setItem(MADE_KEY, JSON.stringify(made)); } catch (e) {}
    }
    // ?poseSeed=N pins every deal's pose for reproduction/auditioning
    const pinSeed = qs.has('poseSeed') ?
      (parseInt(qs.get('poseSeed'), 10) || 0) : null;
    /* house-snake curtain call (Roger, 2026-11-15): as "Another
       snake?" fades up, the posed snake rises at the footlights and
       plays a random expression — wink, double-blink, or a 360° turn
       in one of the three planes. ?expr=<name> forces the
       expression; ?demo=cameo previews it ~1s after load. */
    /* cartoon cameo shelved while Roger thinks (2026-11-15) —
       ?cameo=on brings it back for audition */
    const CAMEO = qs.get('cameo') === 'on';
    const EXPR = qs.get('expr');
    /* ?expr=<face> also forces the celebration's closing action on
       the little head (shared repertoire in snake.js); ?duo=a,b or
       bare ?duo deals the two-snake crossover round (see below) */

    const chipRow = document.getElementById('chipRow');
    const rotOverlay = document.getElementById('rotOverlay');
    const doneBar = document.getElementById('doneBar');

    function layout() {
      // normalized rail -> board px, inside the centred board square
      if (!rail.length) return;
      const sq = Math.min(bW, bH);
      for (let i = 0; i < N; i++) {
        segs[i].x = bX + (bW - sq) / 2 + rail[i].x * sq;
        segs[i].y = bY + (bH - sq) / 2 + rail[i].y * sq;
        if (duoOn && rail2.length) {
          segs2[i].x = bX + (bW - sq) / 2 + rail2[i].x * sq;
          segs2[i].y = bY + (bH - sq) / 2 + rail2[i].y * sq;
        }
      }
      if (spawned && !dragging) homeSpawn();
      if (qs.has('dbg'))
        document.title = segs.map(p => Math.round(p.x) + ',' +
          Math.round(p.y)).join(' ');
    }

    function spawnHome() {
      /* the number appears clear of the snake: try the usual spot first,
         then corners and edge midpoints; first with room wins, else the
         roomiest (Roger 2026-11-19 — a pose sometimes sat on the spawn) */
      const mx = Math.max(0.10, segD / bW * 1.1),
            my = Math.max(0.10, segD / bH * 1.1);
      const cands = [
        SPAWN_POS,
        { x: mx, y: my }, { x: 1 - mx, y: 1 - my }, { x: mx, y: 1 - my },
        { x: 0.5, y: my }, { x: 0.5, y: 1 - my },
        { x: mx, y: 0.5 }, { x: 1 - mx, y: 0.5 },
      ];
      const CLEAR = segD * 2.0;   // centre distance that counts as room
      let best = null, bestD = -1;
      for (const c of cands) {
        const x = bX + c.x * bW, y = bY + c.y * bH;
        let d = Infinity;
        for (const s of segs) d = Math.min(d, Math.hypot(x - s.x, y - s.y));
        for (const s of segs2) d = Math.min(d, Math.hypot(x - s.x, y - s.y));
        if (d >= CLEAR) return { x, y };
        if (d > bestD) { bestD = d; best = { x, y }; }
      }
      return best;
    }
    function homeSpawn(animate) {
      const p = spawnHome();
      if (animate && spawned) {
        spawned.retT = performance.now();
        spawned.retFrom = { x: spawned.x, y: spawned.y };
      } else if (spawned) {
        spawned.x = p.x; spawned.y = p.y; spawned.retT = 0;
      }
    }

    function spawnNext(delay) {
      if (!remaining.length) { spawned = null; return; }
      const k = Math.floor(Math.random() * remaining.length);
      const value = remaining.splice(k, 1)[0];
      spawned = { value, x: 0, y: 0,
        sn: duoOn && value === xVal ? xQueue.pop() : -1,
        born: performance.now() + (delay || 0) * 1000 };
      homeSpawn();
    }

    function dealCrossover() {
      /* a chosen partner keeps the played table on snake 1 — pair order
         is by who was picked, not by size (Roger 2026-11-19) */
      const pair = duoPick ? [table, duoPick] : duoPair();
      duoPick = 0;
      table = pair[0]; table2 = pair[1];
      xVal = lcm(table, table2);
      xA = xVal / table; xB = xVal / table2;
      segs2 = [];
      for (let i = 0; i < N; i++)
        segs2.push({
          x: 0, y: 0,
          expected: i === 0 ? 0 : i * table2,
          filled: true, blank: false
        });
      segs2[xB].filled = false; segs2[xB].blank = true;
      const step = Math.hypot(rail[1].x - rail[0].x,
        rail[1].y - rail[0].y);
      const M = 0.05;
      let best = null, bestGap = -1, lastB2 = null;
      for (let k = 0; k < 120 && (!best || bestGap <= step * 1.05); k++) {
        const r2 = Anim.pose({
          board: { x: bX, y: bY, w: bW, h: bH },
          segD, count: N,
          family: qs.get('pose') || 'any',
          seed: poseSeed + 1 + k
        }).rail;
        const dx = rail[xA].x - r2[xB].x, dy = rail[xA].y - r2[xB].y;
        const m2 = r2.map(p => ({ x: p.x + dx, y: p.y + dy }));
        /* slide the pair together so both snakes sit inside */
        const all = rail.concat(m2);
        const mnx = Math.min(...all.map(p => p.x)),
          mxx = Math.max(...all.map(p => p.x)),
          mny = Math.min(...all.map(p => p.y)),
          mxy = Math.max(...all.map(p => p.y));
        const sx = mnx < M ? M - mnx : mxx > 1 - M ? 1 - M - mxx : 0;
        const sy = mny < M ? M - mny : mxy > 1 - M ? 1 - M - mxy : 0;
        const a2 = rail.map(p => ({ x: p.x + sx, y: p.y + sy }));
        const b2 = m2.map(p => ({ x: p.x + sx, y: p.y + sy }));
        lastB2 = b2;
        if (mnx + sx < M - 1e-9 || mxx + sx > 1 - M + 1e-9 ||
            mny + sy < M - 1e-9 || mxy + sy > 1 - M + 1e-9) continue;
        let gap = Infinity;
        for (let i = 0; i < N; i++)
          for (let j = 0; j < N; j++) {
            if (i === xA && j === xB) continue;
            const d = Math.hypot(a2[i].x - b2[j].x,
              a2[i].y - b2[j].y);
            if (d < gap) gap = d;
          }
        if (gap > bestGap) { bestGap = gap; best = { a2, b2 }; }
      }
      if (best) { rail = best.a2; rail2 = best.b2; }
      else rail2 = lastB2;   // rare: accept the crossing anyway
    }

    /* which places are empty: a fixed count (the opening) is spread
       evenly; otherwise the current rung of the ladder decides. Never
       the head, never ×1 — the first multiple stays as the foothold */
    function pickBlanks(fixed) {
      const pool = [];
      for (let i = 2; i < N; i++) pool.push(i);
      const take = i => { pool.splice(pool.indexOf(i), 1); return i; };
      const any = list => list[Math.floor(Math.random() * list.length)];
      const out = [];
      if (fixed !== undefined) {
        while (out.length < fixed && pool.length) out.push(take(any(pool)));
        return out;
      }
      const r = LADDER[Math.min(rung, LADDER.length - 1)];
      if (r.run > 1) {
        const last = N - r.run;
        const lo = Math.random() < r.big ? Math.min(Math.max(2, BIG_FROM), last) : 2;
        const s0 = lo + Math.floor(Math.random() * (last - lo + 1));
        for (let i = 0; i < r.run; i++) out.push(take(s0 + i));
      }
      // after the first rung the other gaps keep a neighbour each, so
      // the only gaps side by side are the run the rung asks for
      const apart = r.big > 0 || r.run > 0;
      while (out.length < r.gaps && pool.length) {
        let free = apart
          ? pool.filter(i => !out.includes(i - 1) && !out.includes(i + 1))
          : pool;
        if (!free.length) free = pool;
        const big = free.filter(i => i >= BIG_FROM);
        out.push(take(any(big.length && Math.random() < r.big ? big : free)));
      }
      return out;
    }

    function deal(fixedBlanks) {
      poseSeed = pinSeed !== null ? pinSeed
        : Math.floor(Math.random() * 1e9);
      duoOn = DUO || duoNext;
      /* two bodies need more room — smaller beads on duo deals so
         poses can still breathe on narrow screens */
      segD = duoOn ? Math.round(segDBase * 0.85) : segDBase;
      rail = Anim.pose({
        board: { x: bX, y: bY, w: bW, h: bH },
        segD, count: N,
        family: qs.get('pose') || 'any',
        seed: poseSeed
      }).rail;
      if (duoOn) dealCrossover();
      segs = [];
      for (let i = 0; i < N; i++) {
        segs.push({
          x: 0, y: 0,
          expected: i === 0 ? 0 : i * table,
          filled: true, blank: false
        });
      }
      if (duoOn) {
        segs[xA].filled = false; segs[xA].blank = true;
        blanks = [xA];
        /* five blanks in all — the crossover plus two more on each
           snake, so there's real choosing to do (Roger: only one
           destination is no puzzle at all) */
        /* the shared value spawns twice — once per snake — so the
           share is enacted, not just rendered (Roger 2026-11-19) */
        remaining = [xVal, xVal];
        xQueue = [0, 1].sort(() => Math.random() - 0.5);
        const extra = (L, excl) => {
          const pool = [];
          for (let i = 2; i < N; i++) if (i !== excl) pool.push(i);
          for (let k = 0; k < 2 && pool.length; k++) {
            const i = pool.splice((Math.random() * pool.length) | 0, 1)[0];
            L[i].filled = false; L[i].blank = true;
            remaining.push(L[i].expected);
          }
        };
        extra(segs, xA); extra(segs2, xB);
        remaining.sort(() => Math.random() - 0.5);
      } else {
        blanks = pickBlanks(fixedBlanks);
        remaining = [];
        for (const j of blanks) {
          segs[j].filled = false; segs[j].blank = true;
          remaining.push(segs[j].expected);
        }
        remaining.sort(() => Math.random() - 0.5);
      }
      /* the crossover deal: snake B's pose is tried on seeds until
         one sits clean — the shared bead pinned exactly on A's, the
         rest of its body keeping a bead's width clear, and the pair
         shifted together so both live inside the square */
      layout();
      spawnNext(SPAWN_DELAY);
      hasInteracted = false;
      misses = 0; hesits = 0;
      state = 'play';
      startT = performance.now();
      lastAct = startT;
      gaze = Math.atan2(segs[0].y - segs[1].y, segs[0].x - segs[1].x);
      nextBlinkAt = startT + 2000 + Math.random() * 2000;
      blinkT0 = -1;
      chipRow.classList.remove('locked');
      chipRow.classList.toggle('hidden', duoOn);
      doneBar.classList.remove('show');
    }

    /* ---------- chips ---------- */
    const chipBtns = [];
    for (let t = 2; t <= 12; t++) {
      const b = document.createElement('button');
      b.textContent = '×' + t;
      b.addEventListener('click', () => {
        lastAct = performance.now();
        /* partner mode: once the second snake is unlocked, 'choose' picks
           only the stranger — snake 1 keeps the table just played */
        if (state === 'choose' && partnerMode()) {
          duoPick = t; deal(); return;
        }
        if (state === 'choose') { table = t; syncChips(); deal(); return; }
        if (state !== 'play' || hasInteracted) return;
        if (t === table) return;
        table = t;
        syncChips();
        deal();
      });
      chipBtns.push(b);
      chipRow.appendChild(b);
    }
    function partnerMode() {
      return state === 'choose' && (duoNext || duoOn);
    }
    function syncChips() {
      const pm = partnerMode();
      chipBtns.forEach((b, i) => {
        const t = i + 2, m = MADE_RING > 0 && made.includes(t);
        /* only tables that genuinely cross with the played one are
           offered — e.g. ×7 has partners, ×11 has few (Roger 2026-11-19) */
        b.disabled = pm && !(t !== table && duoOk([table, t]));
        b.classList.toggle('on', t === table);
        b.classList.toggle('made', m);
        b.style.setProperty('--made', m ?
          'hsla(' + ((t * 31 + 200) % 360) + ',60%,55%,' + MADE_RING + ')' : '');
      });
      chipRow.classList.toggle('locked',
        hasInteracted && (state === 'play' || state === 'celebrate'));
      UW.paint(chipRow, 'puzzle');
    }

    /* ---------- input ---------- */
    function pt(e) {
      const r = cv.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    }

    cv.addEventListener('pointerdown', e => {
      lastAct = performance.now();
      if (state !== 'play' || !spawned) return;
      if (performance.now() < spawned.born) return;   // not arrived yet
      const p = pt(e);
      if (Math.hypot(p.x - spawned.x, p.y - spawned.y) <= segD * 0.7) {
        dragging = true;
        touchDrag = e.pointerType === 'touch';
        spawned.retT = 0;              // grabbing cancels a glide home
        hasInteracted = true;
        syncChips();
        cv.setPointerCapture(e.pointerId);
        e.preventDefault();
      }
    });

    cv.addEventListener('pointermove', e => {
      if (!dragging || !spawned) return;
      lastAct = performance.now();
      const p = pt(e);
      spawned.x = p.x;
      spawned.y = p.y - (touchDrag ? segD * TOUCH_LIFT : 0);
    });

    cv.addEventListener('pointerup', e => {
      if (!dragging || !spawned) return;
      dragging = false;
      lastAct = performance.now();
      const p = pt(e);
      /* judge the drop where the bead visibly sits, not the fingertip
         — on touch the bead rides above the finger */
      const ey = p.y - (touchDrag ? segD * TOUCH_LIFT : 0);
      touchDrag = false;
      // nearest bead within tolerance, across however many snakes
      const lists = duoOn ? [segs, segs2] : [segs];
      let hit = null, hitSn = 0, hitI = -1, bestD = segD * DROP_TOL;
      lists.forEach((L, sn) => L.forEach((s, i) => {
        const d = Math.hypot(p.x - s.x, ey - s.y);
        if (d < bestD) { bestD = d; hit = s; hitSn = sn; hitI = i; }
      }));
      if (hit && hit.blank && hit.expected === spawned.value) {
        if (duoOn && spawned.sn >= 0) {
          /* the crossover is ONE bead claimed by both snakes — the drop
             fills only the disk's own snake's half (Roger 2026-11-19) */
          const bead = lists[spawned.sn]
            .find(s => s.blank && s.expected === spawned.value);
          bead.filled = true; bead.blank = false;
        } else {
          // a plain value fills every snake that expects it
          lists.forEach(L => L.forEach(s => {
            if (s.blank && s.expected === spawned.value) {
              s.filled = true; s.blank = false;
            }
          }));
        }
        if (performance.now() - spawned.born > HESITATE_SECS * 1000)
          hesits++;
        spawnNext(SPAWN_NEXT);
        if (!spawned) finish();
      } else if (hit) {
        // a real target, but not this number's home — refusal is information
        shakeTgt = { sn: hitSn, i: hitI }; shakeT = performance.now();
        flashTgt = { sn: hitSn, i: hitI }; flashT = performance.now();
        misses++;
        homeSpawn(true);
      } else {
        homeSpawn(true); // dropped on empty ground: quietly goes home
      }
    });

    /* the win: the snake celebrates where it lies — the reinforcement
       beat (×1…×12 light in turn), a satisfied wiggle, a look straight
       at the child and a wink. Then "Another snake?" */
    function finish() {
      state = 'celebrate';
      /* finishing the bald rung promotes the next deal to two
         snakes — the rung the whole ladder was climbing toward */
      if (!duoOn && rung >= LADDER.length - 1) duoNext = true;
      /* fluent play shortens the ramp: a clean round jumps two rungs,
         a clean AND unhesitating one jumps three — strugglers take
         every step (Roger 2026-11-19) */
      setRung(rung + (misses === 0 ? (hesits === 0 ? 3 : 2) : 1));
      addMade(table);
      if (duoOn) addMade(table2);
      UW.completed('puzzle', duoOn ? [table, table2] : [table]);
      doneMs = Math.round(performance.now() - startT);
      cheerT = performance.now();
      /* the close of the celebration varies: one action from the
         shared repertoire plays on the little head — the whole snake
         stays put, the head does the acting (Roger, 2026-11-15).
         ?expr=<name> forces it for a look. */
      winAct = HouseSnake.FACES[EXPR] ? EXPR
        : HouseSnake.FACE_NAMES[
            (Math.random() * HouseSnake.FACE_NAMES.length) | 0];
      nextBlinkAt = cheerT + (WINK_AT + WINK_SECS + 1.5) * 1000;
      blinkT0 = -1;
      syncChips();
    }

    /* the bottom prompt fades up while the snake stays on screen,
       still looking out, until the user responds */
    function showDone() {
      state = 'done';
      chipRow.classList.add('hidden');
      doneBar.classList.add('show');
      snakeCameo();
    }
    /* the curtain call: posed snake rises from below, settles, plays
       its expression. A fresh table choice clears it with the prompt. */
    function snakeCameo() {
      if (!CAMEO) return;
      const host = document.getElementById('snakeCameo');
      const hs = HouseSnake.mount(host, { pose: 'rise' });
      const size = Math.min(W, H) * 0.34;
      hs.el.style.width = size + 'px';
      hs.wrap.style.left = W / 2 + 'px';
      hs.wrap.style.top = H * 0.68 + 'px';
      hs.wrap.animate(
        [{ transform: 'translate(-50%,-50%) translateY(45vh)' },
         { transform: 'translate(-50%,-50%) translateY(0)' }],
        { duration: 800, easing: 'cubic-bezier(.3,.8,.35,1)',
          fill: 'forwards' })
        .finished.then(() => hs.play(EXPR));
    }
    function clearCameo() {
      document.getElementById('snakeCameo').innerHTML = '';
    }
    /* Yes doesn't redeal — it offers the chips. No snake is drawn
       until a table is chosen */
    document.getElementById('againYes').addEventListener('click', () => {
      clearCameo();
      /* once two snakes play, each 'again' asks the child to pick the
         partner — the pair is never imposed (Roger 2026-11-19) */
      doneBar.classList.remove('show');
      chipRow.classList.remove('hidden');
      segs = []; rail = []; spawned = null; remaining = [];
      hasInteracted = false;
      state = 'choose';
      syncChips();
    });
    document.getElementById('againNo').addEventListener('click', () => {
      location.href = 'index.html';
    });

    /* ---------- orientation guard (handheld only) ---------- */
    const handheld = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
    function checkOrientation() {
      rotOverlay.classList.toggle('hidden',
        !handheld || H >= W);
    }
    window.addEventListener('resize', checkOrientation);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', checkOrientation);

    /* ---------- draw ---------- */
    function numeral(v, cx, cy, size, colour) {
      ctx.font = '700 ' + size + 'px Andika, -apple-system, system-ui, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = colour;
      ctx.fillText(v, cx, cy);
    }

    function wrapAngle(d) {
      while (d > Math.PI) d -= 2 * Math.PI;
      while (d < -Math.PI) d += 2 * Math.PI;
      return d;
    }

    /* the eyes watch the piece in hand (clamped to the face); with
       nothing to place they rest on the pose's facing direction */
    function eyeLook(s, facing) {
      let t = facing;
      if (spawned && performance.now() >= spawned.born) {
        const d = wrapAngle(Math.atan2(spawned.y - s.y, spawned.x - s.x) - facing);
        t = facing + Math.max(-GAZE_MAX, Math.min(GAZE_MAX, d));
      }
      gaze += wrapAngle(t - gaze) * GAZE_EASE;
      return gaze;
    }

    /* 1 = eyes open, dipping briefly toward shut and back — one smooth
       sinusoid so there are no blink states to manage */
    function blinkScale(now) {
      if (blinkT0 < 0) {
        if (now < nextBlinkAt) return 1;
        blinkT0 = now;
      }
      const k = (now - blinkT0) / 1000 / BLINK_SECS;
      if (k >= 1) {
        blinkT0 = -1;
        nextBlinkAt = now + (BLINK_MIN + Math.random() * (BLINK_MAX - BLINK_MIN)) * 1000;
        return 1;
      }
      return 1 - Math.sin(k * Math.PI) * 0.88;
    }

    /* same construction as the tilt-snake head — radial-shaded ball,
       rim stroke, pupil pair forward and across — but the hue comes
       from the table so the snake takes its table's colour */
    /* face: 0 = eyes on the heading, 1 = turned to look out at you;
       fac: the shared repertoire's per-frame recipe — {l,r} lid
       factors, gaze offsets gx/gy, a bob and a yaw slide (snake.js) */
    function drawHead(s, nxt, tbl, now, face = 0, fac = { l: 1, r: 1 }) {
      nxt = nxt || { x: s.x, y: s.y + 1 };
      const ang = Math.atan2(s.y - nxt.y, s.x - nxt.x);
      const r = segD / 2 * (1 + LOOK_GROW * face);
      const hue = (tbl * 31 + 200) % 360;
      ctx.save();
      ctx.translate(0, (fac.bob || 0) * r * 2);

      const g = ctx.createRadialGradient(
        s.x - r * 0.33, s.y - r * 0.33, r * 0.2,
        s.x, s.y, r);
      g.addColorStop(0, 'hsl(' + hue + ',62%,64%)');
      g.addColorStop(1, 'hsl(' + hue + ',56%,28%)');
      ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, 7);
      ctx.fillStyle = g; ctx.fill();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = 'hsl(' + hue + ',58%,40%)';
      ctx.stroke();

      const look = eyeLook(s, ang);
      const ex = Math.cos(look), ey = Math.sin(look);
      const px = -ey, py = ex;
      const sq = blinkScale(now);
      // each eye eases from its place on the heading to the front of the
      // face — the left-hand eye stays the left-hand eye, so none cross
      const eyes = [-1, 1].map(side => ({
        x: s.x + ex * r * 0.38 + px * side * r * 0.36,
        y: s.y + ey * r * 0.38 + py * side * r * 0.36
      })).sort((a, b) => a.x - b.x);
      /* pupils clipped to the head's rim — the yaw sends them round
         one edge and back round the other, as on the lab's obverse */
      ctx.save();
      ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, 7); ctx.clip();
      eyes.forEach((e, k) => {
        const fx = s.x + (k ? 1 : -1) * r * 0.34, fy = s.y - r * 0.06;
        const x = e.x + (fx - e.x) * face + (fac.gx || 0) * r +
            Math.sin(fac.yaw || 0) * r * .5,
          y = e.y + (fy - e.y) * face + (fac.gy || 0) * r;
        const er = r * (0.16 + 0.03 * face);
        const lid = Math.min(sq, k ? fac.r : fac.l);
        ctx.beginPath();
        ctx.ellipse(x, y, er, Math.max(er * lid, r * 0.03),
          look * (1 - face), 0, 7);
        ctx.fillStyle = '#101418'; ctx.fill();
      });
      ctx.restore();
      ctx.restore();
    }

    function draw(now) {
      if (demo) stepDemo(now);
      if (state === 'choose') {
        // chips alone offer the next round — no snake until one is picked
        ctx.fillStyle = '#101418';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = 'rgba(120,140,160,.45)';
        ctx.font = '15px Andika, -apple-system, system-ui, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(partnerMode() ? 'pick a partner'
          : 'pick a table', bX + bW / 2, bY + bH / 2);
        return;
      }
      // the celebration's clock: 0 while playing
      const el = state === 'celebrate' ? (now - cheerT) / 1000
        : state === 'done' ? Infinity : -1;
      /* the prompt waits for the action's end plus its hold, so the
         long ones (yaw, tour) are never cut off mid-act */
      const actEnd = WINK_AT + HouseSnake.FACES[winAct].dur + .8;
      if (state === 'celebrate' && el >= Math.max(ASK_AT, actEnd))
        showDone();
      const ease = k => { k = Math.max(0, Math.min(1, k)); return k * k * (3 - 2 * k); };
      const face = el < 0 ? 0 : ease((el - LOOK_AT) / LOOK_SECS);
      const wk = (el - WINK_AT) / HouseSnake.FACES[winAct].dur;
      const fac = wk >= 0 && wk <= 1
        ? HouseSnake.FACES[winAct].f(wk) : { l: 1, r: 1 };
      ctx.fillStyle = '#101418';
      ctx.fillRect(0, 0, W, H);

      // a still patch earns a restless wriggle — a travelling sway,
      // draw-time only, so dealt positions (and drop targets) never move
      const wobbleFor = (list, amp) => list.map((s, i) => {
        const a = list[Math.max(0, i - 1)],
          b = list[Math.min(list.length - 1, i + 1)];
        const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
        const m = Math.sin(now / 1000 * 9 - i * 0.9) * amp;
        return { x: -dy / d * m, y: dx / d * m };
      });
      const idleAge = (now - lastAct) / 1000;
      let wob = null, wob2 = null;
      const ck = (el - CHEER_AT) / CHEER_SECS;
      const dw = demo && demo.phase === 'pause'
        ? (now - demo.t0) / 1000 : -1;
      if (ck > 0 && ck < 1) {
        // the satisfied wiggle — head to tail, swelling and dying away
        const k = Math.sin(ck * Math.PI);
        wob = wobbleFor(segs, CHEER_AMP * segD * k);
        if (duoOn) wob2 = wobbleFor(segs2, CHEER_AMP * segD * k);
      } else if (dw >= 0 && dw < DEMO_WRIG) {
        // the completed demo snake gets the satisfied wiggle, slightly
        // longer than the idle one; mid-play the opening never shakes
        const k = Math.sin(dw / DEMO_WRIG * Math.PI);
        wob = wobbleFor(segs, CHEER_AMP * segD * k);
        if (duoOn) wob2 = wobbleFor(segs2, CHEER_AMP * segD * k);
      } else if (idleAge > IDLE_WRIG_S && !demo) {
        const c = (idleAge - IDLE_WRIG_S) % WRIG_CYCLE;
        if (c < WRIG_SECS) {
          const k = Math.sin(c / WRIG_SECS * Math.PI);
          wob = wobbleFor(segs, WRIG_AMP * segD * k);
          if (duoOn) wob2 = wobbleFor(segs2, WRIG_AMP * segD * k);
        }
      }

      // the snakes to draw — B first so the shared bead (drawn in A's
      // pass, wearing both colours) sits on top
      const snakes = duoOn
        ? [{ list: segs2, tbl: table2, wob: wob2, sn: 1 },
           { list: segs, tbl: table, wob, sn: 0 }]
        : [{ list: segs, tbl: table, wob, sn: 0 }];
      snakes.forEach(sn => {
        const L = sn.list, w = sn.wob;
        // spine: a faint thread through the segments so the pose reads
        // as one animal even with gaps
        ctx.beginPath();
        L.forEach((s, i) => {
          const x = s.x + (w ? w[i].x : 0), y = s.y + (w ? w[i].y : 0);
          i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        });
        ctx.strokeStyle = 'rgba(90,110,130,.25)';
        ctx.lineWidth = 3;
        ctx.stroke();

        for (let i = L.length - 1; i >= 0; i--) {
          // the crossover bead is drawn once, in A's pass
          if (duoOn && sn.sn === 1 && i === xB) continue;
          const s = L[i];
          let ox = 0;
          if (shakeTgt && shakeTgt.sn === sn.sn && shakeTgt.i === i) {
            const t = (now - shakeT) / 1000;
            if (t > SHAKE_SECS) shakeTgt = null;
            else ox = Math.sin(t * 22) * 3.2 * (1 - t / SHAKE_SECS);
          }
          const cx = s.x + ox + (w ? w[i].x : 0),
            cy = s.y + (w ? w[i].y : 0), r = segD / 2;
          if (i === 0) {
            drawHead({ x: cx, y: cy }, L[1], sn.tbl, now, face, fac);
            continue;
          }
          if (duoOn && sn.sn === 0 && i === xA &&
              (segs[xA].filled || segs2[xB].filled)) {
            /* the crossover colours side by side as each snake's own
               disk lands — the split is built, not rendered (Roger
               2026-11-19). Both-blank still falls through to the
               dashed dual ring below */
            const af = segs[xA].filled, bf = segs2[xB].filled;
            const ord = sn.sn ? N + i : i;
            const bk = el - ord * BEAT_STAGGER;
            const pop = bk > 0 && bk < BEAT_HOLD ?
              Math.sin(bk / BEAT_HOLD * Math.PI) : 0;
            const rr = r * (1 + pop * 0.12);
            ctx.save();
            ctx.beginPath();
            ctx.rect(cx - rr, cy - rr, rr, rr * 2); ctx.clip();
            ctx.beginPath(); ctx.arc(cx, cy, rr, 0, 7);
            ctx.fillStyle = af ? tableColour(table)
              : 'rgba(20,28,36,.9)'; ctx.fill();
            ctx.restore();
            ctx.save();
            ctx.beginPath();
            ctx.rect(cx, cy - rr, rr, rr * 2); ctx.clip();
            ctx.beginPath(); ctx.arc(cx, cy, rr, 0, 7);
            ctx.fillStyle = bf ? tableColour(table2)
              : 'rgba(20,28,36,.9)'; ctx.fill();
            ctx.restore();
            if (!af || !bf) {
              ctx.setLineDash([5, 4]); ctx.lineWidth = 2;
              if (!af) {
                ctx.beginPath();
                ctx.arc(cx, cy, r, -Math.PI / 2, Math.PI / 2);
                ctx.strokeStyle = tableColour(table); ctx.stroke();
              }
              if (!bf) {
                ctx.beginPath();
                ctx.arc(cx, cy, r, Math.PI / 2, Math.PI * 1.5);
                ctx.strokeStyle = tableColour(table2); ctx.stroke();
              }
              ctx.setLineDash([]);
            }
            if (pop > 0) {
              ctx.lineWidth = 2.5;
              ctx.strokeStyle = 'rgba(255,255,255,' + (0.85 * pop) + ')';
              ctx.stroke();
            }
            numeral(s.expected, cx, cy, segD * 0.34, '#fff');
          } else if (s.blank) {
            ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7);
            ctx.fillStyle = 'rgba(20,28,36,.9)'; ctx.fill();
            ctx.setLineDash([5, 4]);
            ctx.lineWidth = 2;
            if (duoOn && sn.sn === 0 && i === xA) {
              // the shared blank rings in both tables' colours
              ctx.beginPath();
              ctx.arc(cx, cy, r, -Math.PI / 2, Math.PI / 2);
              ctx.strokeStyle = tableColour(table); ctx.stroke();
              ctx.beginPath();
              ctx.arc(cx, cy, r, Math.PI / 2, Math.PI * 1.5);
              ctx.strokeStyle = tableColour(table2); ctx.stroke();
            } else {
              ctx.strokeStyle = tableColour(sn.tbl);
              ctx.stroke();
            }
            ctx.setLineDash([]);
          } else {
            // the reinforcement beat: each member swells and rings in
            // turn — snake B's sweep follows snake A's
            const ord = sn.sn ? N + i : i;
            const bk = el - ord * BEAT_STAGGER;
            const pop = bk > 0 && bk < BEAT_HOLD ?
              Math.sin(bk / BEAT_HOLD * Math.PI) : 0;
            const rr = r * (1 + pop * 0.12);
            ctx.beginPath(); ctx.arc(cx, cy, rr, 0, 7);
            ctx.fillStyle = tableColour(sn.tbl); ctx.fill();
            if (pop > 0) {
              ctx.lineWidth = 2.5;
              ctx.strokeStyle = 'rgba(255,255,255,' + (0.85 * pop) + ')';
              ctx.stroke();
            }
            numeral(s.expected, cx, cy, segD * 0.34, '#fff');
          }
          if (flashTgt && flashTgt.sn === sn.sn && flashTgt.i === i) {
            const t = (now - flashT) / 1000;
            if (t > FLASH_SECS) flashTgt = null;
            else {
              ctx.beginPath(); ctx.arc(cx, cy, r + 3, 0, 7);
              ctx.lineWidth = 3;
              ctx.strokeStyle = 'rgba(224,165,58,' +
                (1 - t / FLASH_SECS) + ')';
              ctx.stroke();
            }
          }
        }
      });

      if (spawned) {
        const age = (now - spawned.born) / 1000;
        if (age >= 0) drawSpawn(age);
      }

      /* the opening's ending — the stage fades out, then the fresh
         puzzle fades up on the other side of it */
      if (darkA > 0) {
        ctx.fillStyle = 'rgba(16,20,24,' + Math.min(1, darkA) + ')';
        ctx.fillRect(0, 0, W, H);
      }
    }

    /* the piece in hand — arrives with a flourish: pops up past full
       size and settles, a ring of light spreading from it; while it
       waits, a softer ring now and then says "still here" */
    /* soft oval on the ground: slides out from under the number as it
       lifts, widens and fades with height, closes up again on landing */
    function drawShadow(r) {
      const d = demo, top = segD * (1.2 + FLOAT_RISE);
      const k = Math.min(1, (d.h || 0) / top);
      const sx = SHADOW_GROUND ? d.gx : spawned.x;
      const sy = (SHADOW_GROUND ? d.gy : spawned.y + (d.h || 0)) + r * 0.25;
      const style = qs.get('shadow') || SHADOW_STYLE;
      const light = style === 'light';
      const hue = (table * 31 + 200) % 360;
      if (style === 'outline') {
        /* a thin soft line where the shadow's edge would be: shows on
           the dark page where a dark fill disappears */
        const w = r * (1.0 + 0.35 * k), h = w * 0.35;
        const a = SHADOW * 0.5 * (1 - 0.45 * k);
        ctx.save();
        ctx.strokeStyle = 'hsla(' + hue + ',30%,80%,' + a * 0.35 + ')';
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.ellipse(sx, sy, w, h, 0, 0, 7); ctx.stroke();
        ctx.strokeStyle = 'hsla(' + hue + ',30%,82%,' + a + ')';
        ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.ellipse(sx, sy, w, h, 0, 0, 7); ctx.stroke();
        ctx.restore();
        return;
      }
      /* the pale one is flatter and crisper-edged, so it reads as a
         reflection on the floor rather than a puff of cloud */
      const w = r * (1.05 + 0.35 * k), h = w * (light ? 0.3 : 0.45);
      const rgb = light ? 'hsla(' + hue + ',35%,80%,' : 'rgba(0,0,0,';
      const alpha = SHADOW * (light ? 0.22 : 1) * (1 - 0.4 * k);
      ctx.save();
      ctx.translate(sx, sy); ctx.scale(1, h / w);
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, w);
      g.addColorStop(0, rgb + alpha + ')');
      if (light) g.addColorStop(0.8 - 0.2 * k, rgb + alpha * 0.8 + ')');
      else g.addColorStop(0.55 - 0.25 * k, rgb + alpha * 0.7 + ')');
      g.addColorStop(1, rgb + '0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, w, 0, 7); ctx.fill();
      ctx.restore();
    }

    function drawSpawn(age) {
      const r = segD / 2, hue = (table * 31 + 200) % 360;
      /* two tables means no owner colour for the piece in hand — a
         neutral slate, so destination is read from the number, not
         matched by tint (Roger, spawn ambiguity, 2026-11-16) */
      const duo = typeof duoOn !== 'undefined' && duoOn;
      /* a shared disk keeps its snake's tint — the colour says which
         bead it belongs to (Roger 2026-11-19); other duo pieces stay
         neutral so destination is read from the number */
      const own = duo && spawned.sn >= 0;
      const sHue = own ? ((spawned.sn ? table2 : table) * 31 + 200) % 360
        : duo ? 215 : hue;
      const sFill = own ? tableColour(spawned.sn ? table2 : table)
        : duo ? 'hsl(215,18%,45%)' : tableColour(table);
      const held = dragging || (demo && demo.phase === 'carry');
      /* the doughnut: while a finger drags, a wide ring around the
         bead reads as a coin the finger pushes from beneath — the
         fingertip sits just under its rim (Roger, 2026-11-16) */
      if (held && touchDrag) {
        ctx.beginPath();
        ctx.arc(spawned.x, spawned.y, segD * TOUCH_RING, 0, 7);
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = 'rgba(255,255,255,.55)';
        ctx.stroke();
      }
      /* a missed piece glides back rather than snapping — the journey
         itself reads as "that wasn't it" */
      if (spawned.retT) {
        const u = Math.min(1,
          (performance.now() - spawned.retT) / RETURN_MS);
        const k = u * u * (3 - 2 * u);
        const hp = spawnHome();
        spawned.x = spawned.retFrom.x + (hp.x - spawned.retFrom.x) * k;
        spawned.y = spawned.retFrom.y + (hp.y - spawned.retFrom.y) * k;
        if (u >= 1) spawned.retT = 0;
      }
      const a = held ? 1 : Math.min(1, age / FLOURISH_SECS);
      const u = a - 1;
      const lifted = demo && demo.phase === 'carry' ? demo.lift || 0 : 0;
      const sc = held ? 1 + 0.1 * lifted
        : Math.max(0, 1 + 3.2 * u * u * u + 2.2 * u * u);
      const x = spawned.x, y = spawned.y - (1 - a) * 14;
      if (demo && demo.phase === 'carry' && SHADOW > 0) drawShadow(r);
      if (!held) {
        let ring = -1, ringA = 0.6;
        if (age < RING_SECS) ring = age / RING_SECS;
        else if (READY_EVERY > 0) {
          const c = (age - RING_SECS) % READY_EVERY;
          if (c > READY_EVERY - RING_SECS) {
            ring = (c - (READY_EVERY - RING_SECS)) / RING_SECS; ringA = 0.3;
          }
        }
        if (ring >= 0) {
          ctx.beginPath(); ctx.arc(x, y, r * (1 + 1.3 * ring), 0, 7);
          ctx.lineWidth = 3 * (1 - ring) + 1;
          ctx.strokeStyle = 'hsla(' + sHue + ',75%,72%,' + ringA * (1 - ring) + ')';
          ctx.stroke();
        }
      }
      ctx.globalAlpha = held ? 1 : Math.min(1, age / 0.15);
      ctx.beginPath();
      ctx.arc(x, y, r * sc, 0, 7);
      ctx.fillStyle = sFill; ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.stroke();
      if (sc > 0.2) numeral(spawned.value, x, y, segD * 0.34 * sc, '#fff');
      ctx.globalAlpha = 1;
    }

    /* ---------- the opening (Roger, 2026-11-14) ----------
       Once per device, on the first visit: a ×2 snake missing two
       numbers completes itself — each number arrives as it will in
       play, is seen, and is carried home. The finished snake stands
       a moment, the stage fades out, and the fresh puzzle fades up.
       The first touch anywhere ends it.
       ?demo=1 plays it on request; ?demo=reset forgets it was seen */
    const DEMO_KEY = 'snakePuzzleDemoSeen';
    function demoSeen(mark) {          // private browsing may refuse storage
      try {
        if (mark === undefined) return !!localStorage.getItem(DEMO_KEY);
        if (mark) localStorage.setItem(DEMO_KEY, '1');
        else localStorage.removeItem(DEMO_KEY);
      } catch (e) { return false; }
    }
    if (qs.get('demo') === 'reset') demoSeen(false);
    if (qs.get('demo') === 'cameo') setTimeout(snakeCameo, 1000);
    let demo = null;                   // {phase, t0, keep, idx, from}
    let darkA = 0;                     // fade-to-dark level at the ending

    function startDemo() {
      demo = { phase: 'wait', t0: 0, keep: table, idx: -1, from: null };
      table = DEMO_TABLE; syncChips(); deal(DEMO_BLANKS);
      if (spawned) spawned.born = performance.now() + DEMO_START * 1000;
      chipRow.classList.add('locked');
      demoSeen(true);
    }

    function stepDemo(now) {
      const d = demo;
      if (d.phase === 'wait') {
        if (spawned && now >= spawned.born
            + (FLOURISH_SECS + DEMO_LOOK) * 1000) {
          d.idx = segs.findIndex(s => s.blank && s.expected === spawned.value);
          d.from = { x: spawned.x, y: spawned.y };
          d.phase = 'carry'; d.t0 = now;
        }
      } else if (d.phase === 'carry') {
        /* lifted, carried, set down: the piece swells a little as
           it's picked up and settles back as it lands */
        const T = DEMO_LIFT * 2 + DEMO_CARRY, el = (now - d.t0) / 1000;
        d.lift = Math.min(1, el / DEMO_LIFT, Math.max(0, (T - el) / DEMO_LIFT));
        const e = Math.min(1, Math.max(0, (el - DEMO_LIFT) / DEMO_CARRY));
        const q = e < 0.5 ? 2 * e * e : 1 - Math.pow(2 - 2 * e, 2) / 2;
        const to = segs[d.idx];
        const dx = to.x - d.from.x, dy = to.y - d.from.y;
        const L = Math.hypot(dx, dy) || 1;
        let nx = -dy / L, ny = dx / L;           // carried in a gentle arc,
        if (ny > 0) { nx = -nx; ny = -ny; }      // lifted, not slid
        const lift = Math.sin(q * Math.PI) * Math.min(L * 0.18, segD * 1.2);
        const rise = d.lift * FLOAT_RISE * segD;
        d.gx = d.from.x + dx * q; d.gy = d.from.y + dy * q;
        d.h = lift + rise;
        spawned.x = d.gx + nx * lift;
        spawned.y = d.gy + ny * lift - rise;
        if (el >= T) {
          to.filled = true; to.blank = false;
          spawnNext(DEMO_NEXT);
          d.phase = spawned ? 'wait' : 'pause'; d.t0 = now;
        }
      } else if (d.phase === 'pause') {
        if (now - d.t0 >= DEMO_PAUSE * 1000) { d.phase = 'dark'; d.t0 = now; }
      } else if (d.phase === 'dark') {
        darkA = Math.min(1, (now - d.t0) / 1000 / DEMO_DARK);
        if (darkA >= 1) {
          table = d.keep; syncChips(); deal();
          d.phase = 'up'; d.t0 = now;
        }
      } else if (d.phase === 'up') {
        darkA = 1 - (now - d.t0) / 1000 / DEMO_UP;
        if (darkA <= 0) { darkA = 0; demo = null; }
      }
    }

    /* a real touch ends the opening — the fresh puzzle at once */
    window.addEventListener('pointerdown', () => {
      if (!demo) return;
      const fresh = demo.phase === 'up';
      table = demo.keep; demo = null; darkA = 0;
      if (!fresh) { syncChips(); deal(); }
    }, true);

    function frame(now) {
      try { draw(now); } catch (e) { /* a bad frame must not kill the loop */ }
      requestAnimationFrame(frame);
    }

    resize();
    checkOrientation();
    syncChips();
    UW.boot('puzzle');
    // lab aids: ?t=N picks the table, ?pose=fam pins the pose, ?done jumps
    // to a completed round (watch the celebration)
    if (qs.has('t')) {
      table = Math.min(12, Math.max(2, +qs.get('t') || table));
      syncChips();
      deal();
    }
    if (qs.has('done')) {
      [segs, segs2].forEach(L =>
        L.forEach(s => { s.filled = true; s.blank = false; }));
      remaining = []; spawned = null;
      finish();
    }
    if (qs.get('demo') === '1'
        || (!qs.has('t') && !qs.has('done') && !demoSeen())) startDemo();
    requestAnimationFrame(frame);
  </script>
