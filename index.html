<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#101418">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>NumberFun — shape &amp; number play</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #101418;
      color: #cfd8e0;
      font-family: -apple-system, system-ui, sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }

    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 72px 24px 48px;
    }

    h1 {
      font-size: 26px;
      font-weight: 600;
      margin: 0 0 8px;
    }

    /* ============ ROGERS INTRO TEXT ============
       Edit the paragraphs between these markers in any text editor —
       it's plain words, no code. Keep the <p class="intro"> tags. */
    .intro {
      font-size: 16px;
      line-height: 1.6;
      color: #aab8c4;
      margin: 18px 0 34px;
    }

    /* ============ END OF INTRO ============ */

    .tiles {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .tile {
      display: block;
      padding: 18px 20px;
      border-radius: 14px;
      background: #1a2430;
      border: 1px solid #2c3e50;
      color: #cfd8e0;
      text-decoration: none;
    }

    .tile.has-icon {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .tile .icon {
      width: 44px;
      height: 44px;
      flex: none;
    }

    .tile .name {
      font-size: 18px;
      font-weight: 600;
    }

    .tile.soon {
      opacity: .45;
    }

    .tile {
      -webkit-touch-callout: none;
    }

    /* long-press / hover tooltip — the tile's data-tip text, shown
       above the tile; the same words work on mouse and touch */
    #tip {
      position: fixed;
      max-width: 260px;
      padding: 8px 12px;
      border-radius: 10px;
      background: #243244;
      border: 1px solid #3a4a58;
      color: #cfd8e0;
      font-size: 13px;
      line-height: 1.4;
      pointer-events: none;
      opacity: 0;
      transition: opacity .15s;
      z-index: 20;
    }

    footer {
      max-width: 560px;
      margin: 0 auto;
      padding: 0 24px 40px;
      font-size: 12px;
      color: #5f6e7c;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <main>
    <h1>NumberFun</h1>

    <!-- ============ ROGERS INTRO TEXT — edit between the markers ============ -->
    <p class="intro">
      Games about number and sequence. Pick one.
    </p>
    <!-- ============ END OF ROGERS INTRO TEXT ============ -->

    <!-- ============ ROGERS TILE TOOLTIPS ============
         The title="…" text on each tile is the hover tooltip — plain
         words, edit freely. ============ END OF TOOLTIPS ============ -->
    <div class="tiles">
      <a class="tile has-icon" href="tilt-snake.html"
        title="Collect the multiples in order.">
        <img class="icon" src="icons/tilt.png" alt="">
        <div>
          <div class="name">Tilt Snake</div>
        </div>
      </a>
      <a class="tile has-icon" href="snake-puzzle.html"
        title="Drag the missing numbers home.">
        <img class="icon" src="icons/snake-puzzle.png" alt="">
        <div>
          <div class="name">Snake Puzzle</div>
        </div>
      </a>
      <a class="tile has-icon" href="pattern-snake.html"
        title="Place the snake's numbers home.">
        <img class="icon" src="icons/patterns.png" alt="">
        <div>
          <div class="name">Snake Patterns</div>
        </div>
      </a>
      <a class="tile has-icon" href="honeycomb.html"
        title="Find the hiding table paths.">
        <img class="icon" src="icons/honeycomb.png" alt="">
        <div>
          <div class="name">Find Tables</div>
        </div>
      </a>
      <a class="tile has-icon" href="tilt-ball.html"
        title="Find the largest multiplier">
        <img class="icon" src="icons/tilt-ball.png" alt="">
        <div>
          <div class="name">Tilt Ball</div>
        </div>
      </a>
    </div>
  </main>

  <footer>
    NumberFun — Number and sequence made fun.<br>

  </footer>

  <div id="tip"></div>

  <script>
    /* tile tooltips: the editable text lives in each tile's title="…"
       attribute (marked region above); here it's moved to data-tip so
       the native tooltip never doubles ours. Hover (mouse) or
       press-and-hold (touch) shows it after TIP_DELAY ms; a held touch
       that showed the tip doesn't navigate on release. */
    const TIP_DELAY = 450;
    const tipEl = document.getElementById('tip');
    let tipTimer = 0, tipShown = false, tipFromTouch = false;

    document.querySelectorAll('.tile[title]').forEach(t => {
      t.dataset.tip = t.getAttribute('title');
      t.removeAttribute('title');
    });

    function showTip(t, fromTouch) {
      tipEl.textContent = t.dataset.tip;
      tipEl.style.left = '0px';
      tipEl.style.opacity = '1';
      const r = t.getBoundingClientRect();
      const tw = tipEl.offsetWidth, th = tipEl.offsetHeight;
      let x = Math.min(Math.max(r.left + r.width / 2 - tw / 2, 8), innerWidth - tw - 8);
      let y = r.top - th - 8;
      if (y < 8) y = r.bottom + 8;
      tipEl.style.left = x + 'px';
      tipEl.style.top = y + 'px';
      tipShown = true;
      tipFromTouch = fromTouch;
    }

    function hideTip() {
      clearTimeout(tipTimer);
      tipEl.style.opacity = '0';
      tipShown = false;
    }

    document.querySelectorAll('.tile[data-tip]').forEach(t => {
      t.addEventListener('pointerenter', (e) => {
        tipTimer = setTimeout(() => showTip(t, e.pointerType !== 'mouse'), TIP_DELAY);
      });
      t.addEventListener('pointerleave', hideTip);
      t.addEventListener('pointercancel', hideTip);
      t.addEventListener('contextmenu', (e) => e.preventDefault());
      t.addEventListener('click', (e) => {
        if (tipShown && tipFromTouch) { e.preventDefault(); hideTip(); }
      });
    });
    window.addEventListener('scroll', hideTip, { passive: true });
  </script>

  <script src="nav.js?v=11"></script>
</body>

</html>
