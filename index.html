<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#101418">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>NumberFun — shape &amp; number play</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #101418;
      color: #cfd8e0;
      font-family: Andika, -apple-system, system-ui, sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }

    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 72px 24px 48px;
    }

    h1 {
      font-size: 26px;
      font-weight: 600;
      margin: 0 0 8px;
    }

    /* ============ ROGERS INTRO TEXT ============
       Edit the paragraphs between these markers in any text editor —
       it's plain words, no code. Keep the <p class="intro"> tags. */
    .intro {
      font-size: 16px;
      line-height: 1.6;
      color: #aab8c4;
      margin: 18px 0 34px;
    }

    /* the book button — top-left counterweight to the snake menu;
       links to intro.html (the adult-facing introduction) */
    .booklink {
      position: fixed;
      top: 14px;
      left: 14px;
      height: 44px;
      padding: 0 14px;
      border-radius: 12px;
      border: 1px solid #2a3540;
      background: rgba(20, 26, 33, 0.85);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 40;
      text-decoration: none;
      color: #aab8c4;
      font-size: 14px;
    }

    .booklink svg {
      width: 20px;
      height: 20px;
      stroke: #aab8c4;
    }

    /* ============ END OF INTRO ============ */

    .tiles {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .tile {
      display: block;
      padding: 18px 20px;
      border-radius: 14px;
      background: #1a2430;
      border: 1px solid #2c3e50;
      color: #cfd8e0;
      text-decoration: none;
    }

    .tile.has-icon {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .tile .icon {
      width: 44px;
      height: 44px;
      flex: none;
    }

    .tile .name {
      font-size: 18px;
      font-weight: 600;
    }

    .tile.soon {
      opacity: .45;
    }

    .tile {
      -webkit-touch-callout: none;
    }

    /* long-press / hover tooltip — the tile's data-tip text, shown
       above the tile; the same words work on mouse and touch */
    #tip {
      position: fixed;
      max-width: 260px;
      padding: 8px 12px;
      border-radius: 10px;
      background: #243244;
      border: 1px solid #3a4a58;
      color: #cfd8e0;
      font-size: 13px;
      line-height: 1.4;
      pointer-events: none;
      opacity: 0;
      transition: opacity .15s;
      z-index: 20;
    }

    footer {
      max-width: 560px;
      margin: 0 auto;
      padding: 0 24px 40px;
      font-size: 14px;
      color: #5f6e7c;
      line-height: 1.6;
    }

    /* footer ripple: each letter rises and brightens in turn, a wave
       that runs across the line, rests, and runs again */
    footer .rl {
      display: inline-block;
      animation: ripple 3.2s ease-in-out infinite;
      animation-delay: calc(var(--i) * 55ms);
    }

    @keyframes ripple {
      0%, 28%, 100% { transform: none; color: #5f6e7c; }
      14% { transform: translateY(-0.4em) scale(1.18); color: #cfd8e0; }
    }

    @media (prefers-reduced-motion: reduce) {
      footer .rl { animation: none; }
    }
  </style>
  <link rel="preload" href="fonts/andika-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/andika-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts/andika.css">
</head>

<body>
  <a class="booklink" href="intro.html" title="About NumberFun" aria-label="Introduction">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.5 5.5 Q7.5 4 12 5.8 Q16.5 4 20.5 5.5 L20.5 18 Q16.5 16.5 12 18.3 Q7.5 16.5 3.5 18 Z"/>
      <path d="M12 5.8 L12 18.3"/>
      <path d="M6 8.5 Q8 7.8 10 8.6"/>
      <path d="M14 8.6 Q16 7.8 18 8.5"/>
      <path d="M6 12 Q8 11.3 10 12.1"/>
      <path d="M14 12.1 Q16 11.3 18 12"/>
    </svg>
    <span>Introduction</span>
  </a>
  <main>
    <h1>NumberFun</h1>

    <!-- ============ ROGERS INTRO TEXT — edit between the markers ============ -->
    <p class="intro">
      Games about number and sequence. Try one.
    </p>
    <!-- ============ END OF ROGERS INTRO TEXT ============ -->

    <!-- ============ ROGERS TILE TOOLTIPS ============
         The title="…" text on each tile is the hover tooltip — plain
         words, edit freely. ============ END OF TOOLTIPS ============ -->
    <div class="tiles">
      <a class="tile has-icon" href="tilt-snake.html" title="Collect the multiples in order.">
        <img class="icon" src="icons/tilt.png" alt="">
        <div>
          <div class="name">Tilt Snake</div>
        </div>
      </a>
      <a class="tile has-icon" href="snake-puzzle.html" title="Drag the missing numbers home.">
        <img class="icon" src="icons/snake-puzzle.png" alt="">
        <div>
          <div class="name">Snake Puzzle</div>
        </div>
      </a>
      <!-- Snake Patterns removed from the menu (Roger, 2026-11-04):
           it does too much — the square returns as the family's
           shared memory instead. pattern-snake.html kept on disk. -->
      <a class="tile has-icon" href="honeycomb.html" title="Find the hiding table paths.">
        <img class="icon" src="icons/honeycomb.png" alt="">
        <div>
          <div class="name">Find Tables</div>
        </div>
      </a>
      <a class="tile has-icon" href="tilt-ball.html" title="Find the largest multiplier">
        <img class="icon" src="icons/tilt-ball.png" alt="">
        <div>
          <div class="name">Tilt Ball</div>
        </div>
      </a>
      <a class="tile" href="mix-patterns.html" title="Mix the table patterns together.">
        <div>
          <div class="name">Patterns</div>
        </div>
      </a>
      <a class="tile" href="feedback.html" title="Tell Roger what you think.">
        <div>
          <div class="name">Feedback</div>
        </div>
      </a>
    </div>
  </main>

  <!-- ============ ROGERS FOOTER TEXT — edit freely; it ripples ============ -->
  <footer>
    Dive in you'll soon pick it up!<br>

  </footer>
  <!-- ============ END OF ROGERS FOOTER TEXT ============ -->

  <div id="tip"></div>

  <script>
    /* tile tooltips: the editable text lives in each tile's title="…"
       attribute (marked region above); here it's moved to data-tip so
       the native tooltip never doubles ours. Hover (mouse) or
       press-and-hold (touch) shows it after TIP_DELAY ms; a held touch
       that showed the tip doesn't navigate on release. */
    const TIP_DELAY = 450;
    const tipEl = document.getElementById('tip');
    let tipTimer = 0, tipShown = false, tipFromTouch = false;

    document.querySelectorAll('.tile[title]').forEach(t => {
      t.dataset.tip = t.getAttribute('title');
      t.removeAttribute('title');
    });

    function showTip(t, fromTouch) {
      tipEl.textContent = t.dataset.tip;
      tipEl.style.left = '0px';
      tipEl.style.opacity = '1';
      const r = t.getBoundingClientRect();
      const tw = tipEl.offsetWidth, th = tipEl.offsetHeight;
      let x = Math.min(Math.max(r.left + r.width / 2 - tw / 2, 8), innerWidth - tw - 8);
      let y = r.top - th - 8;
      if (y < 8) y = r.bottom + 8;
      tipEl.style.left = x + 'px';
      tipEl.style.top = y + 'px';
      tipShown = true;
      tipFromTouch = fromTouch;
    }

    function hideTip() {
      clearTimeout(tipTimer);
      tipEl.style.opacity = '0';
      tipShown = false;
    }

    document.querySelectorAll('.tile[data-tip]').forEach(t => {
      t.addEventListener('pointerenter', (e) => {
        tipTimer = setTimeout(() => showTip(t, e.pointerType !== 'mouse'), TIP_DELAY);
      });
      t.addEventListener('pointerleave', hideTip);
      t.addEventListener('pointercancel', hideTip);
      t.addEventListener('contextmenu', (e) => e.preventDefault());
      t.addEventListener('click', (e) => {
        if (tipShown && tipFromTouch) { e.preventDefault(); hideTip(); }
      });
    });
    window.addEventListener('scroll', hideTip, { passive: true });

    /* footer ripple: wrap each letter in a span so the CSS wave can
       reach it; the footer text itself stays plain in the HTML above */
    (function () {
      const foot = document.querySelector('footer');
      foot.setAttribute('aria-label', foot.textContent.trim());
      let i = 0;
      const walk = (node) => {
        [...node.childNodes].forEach(n => {
          if (n.nodeType === Node.ELEMENT_NODE) { walk(n); return; }
          if (n.nodeType !== Node.TEXT_NODE || !n.textContent.trim()) return;
          const frag = document.createDocumentFragment();
          for (const ch of n.textContent.trim()) {
            if (ch === ' ') { frag.append(' '); i++; continue; }
            const s = document.createElement('span');
            s.className = 'rl';
            s.setAttribute('aria-hidden', 'true');
            s.style.setProperty('--i', i++);
            s.textContent = ch;
            frag.append(s);
          }
          n.replaceWith(frag);
        });
      };
      walk(foot);
    })();
  </script>

  <script src="nav.js?v=15"></script>
</body>

</html>
