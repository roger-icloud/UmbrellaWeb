<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#101418">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>Recital — NumberFun</title>
  <!-- working title: "recital" is the design word — the child declares
       the table, the snake performs it. File/name both provisional. -->
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #101418;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      font-family: Andika, -apple-system, system-ui, sans-serif;
    }

    canvas {
      display: block;
      position: fixed;
      inset: 0;
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: rgba(10, 14, 18, .88);
      color: #cfd8e0;
      z-index: 10;
      text-align: center;
      padding: 24px;
    }

    .overlay .title {
      font-size: 22px;
    }

    .overlay .sub {
      font-size: 13px;
      color: #8a97a3;
      margin-top: 14px;
      max-width: 340px;
    }

    #doneBar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 10px 18px;
      z-index: 12;
      color: #cfd8e0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }

    #doneBar.show {
      opacity: 1;
      pointer-events: auto;
    }

    #doneBar .prompt {
      font-size: 18px;
      font-weight: 600;
    }

    #doneBar button {
      font-size: 17px;
      font-family: inherit;
      padding: 10px 24px;
      border-radius: 12px;
      border: none;
      background: #4da3ff;
      color: #fff;
    }

    #doneBar button.quiet {
      background: rgba(40, 64, 88, .95);
      color: #cfd8e0;
      border: 1px solid #3a4a58;
    }

    #tableRow {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      max-width: 340px;
      margin-top: 20px;
    }

    #tableRow button {
      width: 52px;
      height: 52px;
      font-size: 18px;
      border-radius: 12px;
      border: 1px solid #3a4a58;
      background: rgba(30, 42, 54, .9);
      color: #cfd8e0;
    }

    .hidden {
      display: none !important;
    }
  </style>
  <link rel="preload" href="fonts/andika-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/andika-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts/andika.css">
</head>

<body>

  <canvas id="c"></canvas>

  <div id="rotOverlay" class="overlay hidden">
    <div class="title">Rotate back</div>
    <div class="sub">The game waits for you.</div>
  </div>

  <div id="tableOverlay" class="overlay">
    <div class="title">Snake Recital</div>
    <div class="sub">Pick a table, then recite it.</div>
    <div id="tableRow"></div>
  </div>

  <div id="doneBar">
    <span class="prompt">Another recital?</span>
    <button id="againYes">Yes</button>
    <button class="quiet" id="againNo">No</button>
  </div>

  <script>
    'use strict';

    const qs = new URLSearchParams(location.search);

    /* ---------- tunables ----------
       The mechanic: the child DECLARES the table by tapping stops in
       order; the snake waits, watching, then PERFORMS the declared
       route — each correct stop joins its body. A mis-called link is
       shaken off at arrival, never at the tap: the plan is tested by
       the performance, not the door. Direction is declared by the
       first stop — smallest is a forward recital, largest a descent. */
    const HEAD_R = 18;
    const SEG_R = 15;
    const SEG_GAP = 30;       // centre spacing between tail segments
    const STOP_R = 20;        // radius of numbered stops
    const STOP_MARGIN = 56;   // keep stops this far from screen edge
    const STOP_SEP = STOP_R * 2 + 34;  // min separation between stops
    const SNAKE_SPEED = 150;  // design-px/s while performing
    const TURN_RATE = 5.0;    // rad/s hard cap on heading change
    const TURN_RESPOND = 6;   // /s proportional approach to target heading
    const APPROACH_DIST = 90; // beyond this, full drive; inside, ease in
    const MIN_DRIVE = 0.18;   // roll-in fraction near a stop
    const EAT_DIST = HEAD_R + STOP_R - 4;
    const STOP_DWELL = 0.28;  // s pause at each collected stop — the beat
    const DECOYS = 0;         // non-member stops dealt in (membership vs
    //   order: 0 keeps the recital pure ordering; >0 makes a wrong tap
    //   shake off mid-run — the refusal grammar covers it)
    /* posed boards (Roger, 2026-11-03): stops lie on a SHAPE — spiral,
       zigzag, wave, bolt, sun, s — so the route is the pattern. The
       shape carries order; the child supplies the values. A pose is a
       FAMILY, never a fixture: rotation, mirror, handedness and jitter
       keep it discoverable without being repeatable — bounded
       randomness, the departure grammar's own rule */
    const POSE = qs.get('pose') || 'random'; // a pose name, 'random', or 'scatter'
    const POSE_ROT = 0.35;    // rad of random pose rotation (±)
    const POSE_JITTER = 9;    // px per-point jitter after fitting
    const RELAX_SEP = 48;     // min separation a pose is allowed to keep
    const BLANKS = +(qs.get('blanks') || 0); /* interior stops become empty
       sockets and their values are dealt LOOSE — the gap asks "what
       goes here?" and the child must weave the loose number in at the
       right point of the recital (Snake Puzzle's blanks, recited) */
    const GAZE_NEXT = true;   /* while waiting with an empty script the
       snake looks at the next wanted stop — kin-glow steering, not a
       label; the pulse below is the escalation */
    const NEXT_HINT_SECS = 8; /* s idle in declare before the next wanted
       stop pulses softly (0 = gaze only, never pulse) */
    const WAIT_GO_SECS = 9;   /* the snake's patience: this long after the
       last declaration it sets off anyway — tap-me-to-release should be
       a flourish, never a gate. 0 = waits forever. ?go=0 disables. */
    const ENDS_ONLY = true;   /* a recital starts at an end (smallest or
       largest). A mid-table first stop is shaken off with both ends
       glinting — the refusal carries its own hint */
    const TRIM_ON_REFUSE = true;  /* a broken link trims the queue from
       there on — the chain broke, re-declare from the break */
    const FLASH_SECS = 0.6;   // refusal ring duration
    const BUMP_SECS = 0.8;    // head-shake duration on a mis-called link
    const BUMP_WOBBLE = 0.5;  // rad of the shake
    const END_HINT_SECS = 1.2;// end-member glint after a mid-table start
    const BEAT_GAP = 0.18;    // s between segments lighting in the beat
    const BEAT_SECS = 0.5;    // s each stays lit
    const BEAT_TAIL = 0.7;    // s after the sweep before the done bar
    /* celebration circuits (Roger 2026-11-03): the recital complete,
       the snake runs the shape again — out and back counts as one
       circuit pair: retracing never self-crosses on ANY pose, and the
       lap closes where the recital ended. Brisk, no dwelling. */
    const LAP_RUNS = +(qs.get('laps') || 2); // direction reversals
    const LAP_SPEED = 1.45;   // × SNAKE_SPEED while celebrating
    const LAP_MIN_DRIVE = 0.4;// floor — the lap flows, never creeps
    const LAP_DIST = 22;      // arrival radius at a lap vertex
    const ROUTE_LINE = true;  // dashed line through the declared queue —
    //   the plan made visible; foresight you can see
    const IDLE_DRIFT = 7;     // px breathing amplitude while waiting —
    //   a resting snake drifts, never freezes
    const IDLE_PERIOD = 4.3;  // s of the drift's slow oval
    const TAP_PAD = 10;       // extra tap tolerance around stops
    const HEAD_TAP_PAD = 16;  // tap-the-snake forgiveness
    const CAPTION = 'tap them in order — tap the snake to start';
    //   '' hides it; shown only on the first deal of a visit
    const BLINK_MIN = 2.4, BLINK_MAX = 6;  // s between blinks
    const BLINK_SECS = 0.28;               // lid dip duration

    const AUTO_GO = qs.get('go') !== '0';

    /* ---------- game state ---------- */
    let table = 3;
    let state = 'menu';        // menu | declare | perform | celebrate | done
    let head = { x: 0, y: 0 };
    let rest = { x: 0, y: 0 }; // anchor the waiting snake breathes around
    let heading = -Math.PI / 2;
    let segs = [];             // collected stops as body, index 0 = nearest head
    let trail = [];            // the head's recent path, newest first
    let stops = [];            // {v, x, y, flashUntil, collected}
    let queue = [];            // declared stops, in order — the script
    let dir = 0;               // +1 forward recital, -1 descent (set on first collect)
    let taken = 0;             // stops collected so far this deal
    let recital = [];          // stops in collection order — the performed script
    let laps = [], lapIdx = 0; // celebration circuit vertices
    let curPose = 'scatter';   // the pose this deal was built from
    let dwellUntil = 0;        // the beat at a collected stop
    let lastPlanChange = 0;    // last queue edit — arms the auto-release
    let bumpT0 = -1e9, bumpUntil = 0;
    let endHintUntil = 0;      // end-members glint after a mid-table start
    let beatT0 = 0;            // reinforcement sweep start (celebrate)
    let gazePt = null;         // where the waiting snake is looking
    let misses = 0, gamesDone = 0;
    let nextBlinkAt = 0, blinkT0 = -1;

    /* ---------- canvas: virtual resolution ----------
       Same scheme as tilt-snake: the board is DESIGN_W design-px wide,
       one scale K maps to the device, height breathes, K capped so wide
       screens widen the world rather than inflate the snake. */
    const DESIGN_W = 375;
    const K_MAX = 1.8;
    const MIN_DESIGN_H = 480;
    const cv = document.getElementById('c');
    const ctx = cv.getContext('2d');
    let W = 0, H = 0, Wd = 0, Hd = 0, DPR = 1, K = 1;
    function resize() {
      const vv = window.visualViewport;
      const w = vv ? vv.width : window.innerWidth;
      const h = vv ? vv.height : window.innerHeight;
      if (w < 50 || h < 50) return;
      DPR = Math.min(window.devicePixelRatio || 1, 3);
      W = w; H = h;
      K = Math.min(W / DESIGN_W, H / MIN_DESIGN_H, K_MAX);
      Wd = W / K; Hd = H / K;
      cv.width = W * DPR; cv.height = H * DPR;
      cv.style.width = W + 'px'; cv.style.height = H + 'px';
      ctx.setTransform(DPR * K, 0, 0, DPR * K, 0, 0);
      stops.forEach(n => {
        n.x = Math.min(Math.max(n.x, STOP_MARGIN), Wd - STOP_MARGIN);
        n.y = Math.min(Math.max(n.y, STOP_MARGIN), Hd - STOP_MARGIN);
      });
      head.x = Math.min(Math.max(head.x, HEAD_R), Wd - HEAD_R);
      head.y = Math.min(Math.max(head.y, HEAD_R), Hd - HEAD_R);
      rest.x = Math.min(Math.max(rest.x, HEAD_R), Wd - HEAD_R);
      rest.y = Math.min(Math.max(rest.y, HEAD_R), Hd - HEAD_R);
    }
    window.addEventListener('resize', resize);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
    document.addEventListener('fullscreenchange', () => {
      resize();
      setTimeout(resize, 400);
    });
    resize();

    // telemetry stub — same shape as the family: memory only for now
    const events = [];
    const sid = Math.random().toString(36).slice(2, 10);
    function logEvent(type, data) {
      events.push({ t: Math.round(performance.now()), sid, type, ...data });
    }

    /* ---------- poses ----------
       Each pose emits 12 points in VALUE ORDER inside a unit box;
       rotMir and fitPose then make it a family, not a fixture —
       random rotation, mirror and a stretch-or-true fit into the
       board margins. POSE_FIT: 1 keeps the shape honest (uniform
       scale, so spirals stay round), 0 lets it fill the board. */
    const POSES = {
      /* v2 (Roger 2026-11-03): irregular over regular — poses are
         gestures, not diagrams. Uneven rays, uneven strokes, breathing
         amplitudes: discoverable without ever being a grid. All still
         non-crossing: angles stay monotonic, axes stay monotonic. */
      spiral(n) {
        const turns = 1.2 + Math.random() * 0.7;
        const a0 = Math.random() * Math.PI * 2;
        const sgn = Math.random() < 0.5 ? 1 : -1;
        const out = Math.random() < 0.5;   // ×1 at the core or the rim
        const r0 = 0.13, r1 = 0.46;
        const wob = 0.04 + Math.random() * 0.05;   // reach breathes
        const wfreq = 2 + Math.random() * 2, wph = Math.random() * Math.PI * 2;
        const pts = [];
        for (let i = 0; i < n; i++) {
          const f = i / (n - 1);
          // angle steps wander a little — not a clockwork coil
          const a = a0 + sgn * (f + 0.05 * Math.sin(f * Math.PI * 3)) * turns * Math.PI * 2;
          let r = out ? r0 + (r1 - r0) * f : r1 - (r1 - r0) * f;
          r += wob * Math.sin(f * wfreq * Math.PI * 2 + wph);
          r = Math.max(0.08, Math.min(0.48, r));
          pts.push({ x: 0.5 + Math.cos(a) * r, y: 0.5 + Math.sin(a) * r });
        }
        return pts;
      },
      zigzag(n) {
        // strokes, not lanes: rows of uneven weight and uneven reach,
        // serpentine order keeps it non-crossing
        const rows = Math.random() < 0.5 ? 3 : 4;
        const vert = Math.random() < 0.4;
        // deal the n stops into rows, ≥2 each
        const counts = new Array(rows).fill(2);
        for (let i = 2 * rows; i < n; i++)
          counts[Math.floor(Math.random() * rows)]++;
        // uneven row bands
        const cuts = [0];
        for (let r = 1; r < rows; r++)
          cuts.push(cuts[r - 1] + (0.6 + Math.random() * 0.8));
        const total = cuts[rows - 1] + (0.6 + Math.random() * 0.8);
        const pts = [];
        for (let r = 0; r < rows; r++) {
          const y = (cuts[r] + (cuts[r + 1] || total)) / 2 / total;
          const c = counts[r];
          const xs = [];
          for (let i = 0; i < c; i++)
            xs.push(0.08 + 0.84 * (i + (0.2 + Math.random() * 0.6)) / c);
          xs.sort((a, b) => a - b);
          if (r % 2) xs.reverse();
          xs.forEach(x => pts.push(vert ? { x: y, y: x } : { x, y }));
        }
        return pts;
      },
      wave(n) {
        const freq = 1 + Math.random() * 1.2;
        const ph = Math.random() * Math.PI * 2;
        const A = 0.22 + Math.random() * 0.1;
        const mph = Math.random() * Math.PI * 2;   // amplitude breathes
        const vert = Math.random() < 0.4;
        const pts = [];
        for (let i = 0; i < n; i++) {
          const x = i / (n - 1);
          const amp = A * (0.55 + 0.45 * Math.sin(x * Math.PI + mph));
          const y = 0.5 + amp * Math.sin(x * freq * Math.PI * 2 + ph);
          pts.push(vert ? { x: y, y: x } : { x, y });
        }
        return pts;
      },
      bolt(n) {
        // cartoon lightning with longer and shorter strokes: progress
        // along the diagonal is steady, but the jags vary wildly —
        // some near-axis hops, some deep cuts, sides not always
        // alternating (Roger's stroke idea)
        const pts = [];
        let side = Math.random() < 0.5 ? 1 : -1;
        for (let i = 0; i < n; i++) {
          const f = i / (n - 1);
          if (Math.random() < 0.7) side = -side;   // mostly zigzags
          const off = (0.05 + Math.random() * 0.2) * side;
          pts.push({ x: f + off / Math.SQRT2, y: f - off / Math.SQRT2 });
        }
        return pts;
      },
      sun(n) {
        // the honest star, de-geared: uneven rays at uneven angles —
        // a scribbled asterisk, still monotonic around the hub so
        // the route never crosses itself
        const a0 = Math.random() * Math.PI * 2;
        const sgn = Math.random() < 0.5 ? 1 : -1;
        const rIn = 0.16 + Math.random() * 0.1, rOut = 0.44;
        const gaps = [];
        let sum = 0;
        for (let i = 0; i < n; i++) {
          const g = 0.5 + Math.random();
          gaps.push(g); sum += g;
        }
        const pts = [];
        let a = a0;
        for (let i = 0; i < n; i++) {
          a += sgn * gaps[i] * Math.PI * 2 / sum;
          const r = i % 2
            ? rIn * (0.8 + Math.random() * 0.5)
            : rOut * (0.88 + Math.random() * 0.24);
          pts.push({ x: 0.5 + Math.cos(a) * r, y: 0.5 + Math.sin(a) * r });
        }
        return pts;
      },
      s(n) {
        // the family glyph, lopsided — one belly wider than the other
        const A1 = 0.2 + Math.random() * 0.14;
        const A2 = 0.2 + Math.random() * 0.14;
        const pts = [];
        for (let i = 0; i < n; i++) {
          const f = i / (n - 1);
          const A = f < 0.5 ? A1 : A2;
          pts.push({ x: 0.5 + A * Math.sin(f * Math.PI * 2), y: f });
        }
        return pts;
      },
    };
    const POSE_FIT = { spiral: 1, sun: 1, s: 0, zigzag: 0, wave: 0, bolt: 0 };
    const POSE_POOL = ['spiral', 'zigzag', 'wave', 'bolt', 'sun', 's'];
    const POSE_ALIAS = { star: 'sun', squiggle: 'wave', spiral2: 'spiral' };
    function pickPose() {
      let p = POSE_ALIAS[POSE] || POSE;
      if (p === 'random')
        return POSE_POOL[Math.floor(Math.random() * POSE_POOL.length)];
      // an unknown name falls back to the pool, never silently to
      // scatter — a misspelt param should surprise, not look broken
      if (p !== 'scatter' && !POSES[p]) {
        logEvent('pose-unknown', { p });
        return POSE_POOL[Math.floor(Math.random() * POSE_POOL.length)];
      }
      return p;
    }
    function rotMir(pts) {
      const a = (Math.random() * 2 - 1) * POSE_ROT;
      const mx = Math.random() < 0.5 ? -1 : 1;
      const c = Math.cos(a), s = Math.sin(a);
      return pts.map(p => {
        const x = (p.x - 0.5) * mx, y = p.y - 0.5;
        return { x: 0.5 + x * c - y * s, y: 0.5 + x * s + y * c };
      });
    }
    function fitPose(pts, uniform) {
      let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
      pts.forEach(p => {
        x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x);
        y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y);
      });
      const m = STOP_MARGIN, bw = Wd - 2 * m, bh = Hd - 2 * m;
      let sx = bw / (x1 - x0 || 1e-6), sy = bh / (y1 - y0 || 1e-6);
      if (uniform) sx = sy = Math.min(sx, sy);
      const ox = m + (bw - (x1 - x0) * sx) / 2 - x0 * sx;
      const oy = m + (bh - (y1 - y0) * sy) / 2 - y0 * sy;
      return pts.map(p => ({ x: p.x * sx + ox, y: p.y * sy + oy }));
    }
    /* gentle push-apart so a pose can't land stops on top of each
       other or the head — keeps the shape, just un-knots the knots */
    function relax() {
      const all = stops;
      for (let k = 0; k < 60; k++) {
        let moved = false;
        for (let i = 0; i < all.length; i++)
          for (let j = i + 1; j < all.length; j++) {
            const a = all[i], b = all[j];
            let dx = b.x - a.x, dy = b.y - a.y;
            let d = Math.hypot(dx, dy);
            if (d < RELAX_SEP) {
              if (d < 1e-3) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; d = 1; }
              const push = (RELAX_SEP - d) / d * 0.5;
              a.x -= dx * push; a.y -= dy * push;
              b.x += dx * push; b.y += dy * push;
              moved = true;
            }
          }
        all.forEach(n => {
          const dx = n.x - head.x, dy = n.y - head.y;
          const d = Math.hypot(dx, dy), min = HEAD_R + STOP_R + 8;
          if (d < min && d > 1e-3) {
            n.x = head.x + dx / d * min; n.y = head.y + dy / d * min;
          }
          n.x = Math.min(Math.max(n.x, STOP_MARGIN), Wd - STOP_MARGIN);
          n.y = Math.min(Math.max(n.y, STOP_MARGIN), Hd - STOP_MARGIN);
        });
        if (!moved) break;
      }
    }

    /* ---------- deal ---------- */
    function dealStops() {
      stops = [];
      const want = [];
      for (let i = 1; i <= 12; i++) want.push(table * i);
      // decoys are always dealt LOOSE — they are members of no path
      const nonMembers = [];
      for (let n = 2; n <= table * 12; n++)
        if (n % table !== 0) nonMembers.push(n);
      const decoys = [];
      for (let i = 0; i < DECOYS && nonMembers.length; i++)
        decoys.push(nonMembers.splice(
          Math.floor(Math.random() * nonMembers.length), 1)[0]);

      const pose = pickPose();
      curPose = pose;
      const loose = [];         // values needing a loose stop
      if (pose !== 'scatter' && POSES[pose]) {
        const pts = fitPose(rotMir(POSES[pose](12)), POSE_FIT[pose]);
        // blanks: interior path members become empty sockets; their
        // values are dealt loose — "what goes here?" is the question
        const interior = [];
        for (let i = 1; i < 11; i++) interior.push(i);
        const blankIdx = new Set();
        for (let i = 0; i < BLANKS && interior.length; i++)
          blankIdx.add(interior.splice(
            Math.floor(Math.random() * interior.length), 1)[0]);
        pts.forEach((p, i) => {
          const socket = blankIdx.has(i);
          if (socket) loose.push(want[i]);
          stops.push({ v: want[i], x: p.x, y: p.y, socket,
            flashUntil: 0, collected: false });
        });
        // path-order jitter AFTER fitting — the family stays loose
        stops.forEach(n => {
          n.x += (Math.random() * 2 - 1) * POSE_JITTER;
          n.y += (Math.random() * 2 - 1) * POSE_JITTER;
        });
      } else {
        loose.push(...want);    // scatter: every stop is loose
      }
      loose.push(...decoys);

      // loose stops: scattered with the usual separation rules, and
      // the grid fallback so a missing stop can never break a recital
      let guard = 0, placedLoose = 0;
      while (placedLoose < loose.length && guard++ < 4000) {
        const x = STOP_MARGIN + Math.random() * (Wd - 2 * STOP_MARGIN);
        const y = STOP_MARGIN + Math.random() * (Hd - 2 * STOP_MARGIN);
        if (Math.hypot(x - head.x, y - head.y) < 140) continue;
        if (stops.every(n => Math.hypot(n.x - x, n.y - y) >= STOP_SEP)) {
          stops.push({ v: loose[placedLoose], x, y, flashUntil: 0, collected: false });
          placedLoose++;
        }
      }
      if (placedLoose < loose.length) {
        const cols = Math.max(2, Math.floor((Wd - 2 * STOP_MARGIN) / STOP_SEP));
        const rows = Math.ceil(loose.length / cols);
        const cw = (Wd - 2 * STOP_MARGIN) / cols;
        const ch = (Hd - 2 * STOP_MARGIN) / rows;
        for (let r = 0; r < rows; r++)
          for (let c = 0; c < cols && placedLoose < loose.length; c++) {
            const x = STOP_MARGIN + cw * (c + 0.5);
            const y = STOP_MARGIN + ch * (r + 0.5);
            if (stops.every(n => Math.hypot(n.x - x, n.y - y) >= STOP_R * 2 + 6)) {
              stops.push({ v: loose[placedLoose], x, y, flashUntil: 0, collected: false });
              placedLoose++;
            }
          }
      }
      relax();
      logEvent('deal', { pose, blanks: BLANKS });
    }

    /* ---------- the declaration ----------
       A tap on a free stop declares it — appends to the script. A tap
       on a declared stop takes it back. The snake never judges a tap;
       only the performance discovers error. */
    function stopAt(x, y) {
      return stops.find(n => !n.collected && !n.socket &&
        Math.hypot(n.x - x, n.y - y) < STOP_R + TAP_PAD);
    }
    function socketAt(x, y) {
      return stops.find(n => n.socket &&
        Math.hypot(n.x - x, n.y - y) < STOP_R + TAP_PAD);
    }
    function declare(n, now) {
      const i = queue.indexOf(n);
      if (i >= 0) queue.splice(i, 1);      // take back a declared stop
      else queue.push(n);                  // declare: add to the script
      gazePt = { x: n.x, y: n.y };         // it watched your tap
      lastPlanChange = now;
      logEvent(i >= 0 ? 'undeclare' : 'declare', { v: n.v, q: queue.length });
    }
    /* the snake is tapped: with a script ready it performs; mid-
       performance the same tap asks it to wait again */
    function toggleRelease(now) {
      if (state === 'declare' && queue.length) {
        state = 'perform';
        dwellUntil = 0;
        logEvent('release', { q: queue.length });
      } else if (state === 'perform') {
        state = 'declare';
        rest.x = head.x; rest.y = head.y;  // waits where it was asked
        lastPlanChange = now;
        logEvent('hold', { q: queue.length });
      }
    }

    cv.addEventListener('pointerdown', (t) => {
      if (state !== 'declare' && state !== 'perform') return;
      const now = performance.now();
      const x = t.clientX / K, y = t.clientY / K;
      if (Math.hypot(x - head.x, y - head.y) < HEAD_R + HEAD_TAP_PAD) {
        toggleRelease(now);
        return;
      }
      const n = stopAt(x, y);
      if (n) { declare(n, now); return; }
      // a tap on a socket flashes it — "nothing here to take", the
      // gap answering for itself rather than sitting dead
      const sk = socketAt(x, y);
      if (sk) sk.flashUntil = now + FLASH_SECS * 1000;
    });
    cv.addEventListener('touchmove', (t) => t.preventDefault(), { passive: false });

    /* ---------- the performance ---------- */
    /* the value the recital wants next: dir 0 still undecided — only
       an end may open; then consecutive members in the run direction */
    function expected() {
      if (dir === 0) return 0;             // ends only — handled by caller
      return dir > 0 ? table * (taken + 1) : table * (12 - taken);
    }
    function isEnd(v) { return v === table || v === table * 12; }

    /* the stop the recital wants next — feeds the waiting gaze and the
       escalating pulse. dir 0 gazes at the nearer end, carrying the
       "a recital starts at an end" hint inside a look */
    function expectedStop() {
      if (dir === 0) {
        let best = null, bd = 1e9;
        stops.forEach(n => {
          if (n.collected || n.socket || !isEnd(n.v)) return;
          const d = Math.hypot(n.x - head.x, n.y - head.y);
          if (d < bd) { bd = d; best = n; }
        });
        return best;
      }
      const v = expected();
      return stops.find(n => !n.collected && !n.socket && n.v === v) || null;
    }

    function collect(n, now) {
      n.collected = true;
      queue.shift();
      taken++;
      if (dir === 0) dir = n.v === table ? 1 : -1;
      // newest capture joins the tail end, one SEG_GAP behind the tip
      const lead = segs.length ? segs[segs.length - 1] : head;
      const prev = segs.length >= 2 ? segs[segs.length - 2] : head;
      let tx = lead.x - prev.x, ty = lead.y - prev.y;
      const td = Math.hypot(tx, ty);
      if (td > 1e-3) { tx /= td; ty /= td; }
      else { tx = -Math.cos(heading); ty = -Math.sin(heading); }
      segs.push({ x: lead.x + tx * SEG_GAP, y: lead.y + ty * SEG_GAP, v: n.v, litAt: 0 });
      recital.push(n);
      dwellUntil = now + STOP_DWELL * 1000;
      logEvent('collect', { v: n.v, ord: taken });
      if (taken === 12) {
        state = 'celebrate';
        // circuits: starting at the last stop, retrace to the first,
        // then forward again — LAP_RUNS reversals alternating back/fwd
        const back = recital.slice(0, -1).reverse();
        const fwd = recital.slice(1);
        laps = [];
        for (let i = 0; i < LAP_RUNS; i++)
          laps.push(...(i % 2 ? fwd : back));
        lapIdx = 0;
        gamesDone++;
        logEvent('complete', { misses });
      }
    }

    function refuse(n, now) {
      n.flashUntil = now + FLASH_SECS * 1000;
      misses++;
      const i = queue.indexOf(n);
      if (i >= 0) queue.length = TRIM_ON_REFUSE ? i : queue.length;
      if (!TRIM_ON_REFUSE && i >= 0) queue.splice(i, 1);
      // a mid-table opening: not a wrong number, a wrong place to
      // begin — both ends glint, carrying the hint inside the refusal
      if (dir === 0 && !isEnd(n.v)) endHintUntil = now + END_HINT_SECS * 1000;
      bumpT0 = now;
      bumpUntil = now + BUMP_SECS * 1000;
      state = 'declare';
      rest.x = head.x; rest.y = head.y;    // waits AT the broken link
      lastPlanChange = now;
      gazePt = { x: n.x, y: n.y };
      logEvent('refuse', { v: n.v, want: dir === 0 ? 'an end' : expected() });
    }

    function wrapAngle(d) {
      while (d > Math.PI) d -= 2 * Math.PI;
      while (d < -Math.PI) d += 2 * Math.PI;
      return d;
    }

    /* ---------- step ---------- */
    let lastT = performance.now();

    function step(dt, now) {
      // blink runs in every state — the snake is alive throughout
      if (nextBlinkAt === 0) nextBlinkAt = now + 1500;

      if (state === 'declare') {
        // a resting snake drifts — a slow oval around its anchor
        const w = now / 1000 / IDLE_PERIOD * Math.PI * 2;
        head.x = rest.x + Math.sin(w) * IDLE_DRIFT;
        head.y = rest.y + Math.sin(w * 2) * IDLE_DRIFT * 0.6;
        // the waiting snake sets off itself if release is never tapped
        if (AUTO_GO && WAIT_GO_SECS > 0 && queue.length &&
          now - lastPlanChange > WAIT_GO_SECS * 1000) {
          state = 'perform';
          dwellUntil = 0;
          logEvent('auto-release', { q: queue.length });
        }
      }

      if (state === 'perform' && now >= dwellUntil) {
        if (!queue.length) {
          state = 'declare';               // script ran out — wait for more
          rest.x = head.x; rest.y = head.y;
          lastPlanChange = now;
        } else {
          const n = queue[0];
          const dx = n.x - head.x, dy = n.y - head.y;
          const dist = Math.hypot(dx, dy);
          const target = Math.atan2(dy, dx);
          const d = wrapAngle(target - heading);
          const amt = d * Math.min(1, TURN_RESPOND * dt);
          heading += Math.max(-TURN_RATE * dt, Math.min(TURN_RATE * dt, amt));
          // ease in like a billiards roll — full pace far out, a creep
          // on approach so the arrival reads as intent, not collision
          const drive = Math.max(MIN_DRIVE, Math.min(1, dist / APPROACH_DIST));
          head.x += Math.cos(heading) * SNAKE_SPEED * drive * dt;
          head.y += Math.sin(heading) * SNAKE_SPEED * drive * dt;
          head.x = Math.max(HEAD_R, Math.min(Wd - HEAD_R, head.x));
          head.y = Math.max(HEAD_R, Math.min(Hd - HEAD_R, head.y));
          if (dist < EAT_DIST) {
            // the performance discovers error — not the tap
            const ok = dir === 0 ? isEnd(n.v) : n.v === expected();
            if (ok) collect(n, now);
            else refuse(n, now);
          }
        }
      }

      // head-shake while refusing — a puzzled wobble, not a punishment
      if (now < bumpUntil && state !== 'perform') {
        const k = 1 - (bumpUntil - now) / (BUMP_SECS * 1000);
        heading += Math.sin(k * Math.PI * 5) * BUMP_WOBBLE * (1 - k) * 0.1;
      }

      // tail follows the head's own path, exactly as tilt-snake: each
      // segment sits a further SEG_GAP back along the drawn trail
      const t0 = trail[0];
      if (!t0 || Math.hypot(head.x - t0.x, head.y - t0.y) > 1)
        trail.unshift({ x: head.x, y: head.y });
      let lead = head, ti = 0, back = 0, a = head;
      segs.forEach((sg, k) => {
        const want = (k + 1) * SEG_GAP;
        let onTrail = false;
        while (ti < trail.length) {
          const b = trail[ti];
          const d = Math.hypot(b.x - a.x, b.y - a.y);
          if (back + d >= want) {
            const f = (want - back) / (d || 1);
            sg.x = a.x + (b.x - a.x) * f;
            sg.y = a.y + (b.y - a.y) * f;
            onTrail = true;
            break;
          }
          back += d; a = b; ti++;
        }
        if (!onTrail) {
          const dx = lead.x - sg.x, dy = lead.y - sg.y;
          const d = Math.hypot(dx, dy) || 1;
          sg.x = lead.x - dx / d * SEG_GAP;
          sg.y = lead.y - dy / d * SEG_GAP;
        }
        lead = sg;
      });
      if (trail.length > ti + 40) trail.length = ti + 40;

      // celebration circuits — the shape run again, brisk, no dwell:
      // the farewell is the recital played back at speed
      if (state === 'celebrate' && now >= dwellUntil) {
        if (lapIdx < laps.length) {
          const n = laps[lapIdx];
          const dx = n.x - head.x, dy = n.y - head.y;
          const dist = Math.hypot(dx, dy);
          const target = Math.atan2(dy, dx);
          const d = wrapAngle(target - heading);
          const amt = d * Math.min(1, TURN_RESPOND * dt);
          heading += Math.max(-TURN_RATE * dt, Math.min(TURN_RATE * dt, amt));
          const drive = Math.max(LAP_MIN_DRIVE, Math.min(1, dist / APPROACH_DIST));
          head.x += Math.cos(heading) * SNAKE_SPEED * LAP_SPEED * drive * dt;
          head.y += Math.sin(heading) * SNAKE_SPEED * LAP_SPEED * drive * dt;
          head.x = Math.max(HEAD_R, Math.min(Wd - HEAD_R, head.x));
          head.y = Math.max(HEAD_R, Math.min(Hd - HEAD_R, head.y));
          if (dist < LAP_DIST) lapIdx++;
        } else {
          // laps done — the beat re-plays the child's own recital,
          // collection order, so a descent lights as a descent
          beatT0 = now;
          segs.forEach((s, i) => s.litAt = beatT0 + i * BEAT_GAP * 1000);
          state = 'beat';
        }
      }
      if (state === 'beat' && now > beatT0 +
        (segs.length * BEAT_GAP + BEAT_SECS + BEAT_TAIL) * 1000) {
        state = 'done';
        doneBar.classList.add('show');
      }
    }

    /* ---------- draw ---------- */
    function blinkScale(now) {
      if (blinkT0 < 0) {
        if (now < nextBlinkAt) return 1;
        blinkT0 = now;
      }
      const k = (now - blinkT0) / 1000 / BLINK_SECS;
      if (k >= 1) {
        blinkT0 = -1;
        nextBlinkAt = now + (BLINK_MIN + Math.random() * (BLINK_MAX - BLINK_MIN)) * 1000;
        return 1;
      }
      return 1 - Math.sin(k * Math.PI) * 0.88;
    }

    function drawStop(n, now) {
      // sockets are ghosts — an empty ring where a stop belongs;
      // the question "what goes here?" is the child's to answer
      if (n.socket) {
        ctx.beginPath();
        ctx.arc(n.x, n.y, STOP_R, 0, Math.PI * 2);
        ctx.setLineDash([3, 5]);
        ctx.strokeStyle = n.flashUntil > now
          ? '#e0a53a' : 'rgba(140,160,175,0.45)';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.setLineDash([]);
        return;
      }
      const flash = n.flashUntil > now;
      const qi = queue.indexOf(n);
      const declared = qi >= 0;
      // the escalating cue: idle with an empty script past
      // NEXT_HINT_SECS and the wanted stop breathes — gaze first,
      // a pulse only when looking wasn't enough
      const wanted = NEXT_HINT_SECS > 0 && state === 'declare' &&
        !queue.length && now - lastPlanChange > NEXT_HINT_SECS * 1000 &&
        (dir === 0 ? isEnd(n.v) : n === expectedStop());
      if (wanted) {
        ctx.beginPath();
        ctx.arc(n.x, n.y, STOP_R + 7 + Math.sin(now / 260) * 3, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(77,163,255,0.5)';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
      const isEndMember = dir === 0 && isEnd(n.v);
      const hinting = isEndMember && now < endHintUntil &&
        queue.length === 0;   // glint only if nothing valid is queued
      ctx.beginPath();
      ctx.arc(n.x, n.y, STOP_R, 0, Math.PI * 2);
      ctx.fillStyle = flash ? '#5a4a28' : (declared ? '#1d3a4f' : '#1a2430');
      ctx.fill();
      ctx.strokeStyle = flash ? '#e0a53a'
        : (declared ? '#4da3ff'
          : (hinting ? 'rgba(224,165,58,0.9)' : '#2c3e50'));
      ctx.lineWidth = declared || hinting ? 2.5 : 1.5;
      ctx.stroke();
      if (hinting) {
        ctx.beginPath();
        ctx.arc(n.x, n.y, STOP_R + 7 + Math.sin(now / 200) * 3, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(224,165,58,0.5)';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
      ctx.fillStyle = flash ? '#e0a53a' : '#cfd8e0';
      ctx.font = 'bold ' + (STOP_R - 2) + 'px Andika, -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(n.v, n.x, n.y + 1);
      if (declared) {
        // the script's line number — the declaration made visible
        ctx.beginPath();
        ctx.arc(n.x + STOP_R * 0.72, n.y - STOP_R * 0.72, 9, 0, Math.PI * 2);
        ctx.fillStyle = '#4da3ff';
        ctx.fill();
        ctx.fillStyle = '#101418';
        ctx.font = 'bold 11px Andika, -apple-system, sans-serif';
        ctx.fillText(qi + 1, n.x + STOP_R * 0.72, n.y - STOP_R * 0.72 + 1);
      }
    }

    function draw(now) {
      ctx.clearRect(0, 0, Wd, Hd);
      const hue = (table * 31 + 200) % 360;

      // the declared route — the plan drawn as a dashed thread so the
      // child sees the shape of what they asked for; during the lap
      // it traces the circuit still ahead
      const route = state === 'celebrate' ? laps.slice(lapIdx) : queue;
      if (ROUTE_LINE && route.length) {
        ctx.beginPath();
        ctx.setLineDash([5, 7]);
        ctx.moveTo(head.x, head.y);
        route.forEach(n => ctx.lineTo(n.x, n.y));
        ctx.strokeStyle = 'hsla(' + hue + ',60%,55%,0.35)';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.setLineDash([]);
      }

      stops.forEach(n => { if (!n.collected) drawStop(n, now); });

      // tail, back to front
      for (let i = segs.length - 1; i >= 0; i--) {
        const sg = segs[i];
        const lit = sg.litAt && now >= sg.litAt && now < sg.litAt + BEAT_SECS * 1000;
        ctx.beginPath();
        ctx.arc(sg.x, sg.y, SEG_R, 0, Math.PI * 2);
        ctx.fillStyle = lit
          ? 'hsl(' + hue + ',75%,62%)'
          : 'hsl(' + hue + ',60%,45%)';
        ctx.fill();
        ctx.strokeStyle = 'hsl(' + hue + ',55%,36%)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 15px Andika, -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(sg.v, sg.x, sg.y + 1);
      }

      // head — pupils face the heading while performing. While waiting
      // they watch the child's newest declaration; with the script
      // empty they rest on the wanted stop — a look, not a label
      let eyeDir = heading;
      if (state === 'declare') {
        const g = queue.length ? queue[queue.length - 1]
          : (GAZE_NEXT ? expectedStop() : gazePt);
        if (g) eyeDir = Math.atan2(g.y - head.y, g.x - head.x);
      }
      ctx.beginPath();
      ctx.arc(head.x, head.y, HEAD_R, 0, Math.PI * 2);
      const grd = ctx.createRadialGradient(
        head.x - HEAD_R * 0.33, head.y - HEAD_R * 0.33, HEAD_R * 0.2,
        head.x, head.y, HEAD_R);
      grd.addColorStop(0, 'hsl(' + hue + ',62%,64%)');
      grd.addColorStop(1, 'hsl(' + hue + ',56%,28%)');
      ctx.fillStyle = grd;
      ctx.fill();
      ctx.strokeStyle = 'hsl(' + hue + ',58%,40%)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      const ex = Math.cos(eyeDir), ey = Math.sin(eyeDir);
      const px = -ey, py = ex;
      const sq = blinkScale(now);
      [[1, 0], [-1, 0]].forEach(([sgn]) => {
        ctx.beginPath();
        ctx.ellipse(head.x + ex * HEAD_R * 0.38 + px * sgn * HEAD_R * 0.36,
          head.y + ey * HEAD_R * 0.38 + py * sgn * HEAD_R * 0.36,
          HEAD_R * 0.16, Math.max(HEAD_R * 0.16 * sq, HEAD_R * 0.03),
          eyeDir, 0, Math.PI * 2);
        ctx.fillStyle = '#101418';
        ctx.fill();
      });

      // first-deal caption — a lab legibility aid, not lesson prose;
      // CAPTION = '' removes it
      if (CAPTION && state === 'declare' && gamesDone === 0 && taken === 0) {
        ctx.fillStyle = 'rgba(138,151,163,0.8)';
        ctx.font = '14px Andika, -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(CAPTION, Wd / 2, Hd - 28);
      }

      // pose label — confirms a ?pose= param actually took (the
      // params "not working" was a silent fallback; never again)
      if (qs.has('pose')) {
        ctx.fillStyle = 'rgba(138,151,163,0.55)';
        ctx.font = '12px Andika, -apple-system, sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText('pose: ' + curPose, 10, Hd - 12);
      }
    }

    function frame(now) {
      const dt = Math.min((now - lastT) / 1000, 0.05);
      lastT = now;
      step(dt, now);
      try { draw(now); } catch (e) { /* a bad frame must never kill the loop */ }
      requestAnimationFrame(frame);
    }

    /* ---------- orientation guard ---------- */
    const rotOverlay = document.getElementById('rotOverlay');
    const handheld = matchMedia('(pointer: coarse)').matches;
    function checkOrientation() {
      const portrait = H >= W;
      rotOverlay.classList.toggle('hidden', !(handheld && !portrait));
    }
    function scheduleOrientationCheck() {
      checkOrientation();
      setTimeout(checkOrientation, 350);
    }
    window.addEventListener('orientationchange', scheduleOrientationCheck);
    window.addEventListener('resize', scheduleOrientationCheck);
    checkOrientation();
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) lastT = performance.now();
    });

    /* ---------- rounds ---------- */
    const tableOverlay = document.getElementById('tableOverlay');
    const doneBar = document.getElementById('doneBar');

    function deal(now) {
      segs = []; trail = [{ x: head.x, y: head.y }];
      queue = []; dir = 0; taken = 0;
      recital = []; laps = []; lapIdx = 0;
      dwellUntil = 0; misses = 0;
      bumpT0 = -1e9; bumpUntil = 0; endHintUntil = 0;
      gazePt = null;
      rest.x = head.x; rest.y = head.y;
      dealStops();
      lastPlanChange = now;
      state = 'declare';
    }

    function startRound(t, now) {
      table = t;
      head.x = Wd / 2; head.y = Hd * 0.55;
      heading = -Math.PI / 2;
      deal(now);
    }

    // table chips lock once a round has started — selection lives
    // between games, per the family convention
    const tableRow = document.getElementById('tableRow');
    for (let t = 2; t <= 12; t++) {
      const b = document.createElement('button');
      b.textContent = '×' + t;
      b.addEventListener('click', () => {
        tableOverlay.classList.add('hidden');
        startRound(t, performance.now());
      });
      tableRow.appendChild(b);
    }

    document.getElementById('againYes').addEventListener('click', () => {
      doneBar.classList.remove('show');
      deal(performance.now());
    });
    document.getElementById('againNo').addEventListener('click', () => {
      doneBar.classList.remove('show');
      tableOverlay.classList.remove('hidden');
      state = 'menu';
    });

    // lab aid: ?t=N jumps straight into table N, skipping the chips
    if (qs.has('t')) {
      tableOverlay.classList.add('hidden');
      startRound(Math.min(12, Math.max(2, +qs.get('t') || table)), performance.now());
    }

    // paint the dealt board at once — no waiting on the first rAF
    if (state !== 'menu') draw(performance.now());

    requestAnimationFrame(frame);
  </script>
