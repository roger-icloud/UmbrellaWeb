<!DOCTYPE html>
<html lang="en">

<head>
  <script src="gate.js?v=1"></script>
  <meta charset="utf-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#101418">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>Any Number of Times — shape &amp; number play</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #101418;
      color: #cfd8e0;
      font-family: Andika, -apple-system, system-ui, sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }

    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 24px 24px 40px;
    }

    /* the masthead: Introduction's book icon shares the title line,
       on the left (Roger, 2026-11-17) */
    .masthead {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      margin: 0;
    }

    .booklink {
      height: 38px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid #2a3540;
      background: rgba(20, 26, 33, 0.85);
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: #aab8c4;
      font-size: 13px;
      flex: none;
    }

    .booklink svg {
      width: 20px;
      height: 20px;
      stroke: #aab8c4;
    }

    /* ============ END OF INTRO ============ */

    .tiles {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .tile {
      display: block;
      padding: 0;
      border-radius: 14px;
      background: #1a2430;
      border: 1px solid #2c3e50;
      color: #cfd8e0;
      text-decoration: none;
      transition: border-color .8s ease, box-shadow .8s ease;
    }

    .tile.flat {
      grid-column: 1 / -1;
      padding: 14px 16px;
    }

    /* the corner index, like a playing card's rank-and-suit — overlaid
       on the art so the face stays free for the demo (Roger, 2026-11-16) */
    .tile .head {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 4px 9px;
      border-radius: 8px;
      background: rgba(16, 20, 24, .55);
    }

    .tile.flat .head {
      position: static;
      padding: 0;
      background: none;
    }

    .tile .icon {
      width: 20px;
      height: 20px;
      flex: none;
    }

    .tile.flat .icon {
      width: 32px;
      height: 32px;
    }

    .tile .name {
      font-size: 14px;
      font-weight: 600;
    }

    .tile.flat .name {
      font-size: 18px;
    }

    .tile.soon {
      opacity: .45;
    }

    .tile {
      -webkit-touch-callout: none;
      position: relative;
      overflow: hidden;
    }

    /* the stage: each portrait box keeps a pane where its demo plays
       while the spotlight is on it — ghosted icon at rest, live game
       when lit; the iframe is created on arrival and removed on
       departure so only one ever animates */
    .tile .stage {
      aspect-ratio: 3 / 4;
      max-height: 26vh;   /* all six cards visible without scrolling */
      border-radius: 10px;
      background: #101418;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .tile .stage .ghost {
      width: 60px;
      height: 60px;
      opacity: .16;
    }

    .tile .stage iframe {
      position: absolute;
      inset: 0;
      width: 400%;
      height: 400%;
      border: 0;
      transform: scale(.25);
      transform-origin: 0 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity .8s ease;
    }

    .tile .stage iframe.on {
      opacity: 1;
    }

    .tile .stage iframe.gone {
      opacity: 0;
    }

    /* the ghost stays put underneath — the fading demo covers it on
       the way in and reveals it on the way out, so the handoff is a
       dissolve, not a cut (Roger, 2026-11-17) */

    .tile.lit {
      border-color: #3d5f84;
      box-shadow: 0 0 14px rgba(77, 163, 255, .08);
    }

    /* the veil: a short introduction over the whole page on first
       visit — fades away on touch or after a few seconds */
    #veil {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(16, 20, 24, .94);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      opacity: 1;
      transition: opacity .9s ease;
    }

    #veil.gone {
      opacity: 0;
      pointer-events: none;
    }

    #veil .vh {
      font-size: 30px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    #veil .vs {
      font-size: 16px;
      color: #aab8c4;
      line-height: 1.6;
      padding: 0 32px;
    }

    /* long-press / hover tooltip — the tile's data-tip text, shown
       above the tile; the same words work on mouse and touch */
    #tip {
      position: fixed;
      max-width: 260px;
      padding: 8px 12px;
      border-radius: 10px;
      background: #243244;
      border: 1px solid #3a4a58;
      color: #cfd8e0;
      font-size: 13px;
      line-height: 1.4;
      pointer-events: none;
      opacity: 0;
      transition: opacity .15s;
      z-index: 20;
    }

    footer {
      max-width: 560px;
      margin: 0 auto;
      padding: 0 24px 40px;
      font-size: 14px;
      color: #5f6e7c;
      line-height: 1.6;
    }

    /* footer ripple: each letter rises and brightens in turn, a wave
       that runs across the line, rests, and runs again */
    footer .rl {
      display: inline-block;
      animation: ripple 3.2s ease-in-out infinite;
      animation-delay: calc(var(--i) * 55ms);
    }

    @keyframes ripple {
      0%, 28%, 100% { transform: none; color: #5f6e7c; }
      14% { transform: translateY(-0.4em) scale(1.18); color: #cfd8e0; }
    }

    @media (prefers-reduced-motion: reduce) {
      footer .rl { animation: none; }
    }

    /* wide screens deal the same portrait cards three across */
    @media (min-width: 900px) {
      main { max-width: 900px; }
      footer { max-width: 900px; }
      .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
  </style>
  <link rel="preload" href="fonts/andika-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/andika-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts/andika.css">
  <meta name="description" content="Free multiplication-table games for young learners — numbers you can catch, steer, search and watch come alive.">
</head>

<body>

          <path d="M3.5 5.5 Q7.5 4 12 5.8 Q16.5 4 20.5 5.5 L20.5 18 Q16.5 16.5 12 18.3 Q7.5 16.5 3.5 18 Z"/>
          <path d="M12 5.8 L12 18.3"/>
          <path d="M6 8.5 Q8 7.8 10 8.6"/>
          <path d="M14 8.6 Q16 7.8 18 8.5"/>
          <path d="M6 12 Q8 11.3 10 12.1"/>
          <path d="M14 12.1 Q16 11.3 18 12"/>
        </svg>

    </div>

    <!-- ============ ROGERS TILE TOOLTIPS ============
         The title="…" text on each tile is the hover tooltip — plain

    <div class="tiles">
      <a class="tile has-icon" href="tilt-snake.html" title="Collect the multiples in order." data-demo="tilt-snake.html?demo=1" data-hold="25000">

        </div>

      </a>

        <div class="head"><img class="icon" src="icons/search-tables.svg" alt="">

  <!-- ============ ROGERS FOOTER TEXT — edit freely; it ripples ============ -->
  <footer>
    Dive in you'll soon pick it up!<br>

  </footer>
  <!-- ============ END OF ROGERS FOOTER TEXT ============ -->

  <div id="tip"></div>

  <script>
    /* tile tooltips: the editable text lives in each tile's title="…"
       attribute (marked region above); here it's moved to data-tip so
       the native tooltip never doubles ours. Hover (mouse) or
       press-and-hold (touch) shows it after TIP_DELAY ms; a held touch
       that showed the tip doesn't navigate on release. */
    const TIP_DELAY = 450;
    const tipEl = document.getElementById('tip');
    let tipTimer = 0, tipShown = false, tipFromTouch = false;

    document.querySelectorAll('.tile[title]').forEach(t => {
      t.dataset.tip = t.getAttribute('title');
      t.removeAttribute('title');
    });

    function showTip(t, fromTouch) {
      tipEl.textContent = t.dataset.tip;
      tipEl.style.left = '0px';
      tipEl.style.opacity = '1';
      const r = t.getBoundingClientRect();
      const tw = tipEl.offsetWidth, th = tipEl.offsetHeight;
      let x = Math.min(Math.max(r.left + r.width / 2 - tw / 2, 8), innerWidth - tw - 8);
      let y = r.top - th - 8;
      if (y < 8) y = r.bottom + 8;
      tipEl.style.left = x + 'px';
      tipEl.style.top = y + 'px';
      tipShown = true;
      tipFromTouch = fromTouch;
    }

    function hideTip() {
      clearTimeout(tipTimer);
      tipEl.style.opacity = '0';
      tipShown = false;
    }

    document.querySelectorAll('.tile[data-tip]').forEach(t => {
      t.addEventListener('pointerenter', (e) => {
        tipTimer = setTimeout(() => showTip(t, e.pointerType !== 'mouse'), TIP_DELAY);
      });
      t.addEventListener('pointerleave', hideTip);
      t.addEventListener('pointercancel', hideTip);
      t.addEventListener('contextmenu', (e) => e.preventDefault());
      t.addEventListener('click', (e) => {
        if (tipShown && tipFromTouch) { e.preventDefault(); hideTip(); }
      });
    });
    window.addEventListener('scroll', hideTip, { passive: true });

    /* footer ripple: wrap each letter in a span so the CSS wave can
       reach it; the footer text itself stays plain in the HTML above */
    (function () {
      const foot = document.querySelector('footer');
      foot.setAttribute('aria-label', foot.textContent.trim());
      let i = 0;
      const walk = (node) => {
        [...node.childNodes].forEach(n => {
          if (n.nodeType === Node.ELEMENT_NODE) { walk(n); return; }
          if (n.nodeType !== Node.TEXT_NODE || !n.textContent.trim()) return;
          const frag = document.createDocumentFragment();
          for (const ch of n.textContent.trim()) {
            if (ch === ' ') { frag.append(' '); i++; continue; }
            const s = document.createElement('span');
            s.className = 'rl';
            s.setAttribute('aria-hidden', 'true');
            s.style.setProperty('--i', i++);
            s.textContent = ch;
            frag.append(s);
          }
          n.replaceWith(frag);
        });
      };
      walk(foot);
    })();
  </script>

  <!-- ============ ROGERS VEIL TEXT — edit freely ============ -->
  <div id="veil">
    <div>
      <div class="vh">Any Number of Times</div>
    </div>
  </div>
  <!-- ============ END OF VEIL TEXT ============ -->

  <script>
    /* the veil: a short introduction that fades on touch or after a
       few seconds; remembered per device so it never nags */
    (function () {
      const veil = document.getElementById('veil');
      try {
        if (localStorage.getItem('nf_veil')) { veil.remove(); return; }
        localStorage.setItem('nf_veil', '1');
      } catch (e) { /* private mode: show it anyway, every time */ }
      const drop = () => {
        veil.classList.add('gone');
        setTimeout(() => veil.remove(), 1000);
      };
      veil.addEventListener('pointerdown', drop);
      setTimeout(drop, 3200);
    })();

    /* the spotlight: one tile at a time plays its demo in a little
       screen; the iframe is created on arrival and removed on
       departure, so only one game ever animates (Roger: several at
       once would confuse). Tiles opt in with data-demo="<url>". */
    (function () {
      const SPOT_HOLD = 6000;   // ms a tile keeps the light unless
                                // its data-hold says longer — slow-burn
                                // demos get time to land (Roger: puzzle
                                // & patterns felt interrupted)
      /* fill each stage with its tile's ghosted icon — independent of
         whether any tile can demo */
      document.querySelectorAll('.tile .stage').forEach(sc => {
        const icon = sc.parentElement.querySelector('.head .icon');
        if (icon) {
          const g = icon.cloneNode();
          g.classList.add('ghost');
          sc.appendChild(g);
        }
      });

      const tiles = [...document.querySelectorAll('.tile[data-demo]')];
      if (!tiles.length || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      let idx = -1, timer = 0;

      function light(i) {
        document.querySelectorAll('.tile.lit').forEach(t => {
          t.classList.remove('lit');
          const fr = t.querySelector('.stage iframe');
          if (fr) {
            fr.classList.remove('on');
            fr.classList.add('gone');
            setTimeout(() => fr.remove(), 850);
          }
        });
        const t = tiles[i];
        if (!t) return;
        t.classList.add('lit');
        const fr = document.createElement('iframe');
        fr.src = t.dataset.demo;
        fr.setAttribute('tabindex', '-1');
        fr.setAttribute('aria-hidden', 'true');
        t.querySelector('.stage').appendChild(fr);
        requestAnimationFrame(() =>
          requestAnimationFrame(() => fr.classList.add('on')));
      }

      function cycle() {
        if (!document.hidden) {
          idx = (idx + 1) % tiles.length;
          light(idx);
        }
        timer = setTimeout(cycle,
          idx >= 0 && tiles[idx].dataset.hold
            ? +tiles[idx].dataset.hold : SPOT_HOLD);
      }
      setTimeout(cycle, 4000);   // the page — and the veil — settle first
    })();
  </script>

  <!-- nav.js deliberately absent here: the page is the menu, so the
       snake menu would only duplicate it (Roger, 2026-11-17) -->
</body>

</html>
