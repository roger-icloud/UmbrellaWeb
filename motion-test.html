<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion test</title>
<style>body{background:#101418;color:#cfd8e0;font:16px -apple-system,sans-serif;padding:24px}
b{color:#35c795}button{font-size:18px;padding:12px 20px;margin:12px 0}</style>
</head><body>
<h2>Motion test</h2>
<div id="r"></div>
<button id="b">Ask for motion permission</button>
<div id="s" style="margin-top:16px"></div>
<script>
const R=document.getElementById('r'),S=document.getElementById('s');
let l=[];
function say(m){l.push(m);R.innerHTML=l.join('<br>');}
say('secure context (https): <b>'+window.isSecureContext+'</b>');
say('DeviceMotionEvent exists: <b>'+(typeof DeviceMotionEvent!=='undefined')+'</b>');
say('requestPermission exists: <b>'+(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function')+'</b>');
say('userAgent: '+navigator.userAgent);
document.getElementById('b').onclick=async()=>{
  try{
    if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){
      const r=await DeviceMotionEvent.requestPermission();
      say('requestPermission → <b>'+r+'</b>');
    }else say('no requestPermission API on this page');
  }catch(e){say('requestPermission threw: '+e.message);}
};
let n=0;
window.addEventListener('devicemotion',e=>{
  const g=e.accelerationIncludingGravity;
  n++;
  S.innerHTML='motion events received: <b>'+n+'</b><br>'+
    (g?('x='+g.x.toFixed(2)+' y='+g.y.toFixed(2)+' z='+g.z.toFixed(2)):'no gravity data');
});
</script></body></html>
