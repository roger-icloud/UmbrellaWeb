<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Patterns — Umbrella</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #101418;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      font-family: -apple-system, system-ui, sans-serif;
    }

    canvas {
      display: block;
      position: fixed;
      inset: 0;
    }

    #hud {
      position: fixed;
      top: calc(env(safe-area-inset-top, 8px) + 52px);
      left: 8px;
      color: #7f9bb0;
      font-size: 12px;
      line-height: 1.5;
      background: rgba(10, 14, 18, .55);
      padding: 8px 10px;
      border-radius: 8px;
      pointer-events: none;
      white-space: pre;
    }

    #chipRow {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      padding: 0 12px;
      z-index: 5;
    }

    #chipRow button {
      min-width: 44px;
      height: 44px;
      font-size: 15px;
      font-family: inherit;
      border-radius: 10px;
      border: 1px solid #3a4a58;
      background: rgba(30, 42, 54, .9);
      color: #cfd8e0;
    }

    #chipRow button.on {
      border-color: #4da3ff;
      color: #fff;
      background: rgba(40, 64, 88, .95);
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: rgba(10, 14, 18, .88);
      color: #cfd8e0;
      z-index: 10;
      text-align: center;
      padding: 24px;
    }

    .overlay .title {
      font-size: 22px;
    }

    .overlay .sub {
      font-size: 13px;
      color: #8a97a3;
      margin-top: 14px;
      max-width: 340px;
    }

    .overlay button.go {
      font-size: 20px;
      padding: 16px 32px;
      border-radius: 14px;
      border: none;
      background: #4da3ff;
      color: #fff;
      margin-top: 16px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

  <canvas id="c"></canvas>
  <div id="hud"></div>
  <div id="chipRow"></div>

  <div id="doneOverlay" class="overlay hidden">
    <div class="title" id="doneTitle">Complete!</div>
    <div class="sub" id="doneStats"></div>
    <button class="go" id="again">Another table</button>
  </div>

  <script>
    'use strict';

    /* ---------- tunables ---------- */
    const BOARD_PAD = 16;    // css px clear space around the board
    const TOP_RESERVE = 92;   // room for HUD text + status
    const BOT_RESERVE = 116;  // room for the table chips
    const CELL_GAP = 1.5;    // css px grid-line gap between cells
    const FLASH_SECS = 0.6;   // refusal flash duration
    const NUM_FONT = 0.38;   // cell numeral size as a fraction of cell
    const DEBUG_GRID = true;  // draw touch-resolution boundaries over cells

    /* ---------- canvas ---------- */
    const cv = document.getElementById('c');
    const ctx = cv.getContext('2d');
    let W = 0, H = 0, DPR = 1;
    // board geometry in css px — the grid is fixed-structure, so unlike
    // the snake it does NOT live in virtual resolution; it fills the
    // space and the input layer adapts (nearest-cell tap resolution)
    let bX = 0, bY = 0, bS = 0, cell = 0;

    function resize() {
      DPR = Math.min(window.devicePixelRatio || 1, 3);
      W = window.innerWidth; H = window.innerHeight;
      cv.width = W * DPR; cv.height = H * DPR;
      cv.style.width = W + 'px'; cv.style.height = H + 'px';
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      const availW = W - 2 * BOARD_PAD;
      const availH = H - TOP_RESERVE - BOT_RESERVE - BOARD_PAD;
      bS = Math.min(availW, availH);
      cell = bS / 10;
      bX = (W - bS) / 2;
      bY = TOP_RESERVE + (availH - bS) / 2;
    }
    window.addEventListener('resize', resize);
    resize();

    /* ---------- state ---------- */
    let table = 0;
    let found = new Set();       // values found (of table's 12 multiples)
    let flashCell = -1, flashUntil = 0;
    let state = 'idle';          // idle | play | done
    let startT = 0, doneMs = 0;

    const events = [];
    const sid = Math.random().toString(36).slice(2, 10);
    function logEvent(type, data) {
      events.push({ t: Math.round(performance.now()), sid, type, ...data });
    }

    function tableColour(t) { return 'hsl(' + ((t * 31 + 200) % 360) + ',60%,45%)'; }

    function reset(t) {
      table = t;
      found = new Set();
      flashCell = -1;
      state = 'play';
      startT = performance.now();
      logEvent('start', { table: t });
    }

    /* ---------- table chips ---------- */
    const chips = document.getElementById('chipRow');
    for (let t = 2; t <= 12; t++) {
      const b = document.createElement('button');
      b.textContent = '×' + t;
      b.dataset.t = t;
      b.addEventListener('click', () => {
        [...chips.children].forEach(c => c.classList.remove('on'));
        b.classList.add('on');
        reset(t);
      });
      chips.appendChild(b);
    }

    /* ---------- tap → nearest cell ----------
       Cells are drawn at whatever size the screen affords — on a phone
       that can be ~33px, below the 44pt guideline. The guideline exists
       for sparse buttons; this is a tiled surface, so a tap resolves to
       the cell whose centre is nearest and that cell flashes/fills —
       the child always sees which cell their tap chose. */
    cv.addEventListener('pointerdown', (t) => {
      if (state !== 'play') return;
      const gx = (t.clientX - bX) / cell;
      const gy = (t.clientY - bY) / cell;
      // nearest-centre on a uniform grid is just floor: cell c spans
      // [c, c+1) in grid coords, centre at c+0.5. Off-board taps clamp
      // to the edge row/column (the forgiveness half of the scheme).
      const col = Math.min(9, Math.max(0, Math.floor(gx)));
      const row = Math.min(9, Math.max(0, Math.floor(gy)));
      // taps clearly off the board still count (centroid forgiveness)
      const v = row * 10 + col + 1;

      // membership is the table's FIRST TWELVE multiples (t…12t), not
      // every multiple on the square — 2,6,18…98 is not the 2× lesson
      const member = v % table === 0 && v <= table * 12;
      if (member && !found.has(v)) {
        found.add(v);
        logEvent('collect', { v, ord: found.size });
        if (found.size === 12) {
          doneMs = performance.now() - startT;
          state = 'done';
          logEvent('complete', { table, ms: Math.round(doneMs) });
          document.getElementById('doneTitle').textContent = '×' + table + ' found!';
          document.getElementById('doneStats').textContent =
            'All twelve multiples in ' + (doneMs / 1000).toFixed(0) + 's';
          document.getElementById('doneOverlay').classList.remove('hidden');
        }
      } else if (!member) {
        flashCell = v;
        flashUntil = performance.now() + FLASH_SECS * 1000;
        logEvent('refuse', { v, table });
      }
    });
    cv.addEventListener('touchmove', (t) => t.preventDefault(), { passive: false });

    document.getElementById('again').addEventListener('click', () => {
      document.getElementById('doneOverlay').classList.add('hidden');
      state = 'idle';
      table = 0;
      found = new Set();
      [...chips.children].forEach(c => c.classList.remove('on'));
    });

    /* ---------- draw ---------- */
    const hud = document.getElementById('hud');

    function draw() {
      ctx.clearRect(0, 0, W, H);
      const now = performance.now();

      for (let r = 0; r < 10; r++) {
        for (let c = 0; c < 10; c++) {
          const v = r * 10 + c + 1;
          const x = bX + c * cell;
          const y = bY + r * cell;
          const isFound = found.has(v);
          const isFlash = v === flashCell && now < flashUntil;

          ctx.fillStyle = isFound ? tableColour(table)
            : isFlash ? '#5a4a28' : '#1a2430';
          ctx.fillRect(x + CELL_GAP / 2, y + CELL_GAP / 2,
            cell - CELL_GAP, cell - CELL_GAP);
          if (isFlash) {
            ctx.strokeStyle = '#e0a53a';
            ctx.lineWidth = 2;
            ctx.strokeRect(x + CELL_GAP / 2, y + CELL_GAP / 2,
              cell - CELL_GAP, cell - CELL_GAP);
          }

          ctx.fillStyle = isFound ? '#fff' : (isFlash ? '#e0a53a' : '#8a97a3');
          ctx.font = Math.round(cell * NUM_FONT) + 'px -apple-system, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(v, x + cell / 2, y + cell / 2 + 1);
        }
      }

      // debug: show the actual tap-resolution boundaries (they coincide
      // with the drawn cells — every in-board point resolves to the cell
      // it lands in; outside the board they run on to the edges)
      if (DEBUG_GRID) {
        ctx.strokeStyle = 'rgba(255,255,255,0.18)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let i = 0; i <= 10; i++) {
          ctx.moveTo(bX + i * cell, bY);
          ctx.lineTo(bX + i * cell, bY + bS);
          ctx.moveTo(bX, bY + i * cell);
          ctx.lineTo(bX + bS, bY + i * cell);
        }
        ctx.stroke();
        // dots at the centres — the points taps resolve toward
        ctx.fillStyle = 'rgba(255,255,255,0.28)';
        for (let r = 0; r < 10; r++)
          for (let c = 0; c < 10; c++) {
            ctx.beginPath();
            ctx.arc(bX + (c + 0.5) * cell, bY + (r + 0.5) * cell, 1.5, 0, Math.PI * 2);
            ctx.fill();
          }
      }

      if (state === 'play') {
        hud.textContent = '×' + table + '   ' + found.size + '/12'
          + '\ncell ' + Math.round(cell) + 'px' +
          (cell < 44 ? '  (below 44pt — centroid taps active)' : '');
      } else if (state === 'idle') {
        hud.textContent = 'pick a table below,\nthen tap its multiples on the square' +
          '\n\ncell ' + Math.round(cell) + 'px';
      } else {
        hud.textContent = '';
      }
    }

    function frame() {
      draw();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>

  <script src="nav.js?v=3"></script>
</body>

</html>
