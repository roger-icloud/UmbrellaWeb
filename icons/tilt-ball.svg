        stroke="#eef3f9" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="33" cy="26" r="11" fill="#eef3f9"/>
  <text x="33" y="30.5" text-anchor="middle"
        font-family="system-ui, sans-serif" font-size="12"
        font-weight="700" fill="#101418">12</text>
