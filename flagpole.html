<!DOCTYPE html>
<html lang="en">

<head>
  <script src="gate.js?v=1"></script>
  <meta charset="utf-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#101418">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>Flagpole — Any Number of Times</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #101418;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    canvas {
      position: fixed;
      inset: 0;
      display: block;
    }
  </style>
  <link rel="preload" href="fonts/andika-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/andika-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts/andika.css">
  <meta name="description" content="Build the machine that raises the flag — cord, pulleys, windmill and fans.">
</head>

<body>
  <canvas id="c"></canvas>
  <script>
    'use strict';
    /* flagpole — an evening experiment (Roger 2026-11-19): a flagpole,
       two pulleys, a loop of cord, a flag, a windmill and two fans.
       Drag each part onto its glowing anchor; when the machine is
       whole the lower fan turns the windmill, the windmill drives
       the cord, the flag climbs — and the top fan makes it flutter.
       Parts carry no numbers here; the play IS the point. */

    /* ---------- tunables ---------- */
    const POLE_X = 0.62;       // pole across the screen
    const POLE_TOP = 0.12;     // top pulley height (fraction of H)
    const POLE_BOT = 0.80;     // lower pulley height
    const GROUND = 0.92;
    const PULLEY_R = 16;       // pulley radius, css px
    const CORD_OFF = 0.035;    // cord loop half-width (fraction of W)
    const FLAG_W = 104, FLAG_H = 68;
    const RISE_SECS = 7;       // flag's climb once driven
    const TRAY_H = 96;         // parts shelf at the bottom
    const SNAP_R = 56;         // anchor acceptance radius
    const REFUSE_R = 40;       // near-enough-to-mean-it radius
    const WIND_SPINS = 2.2;    // windmill turns while the flag climbs
    const HOIST_SPIN = 2.6;    // rad/s windmill turns when blown
    const FLUTTER = 11;        // flag wave amplitude at the top fan
    const ANCHOR_PULSE = 1.6;  // s per anchor glow cycle
    const RETURN_MS = 600;     // a rejected part glides home

    const cv = document.getElementById('c');
    const ctx = cv.getContext('2d');
    let W = 0, H = 0, DPR = 1;

    function resize() {
      const vv = window.visualViewport;
      W = vv ? vv.width : window.innerWidth;
      H = vv ? vv.height : window.innerHeight;
      if (W < 50 || H < 50) return;
      DPR = Math.min(window.devicePixelRatio || 1, 3);
      cv.width = W * DPR; cv.height = H * DPR;
      cv.style.width = W + 'px'; cv.style.height = H + 'px';
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      layout();
    }
    window.addEventListener('resize', resize);
    if (window.visualViewport)
      window.visualViewport.addEventListener('resize', resize);

    /* ---------- geometry ---------- */
    let px = 0, pTop = 0, pBot = 0, gy = 0, cordX = 0;
    const parts = {};          // id -> {x,y,placed,retT,retFrom}
    const ORDER = ['cord', 'flag', 'windmill', 'fanHoist', 'fanTop'];
    const LABEL = {
      cord: 'cord', flag: 'flag', windmill: 'windmill',
      fanHoist: 'fan', fanTop: 'fan'
    };

    /* anchors: where each part belongs (recomputed on layout) */
    function anchors() {
      return {
        cord: { x: px, y: pBot },                    // the lower pulley
        flag: { x: cordX, y: (pTop + pBot) / 2 },    // the rising run
        windmill: { x: px, y: pBot },
        fanHoist: { x: px - W * 0.20, y: gy - 46 },  // blows at the mill
        fanTop: { x: px + W * 0.19, y: pTop + 10 },  // blows at the flag
      };
    }
    /* a part's anchor only exists once what it hangs on is placed */
    function anchorReady(id) {
      if (id === 'flag') return !!parts.cord.placed;
      return true;
    }
    function anchorOf(id) {
      const a = anchors();
      if (id === 'cord') return a.cord;
      if (id === 'flag') return a.flag;
      if (id === 'windmill') return a.windmill;
      if (id === 'fanHoist') return a.fanHoist;
      return a.fanTop;
    }

    function layout() {
      px = W * POLE_X;
      pTop = H * POLE_TOP;
      pBot = H * POLE_BOT;
      gy = H * GROUND;
      cordX = px - W * CORD_OFF;
      /* tray slots, five parts left to right */
      const n = ORDER.length, gap = Math.min(120, (W - 60) / n);
      ORDER.forEach((id, i) => {
        const p = parts[id];
        p.home = { x: W / 2 + (i - (n - 1) / 2) * gap, y: H - TRAY_H / 2 };
        if (!p.placed && !p.dragging) {
          p.x = p.retT ? p.x : p.home.x;
          p.y = p.retT ? p.y : p.home.y;
        }
      });
    }

    ORDER.forEach(id => parts[id] = {
      x: 0, y: 0, placed: false, dragging: false, retT: 0, retFrom: null,
      on: true, spin: 0    // fans carry a switch and a blade angle
    });

    /* ---------- machine state ---------- */
    let loopK = null;         // 0..1 the flag's place on the halyard loop
    let markK = 0;            // 0..1 the mark's fade-in at the summit
    let millA = 0;            // windmill angle
    let touchX = 0;
    let flutterT = 0;
    let diagDone = false;
    const Q = new URLSearchParams(location.search);
    const running = () =>
      parts.cord.placed && parts.windmill.placed && parts.fanHoist.placed;

    /* ---------- input ---------- */
    let drag = null, touch = false;
    function pt(e) {
      const r = cv.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    }
    cv.addEventListener('pointerdown', e => {
      const p = pt(e);
      /* a placed fan IS its switch — tap to toggle the wind */
      for (const fid of ['fanHoist', 'fanTop']) {
        const s = parts[fid];
        if (!s.placed) continue;
        const a = anchorOf(fid);
        if (Math.hypot(p.x - a.x, p.y - a.y) < 42) { s.on = !s.on; return; }
      }
      for (const id of ORDER.slice().reverse()) {
        const s = parts[id];
        if (s.placed || Math.hypot(p.x - s.x, p.y - s.y) > 34) continue;
        drag = id; s.dragging = true; s.retT = 0;
        touch = e.pointerType === 'touch';
        cv.setPointerCapture(e.pointerId);
        e.preventDefault();
        return;
      }
    });
    cv.addEventListener('pointermove', e => {
      if (!drag) return;
      const p = pt(e), s = parts[drag];
      s.x = p.x;
      s.y = p.y - (touch ? 40 : 0);
    });
    cv.addEventListener('pointerup', e => {
      if (!drag) return;
      const s = parts[drag], id = drag;
      drag = null; s.dragging = false;
      const p = pt(e), dy = p.y - (touch ? 40 : 0);
      touch = false;
      const a = anchorOf(id), ready = anchorReady(id);
      const d = Math.hypot(p.x - a.x, dy - a.y);
      if (ready && d < SNAP_R) {
        s.placed = true; s.x = a.x; s.y = a.y;
        /* the flag joins the halyard where it was hung */
        if (id === 'flag') loopK = (pBot - a.y) / loopLen();
        return;
      }
      /* a near miss on a foreign anchor earns the amber refusal;
         a drop in space just goes home */
      for (const oid of ORDER) {
        if (oid === id || !anchorReady(oid)) continue;
        const o = anchorOf(oid);
        if (Math.hypot(p.x - o.x, dy - o.y) < REFUSE_R) {
          s.flash = performance.now();
          break;
        }
      }
      s.retT = performance.now(); s.retFrom = { x: s.x, y: s.y };
    });
    cv.addEventListener('pointercancel', () => {
      if (!drag) return;
      const s = parts[drag];
      drag = null; s.dragging = false;
      s.retT = performance.now(); s.retFrom = { x: s.x, y: s.y };
    });

    /* ---------- pieces ---------- */
    function drawPulley(x, y, spin) {
      ctx.save(); ctx.translate(x, y);
      ctx.beginPath(); ctx.arc(0, 0, PULLEY_R, 0, 7);
      ctx.fillStyle = '#22303c'; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = '#4a5f70'; ctx.stroke();
      /* spokes show the turn */
      ctx.save(); ctx.rotate(spin);
      ctx.beginPath();
      for (let i = 0; i < 3; i++) {
        ctx.moveTo(0, 0); ctx.lineTo(PULLEY_R - 4, 0);
        ctx.rotate(Math.PI * 2 / 3);
      }
      ctx.strokeStyle = '#6c8192'; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.restore();
      ctx.beginPath(); ctx.arc(0, 0, 4, 0, 7);
      ctx.fillStyle = '#e0a53a'; ctx.fill();
      ctx.restore();
    }

    function drawCord(tension) {
      /* a thin loop: down one side of both pulleys and back up the
         other — the left run is the flag's rising side */
      const r = W * CORD_OFF;
      ctx.beginPath();
      ctx.moveTo(px - r, pTop);
      ctx.arc(px, pTop, r, Math.PI, 0, false);
      ctx.moveTo(px + r, pTop);
      ctx.lineTo(px + r, pBot);
      ctx.arc(px, pBot, r, 0, Math.PI, false);
      ctx.moveTo(px - r, pBot);
      ctx.lineTo(px - r, pTop);
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#c9b48a';
      ctx.stroke();
    }

    function drawWindmill(x, y, a, scale) {
      ctx.save(); ctx.translate(x, y); ctx.scale(scale || 1, scale || 1);
      ctx.rotate(a);
      ctx.beginPath();
      for (let i = 0; i < 4; i++) {
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(16, -12, 30, -6);
        ctx.quadraticCurveTo(16, 0, 0, 0);
        ctx.rotate(Math.PI / 2);
      }
      ctx.fillStyle = '#7fb2a5'; ctx.fill();
      ctx.beginPath(); ctx.arc(0, 0, 5, 0, 7);
      ctx.fillStyle = '#e0a53a'; ctx.fill();
      ctx.restore();
    }

    function drawFan(x, y, a, aimRight, on) {
      ctx.save(); ctx.translate(x, y);
      ctx.globalAlpha = on === false ? 0.45 : 1;   // switched off greys
      /* stand */
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(0, 26);
      ctx.moveTo(-14, 26); ctx.lineTo(14, 26);
      ctx.strokeStyle = '#4a5f70'; ctx.lineWidth = 3; ctx.stroke();
      /* the switch: a little rail on the stand, knob right+amber = on */
      ctx.globalAlpha = 1;
      ctx.beginPath(); ctx.moveTo(-7, 15); ctx.lineTo(7, 15);
      ctx.strokeStyle = '#4a5f70'; ctx.lineWidth = 2; ctx.stroke();
      ctx.beginPath(); ctx.arc(on === false ? -4 : 4, 15, 4, 0, 7);
      ctx.fillStyle = on === false ? '#4a5f70' : '#e0a53a'; ctx.fill();
      ctx.globalAlpha = on === false ? 0.45 : 1;
      ctx.save(); ctx.scale(aimRight ? 1 : -1, 1);
      ctx.beginPath(); ctx.arc(0, -8, 17, 0, 7);
      ctx.fillStyle = '#22303c'; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = '#4a5f70'; ctx.stroke();
      ctx.save(); ctx.translate(0, -8); ctx.rotate(a);
      ctx.beginPath();
      for (let i = 0; i < 3; i++) {
        ctx.ellipse(6, 0, 8, 4, 0.5, 0, 7);
        ctx.rotate(Math.PI * 2 / 3);
      }
      ctx.fillStyle = '#8fa8b8'; ctx.fill();
      ctx.restore();
      ctx.restore();
      ctx.restore();
    }

    function drawWind(x0, y0, x1, y1, on, now) {
      if (!on) return;
      /* little streaks of air, flowing */
      ctx.save();
      const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy);
      const ux = dx / L, uy = dy / L, n = Math.floor(L / 26);
      ctx.strokeStyle = 'rgba(140,180,200,.30)';
      ctx.lineWidth = 1.5;
      for (let i = 0; i < n; i++) {
        const k = ((i / n) + now / 1400) % 1;
        const bx = x0 + dx * k, by = y0 + dy * k;
        ctx.beginPath();
        ctx.moveTo(bx - ux * 9, by - uy * 9);
        ctx.quadraticCurveTo(bx, by - 4, bx + ux * 9, by + uy * 9);
        ctx.stroke();
      }
      ctx.restore();
    }

    /* a real halyard is a loop: the flag rides up the left run, over
       the top pulley, down the right run, under the bottom — so it
       can only stop where the drive stops (Roger 2026-11-26: the fan
       needs a switch, else the flag goes round and round) */
    const loopLen = () => 2 * (pBot - pTop) + 2 * Math.PI * W * CORD_OFF;
    function flagPos() {
      const r = W * CORD_OFF, rl = pBot - pTop, al = Math.PI * r;
      let s = ((loopK === null ? 0 : loopK) % 1 + 1) % 1 * loopLen();
      if (s < rl) return { x: px - r, y: pBot - s, run: 'up' };
      s -= rl;
      if (s < al) {
        const a = Math.PI * (1 - s / al);
        return { x: px + r * Math.cos(a), y: pTop - r * Math.sin(a), run: 'top' };
      }
      s -= al;
      if (s < rl) return { x: px + r, y: pTop + s, run: 'down' };
      s -= rl;
      const a = Math.PI * s / al;
      return { x: px - r * Math.cos(a), y: pBot + r * Math.sin(a), run: 'bot' };
    }
    /* the pennant: a triangle, hoist edge at the cord. The cloth is
       baked once (transparent outside the point), then drawn each frame
       in vertical strips, every strip displaced by a wave that travels
       outward and grows toward the tip. The table's numeral rides its
       own transparent cloth so it can fade up on its own — same
       decal-mapping idea as tilt-ball's rolling numerals */
    const FLAG_T = parseInt(Q.get('t') || '10', 10);
    const FLAG_HUE = (FLAG_T * 31 + 200) % 360;   // pennant takes the table's colour
    let flagTex = null, markTex = null;
    function flagTextures() {
      if (flagTex) return;
      const S = 2;                                // supersample, crisp edges
      flagTex = document.createElement('canvas');
      flagTex.width = FLAG_W * S; flagTex.height = FLAG_H * S;
      const c2 = flagTex.getContext('2d'); c2.scale(S, S);
      c2.beginPath();
      c2.moveTo(FLAG_W - 1, 1); c2.lineTo(FLAG_W - 1, FLAG_H - 1);
      c2.lineTo(1, FLAG_H / 2); c2.closePath();
      const g = c2.createLinearGradient(FLAG_W, 0, 0, 0);
      g.addColorStop(0, 'hsl(' + FLAG_HUE + ',62%,56%)');
      g.addColorStop(1, 'hsl(' + FLAG_HUE + ',55%,38%)');
      c2.fillStyle = g; c2.fill();
      c2.lineWidth = 1.5; c2.strokeStyle = 'hsl(' + FLAG_HUE + ',50%,30%)';
      c2.stroke();
      markTex = document.createElement('canvas');
      markTex.width = FLAG_W * S; markTex.height = FLAG_H * S;
      const c3 = markTex.getContext('2d'); c3.scale(S, S);
      c3.fillStyle = '#fff';
      c3.font = '700 ' + Math.round(FLAG_H * 0.5) +
        'px Andika, -apple-system, sans-serif';
      c3.textAlign = 'center'; c3.textBaseline = 'middle';
      c3.fillText(String(FLAG_T), FLAG_W * 0.72, FLAG_H * 0.5 + 1);
    }

    function drawFlag(x, y, now) {
      /* clipped to the cord, streaming LEFT — away from the top fan
         (Roger: flags blow away from the fan, not into it) */
      const powered = parts.fanTop.placed && parts.fanTop.on;
      const amp = powered ? FLUTTER : 2;
      const ph0 = powered ? now / 150 : now / 900;
      flagTextures();
      const N = 18, sw = FLAG_W / N, S = flagTex.width / FLAG_W;
      ctx.save(); ctx.translate(x, y - FLAG_H / 2);
      for (let i = 0; i < N; i++) {
        const t = (i + 0.5) * sw;               // strip centre; x=0 fly … FLAG_W hoist
        const g = 1 - t / FLAG_W;               // 0 at hoist → 1 at fly
        const ph = ph0 - (FLAG_W - t) * 0.055;
        const dy = Math.sin(ph) * amp * g * g;  // hoist stays pinned
        ctx.drawImage(flagTex, i * sw * S, 0, sw * S, FLAG_H * S,
          i * sw - FLAG_W, dy, sw, FLAG_H);
        if (markK > 0) {
          ctx.globalAlpha = markK;
          ctx.drawImage(markTex, i * sw * S, 0, sw * S, FLAG_H * S,
            i * sw - FLAG_W, dy, sw, FLAG_H);
          ctx.globalAlpha = 1;
        }
        /* fold shading from the wave's slope, clipped to the pennant's
           taper so it can't spill off the cloth */
        const h = FLAG_H * t / FLAG_W;
        const sh = Math.cos(ph) * g * 0.20;
        if (sh > 0.006) {
          ctx.fillStyle = 'rgba(255,255,255,' + sh.toFixed(3) + ')';
          ctx.fillRect(i * sw - FLAG_W, dy + (FLAG_H - h) / 2 - 2, sw, h + 4);
        } else if (sh < -0.006) {
          ctx.fillStyle = 'rgba(0,0,0,' + (-sh).toFixed(3) + ')';
          ctx.fillRect(i * sw - FLAG_W, dy + (FLAG_H - h) / 2 - 2, sw, h + 4);
        }
      }
      ctx.restore();
    }

    /* part glyphs for the tray */
    function drawPart(id, x, y, scale, now) {
      ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
      if (id === 'cord') {
        ctx.beginPath(); ctx.ellipse(0, 0, 14, 24, 0, 0, 7);
        ctx.lineWidth = 3; ctx.strokeStyle = '#c9b48a'; ctx.stroke();
      } else if (id === 'flag') {
        ctx.beginPath();
        ctx.moveTo(8, -18); ctx.lineTo(8, 18);
        ctx.strokeStyle = '#8a97a3'; ctx.lineWidth = 3; ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(8, -18); ctx.lineTo(8, -4); ctx.lineTo(-18, -11);
        ctx.closePath();
        ctx.fillStyle = 'hsl(' + FLAG_HUE + ',60%,50%)'; ctx.fill();
      } else if (id === 'windmill') {
        drawWindmill(0, 0, now / 900, 0.9);
      } else {
        drawFan(0, -14, now / 300, true);
      }
      ctx.restore();
    }

    function drawAnchor(id, now) {
      if (!anchorReady(id) || parts[id].placed) return;
      const a = anchorOf(id);
      const p = 0.5 + 0.5 * Math.sin(now / 1000 * Math.PI * 2 / ANCHOR_PULSE);
      /* anchors glow brighter while their part is being carried */
      const carrying = drag === id;
      const a2 = (carrying ? 0.55 : 0.18) + 0.25 * p;
      ctx.beginPath();
      ctx.arc(a.x, a.y, SNAP_R * (carrying ? 1 : 0.7), 0, 7);
      ctx.strokeStyle = 'rgba(53,199,149,' + a2 + ')';
      ctx.lineWidth = carrying ? 2.5 : 1.5;
      ctx.setLineDash([6, 7]);
      ctx.stroke(); ctx.setLineDash([]);
    }

    /* ---------- frame ---------- */
    let last = 0;
    function draw(now) {
      const dt = Math.min(0.05, (now - last) / 1000 || 0); last = now;
      ctx.clearRect(0, 0, W, H);

      /* ?flag — diagnostic: machine pre-built, flag parked at the top */
      if (!diagDone && Q.has('flag')) {
        ORDER.forEach(id => parts[id].placed = true);
        parts.fanHoist.on = false;                 // parked
        loopK = (pBot - pTop) / loopLen() - 0.02;
        markK = 1; diagDone = true;
      }

      /* the running machine — fans work only while their switch is on */
      if (parts.fanHoist.placed && parts.fanHoist.on) parts.fanHoist.spin += 9 * dt;
      if (parts.fanTop.placed && parts.fanTop.on) parts.fanTop.spin += 7.2 * dt;
      if (running() && parts.fanHoist.on && parts.flag.placed && loopK !== null) {
        loopK = (loopK + (pBot - pTop) / RISE_SECS * dt / loopLen()) % 1;
        millA += HOIST_SPIN * dt;
      } else if (parts.fanHoist.placed && parts.fanHoist.on &&
                 parts.windmill.placed) {
        millA += HOIST_SPIN * dt;   // wind turns the mill, flag or no
      }
      if (parts.fanTop.placed && parts.fanTop.on) flutterT += dt;
      /* the mark fades up only once everything is assembled AND has
         worked — the flag parked at the summit, drive switched off.
         Set it moving again and the mark dims back down */
      const f0 = parts.flag.placed ? flagPos() : null;
      const parked = f0 && f0.run === 'up' && f0.y < pTop + 46 &&
        !parts.fanHoist.on;
      markK += (ORDER.every(id => parts[id].placed) && parked
        ? dt / 1.2 : -dt / 0.8);
      markK = Math.max(0, Math.min(1, markK));

      /* sky + ground */
      ctx.fillStyle = '#0d141a';
      ctx.fillRect(0, 0, W, gy);
      ctx.fillStyle = '#16211c';
      ctx.fillRect(0, gy, W, H - gy);
      ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy);
      ctx.strokeStyle = '#243528'; ctx.lineWidth = 2; ctx.stroke();

      /* the pole */
      ctx.beginPath(); ctx.moveTo(px, pTop - 26); ctx.lineTo(px, gy);
      ctx.lineWidth = 7; ctx.strokeStyle = '#5a6f80'; ctx.stroke();
      ctx.lineWidth = 2; ctx.strokeStyle = '#7a8fa0'; ctx.stroke();

      /* placed or carrying parts decide what exists */
      if (parts.cord.placed) drawCord();
      drawPulley(px, pTop, millA * 0.5);
      drawPulley(px, pBot, millA);

      /* windmill rides on the lower pulley axle */
      if (parts.windmill.placed && !parts.windmill.dragging)
        drawWindmill(px, pBot - 4, millA, 1.1);

      /* fans on their feet */
      if (parts.fanHoist.placed) {
        const a = anchorOf('fanHoist');
        drawFan(a.x, a.y, parts.fanHoist.spin, true, parts.fanHoist.on);
        drawWind(a.x + 18, a.y - 10, px - 6, pBot - 10,
          parts.fanHoist.on && parts.windmill.placed, now);
      }
      if (parts.fanTop.placed) {
        const a = anchorOf('fanTop');
        drawFan(a.x, a.y, parts.fanTop.spin, false, parts.fanTop.on);
        const f = flagPos();
        drawWind(a.x - 18, a.y - 8, f.x - FLAG_W * 0.6, f.y - 8,
          parts.fanTop.on && parts.flag.placed &&
          f.run === 'up' && f.y < pTop + 60, now);
      }

      /* the flag, if hung and hoisting */
      if (parts.flag.placed) {
        const f = flagPos();
        drawFlag(f.x, f.y, now);
      }

      /* anchors waiting */
      ORDER.forEach(id => drawAnchor(id, now));

      /* refusals flash amber on the offender */
      for (const id of ORDER) {
        const s = parts[id];
        if (s.flash && now - s.flash < 500) {
          ctx.beginPath();
          ctx.arc(s.x, s.y, 30, 0, 7);
          ctx.strokeStyle = 'rgba(224,165,58,' +
            (0.8 * (1 - (now - s.flash) / 500)) + ')';
          ctx.lineWidth = 3; ctx.stroke();
        } else s.flash = 0;
      }

      /* tray + unplaced parts */
      ctx.fillStyle = 'rgba(14,20,26,.85)';
      ctx.fillRect(0, H - TRAY_H, W, TRAY_H);
      ctx.strokeStyle = '#22303c'; ctx.beginPath();
      ctx.moveTo(0, H - TRAY_H); ctx.lineTo(W, H - TRAY_H); ctx.stroke();
      for (const id of ORDER) {
        const s = parts[id];
        if (s.placed) continue;
        if (s.retT) {
          const k = Math.min(1, (now - s.retT) / RETURN_MS);
          const e = 1 - (1 - k) * (1 - k);
          s.x = s.retFrom.x + (s.home.x - s.retFrom.x) * e;
          s.y = s.retFrom.y + (s.home.y - s.retFrom.y) * e;
          if (k >= 1) s.retT = 0;
        }
        /* a part whose anchor isn't ready sits greyed — it can't be
           hung yet, so it waits quietly rather than refusing */
        const ready = anchorReady(id);
        ctx.globalAlpha = ready ? 1 : 0.35;
        drawPart(id, s.x, s.y, s.dragging ? 1.15 : 1, now);
        ctx.globalAlpha = 1;
      }

      /* all aboard: a small proud moment — the flag settles, the
         windmill keeps time, nothing else says it */
      requestAnimationFrame(draw);
    }
    resize();
    requestAnimationFrame(draw);
  </script>

  <script src="nav.js?v=20"></script>
