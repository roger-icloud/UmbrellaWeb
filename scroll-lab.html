<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#101418">
  <title>Scroll Lab — NumberFun</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #101418;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      font-family: Andika, -apple-system, system-ui, sans-serif;
    }

    canvas {
      display: block;
      position: fixed;
      inset: 0;
    }

    #reveal {
      position: fixed;
      right: 14px;
      bottom: 14px;
      z-index: 10;
      background: rgba(20, 28, 36, .85);
      border: 1px solid #3a4a58;
      border-radius: 10px;
      color: #cfd8e0;
      font: 600 15px Andika, sans-serif;
      padding: 10px 16px;
      cursor: pointer;
    }
  </style>
  <link rel="preload" href="fonts/andika-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/andika-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts/andika.css">
</head>

<body>

  <canvas id="c"></canvas>
  <button id="reveal">Reveal the grid ▸</button>

  <script>
    'use strict';

    /* scroll-lab — the den-to-square reveal (Roger, 2026-11-07).
       Three gathered snakes wait bottom-left with lugubrious
       patience; the page pans right as if double-wide, the hundred
       square sliding into view; the snakes ride the scroll and land
       at the grid's left margin, ready to crawl on. Evaluate the
       scroll before building the crawl. */

    /* ---------- tunables ---------- */
    const SEG_D = 44;          // head size of the resting piles
    const GO_DUR = 5.5;        // s for the journey — the snake leads
    const CAM_LEAD = 0.35;     // camera keeps the head this far in from left
    const TABLES = [5, 3, 7];  // the three gathered snakes
    const CELL_NUM = true;     // show numerals on the grid
    const MARGIN = 30;         // grid inset px
    const BLINK_MIN = 2.4, BLINK_MAX = 6, BLINK_SECS = 0.28;

    const qs = new URLSearchParams(location.search);
    const cv = document.getElementById('c');
    const ctx = cv.getContext('2d');
    let W = 0, H = 0, DPR = 1;

    function resize() {
      const vv = window.visualViewport;
      W = vv ? vv.width : window.innerWidth;
      H = vv ? vv.height : window.innerHeight;
      if (W < 50 || H < 50) return;
      DPR = Math.min(window.devicePixelRatio || 1, 3);
      cv.width = W * DPR; cv.height = H * DPR;
      cv.style.width = W + 'px'; cv.style.height = H + 'px';
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }
    window.addEventListener('resize', resize);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

    const hue = t => (t * 31 + 200) % 360;
    let nextBlinkAt = 2000 + Math.random() * 2000, blinkT0 = -1;

    function blinkScale(now) {
      if (blinkT0 < 0) {
        if (now < nextBlinkAt) return 1;
        blinkT0 = now;
      }
      const k = (now - blinkT0) / 1000 / BLINK_SECS;
      if (k >= 1) {
        blinkT0 = -1;
        nextBlinkAt = now + (BLINK_MIN + Math.random() * (BLINK_MAX - BLINK_MIN)) * 1000;
        return 1;
      }
      return 1 - Math.sin(k * Math.PI) * 0.88;
    }

    /* the quiet den heap, enlarged — head out front, low mound behind,
       breathing, wandering pupils, blink (the peek-bobs read as
       darting balls; retired on Roger's call, 2026-11-07) */
    function heap(sx, sy, t, ph, now) {
      const sc = SEG_D / 15;
      const breathe = Math.sin(now / 900 + ph) * 1.2 * sc;
      ctx.beginPath();
      ctx.ellipse(sx, sy - 8 * sc + breathe * 0.5, 13 * sc, 7.5 * sc, 0, 0, 7);
      ctx.fillStyle = 'hsl(' + hue(t) + ',50%,32%)'; ctx.fill();
      ctx.strokeStyle = 'hsl(' + hue(t) + ',55%,36%)';
      ctx.lineWidth = 1; ctx.stroke();
      [[-8, -13], [1, -15], [9, -12]].forEach(([dx, dy]) => {
        ctx.beginPath();
        ctx.arc(sx + dx * sc, sy + dy * sc + breathe * 0.7, 5 * sc, 0, 7);
        ctx.fillStyle = 'hsl(' + hue(t) + ',52%,36%)'; ctx.fill();
      });
      const hx = sx + Math.sin(now / 1400 + ph) * 1.8 * sc;
      const hy = sy - 15 * sc + breathe;
      const g = ctx.createRadialGradient(
        hx - 3 * sc, hy - 3 * sc, 2 * sc, hx, hy, 8.5 * sc);
      g.addColorStop(0, 'hsl(' + hue(t) + ',62%,64%)');
      g.addColorStop(1, 'hsl(' + hue(t) + ',56%,28%)');
      ctx.beginPath(); ctx.arc(hx, hy, 8.5 * sc, 0, 7);
      ctx.fillStyle = g; ctx.fill();
      ctx.strokeStyle = 'hsl(' + hue(t) + ',58%,40%)';
      ctx.lineWidth = 1.5; ctx.stroke();
      const look = Math.sin(now / 3100 + ph * 2.1) * 2.2 * sc;
      for (const side of [-1, 1]) {
        ctx.beginPath();
        ctx.ellipse(hx + side * 3 * sc + look, hy - 0.5 * sc,
          1.4 * sc, Math.max(1.4 * sc * blinkScale(now), 0.4), 0, 0, 7);
        ctx.fillStyle = '#101418'; ctx.fill();
      }
    }

    /* ---------- the scroll (held for now) ---------- */
    let panT0 = -1;

    /* the first snake uncoils: head leaves the pile on a gentle arc to
       the top-left corner; the twelve peel off in trail order as it
       goes, so the heap visibly unspools into a full-length snake —
       then it parks there, blinking (Roger, 2026-11-07) */
    const N = 13;
    const GO_LAG = 6;          // frames each segment trails
    const s1 = { state: 'heap', hist: [], head: { x: 0, y: 0 }, t0: 0 };
    document.getElementById('reveal').addEventListener('click', () => {
      if (s1.state === 'heap') {
        s1.state = 'go';
        s1.t0 = performance.now();
        s1.head = { x: 60, y: H - 46 };
      } else {
        s1.state = 'heap'; s1.hist = [];   // back to the pile, send again
      }
    });

    /* the grid lives a page-width to the right; the snake swims from
       its pile to the grid's left margin, and the camera pans right
       following the head — like a camera tracking the actor */
    function gridGeom() {
      const cell = Math.min((W - 2 * MARGIN) / 10, (H - 2 * MARGIN) / 10);
      return { cell, gx: W + (W - cell * 10) / 2, gy: (H - cell * 10) / 2 };
    }

    function bez(k) {
      const g = gridGeom();
      const a = { x: 60, y: H - 46 };
      const b = { x: W * 0.72, y: H * 0.34 };   // sweeps up and across
      const c = { x: g.gx + g.cell / 2, y: g.gy + g.cell * 4.5 };
      const u = 1 - k;
      return {
        x: u * u * a.x + 2 * u * k * b.x + k * k * c.x,
        y: u * u * a.y + 2 * u * k * b.y + k * k * c.y
      };
    }

    function cam(now) {
      if (s1.state === 'heap') return 0;
      return Math.max(0, Math.min(W, s1.head.x - W * CAM_LEAD));
    }

    function drawSnake1(now) {
      if (s1.state === 'heap') { heap(60, H - 46, TABLES[0], 0, now); return; }
      if (s1.state === 'go') {
        const k = Math.min(1, (now - s1.t0) / 1000 / GO_DUR);
        s1.head = bez(k * k * (3 - 2 * k));
        if (k >= 1) s1.state = 'rest';
      }
      s1.hist.unshift({ x: s1.head.x, y: s1.head.y });
      if (s1.hist.length > N * GO_LAG + 2) s1.hist.length = N * GO_LAG + 2;
      const t = TABLES[0], sc = SEG_D / 15;
      for (let i = N - 1; i >= 0; i--) {
        const p = s1.hist[Math.min(i * GO_LAG, s1.hist.length - 1)];
        const r = 8.5 * sc * 0.9;
        if (i === 0) {
          const q = s1.hist[Math.min(GO_LAG, s1.hist.length - 1)] || p;
          const a = Math.atan2(p.y - q.y, p.x - q.x);
          const g = ctx.createRadialGradient(
            p.x - r * 0.33, p.y - r * 0.33, r * 0.2, p.x, p.y, r);
          g.addColorStop(0, 'hsl(' + hue(t) + ',62%,64%)');
          g.addColorStop(1, 'hsl(' + hue(t) + ',56%,28%)');
          ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 7);
          ctx.fillStyle = g; ctx.fill();
          ctx.strokeStyle = 'hsl(' + hue(t) + ',58%,40%)';
          ctx.lineWidth = 1.5; ctx.stroke();
          const ex = Math.cos(a), ey = Math.sin(a);
          const sq = blinkScale(now);
          for (const side of [-1, 1]) {
            ctx.beginPath();
            ctx.ellipse(p.x + ex * r * 0.38 - ey * side * r * 0.36,
              p.y + ey * r * 0.38 + ex * side * r * 0.36,
              r * 0.16, Math.max(r * 0.16 * sq, r * 0.03), a, 0, 7);
            ctx.fillStyle = '#101418'; ctx.fill();
          }
          continue;
        }
        ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 7);
        ctx.fillStyle = 'hsl(' + hue(t) + ',60%,45%)'; ctx.fill();
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'hsl(' + hue(t) + ',55%,36%)';
        ctx.stroke();
      }
    }

    function drawGrid(now) {
      const g = gridGeom();
      const cell = g.cell, gx = g.gx, gy = g.gy;
      ctx.font = '600 ' + cell * 0.34 + 'px Andika, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (let r = 0; r < 10; r++)
        for (let c = 0; c < 10; c++) {
          const x = gx + c * cell, y = gy + r * cell;
          ctx.beginPath();
          ctx.arc(x + cell / 2, y + cell / 2, cell * 0.44, 0, 7);
          ctx.fillStyle = '#1a2430'; ctx.fill();
          ctx.strokeStyle = '#2c3e50'; ctx.lineWidth = 1.2; ctx.stroke();
          if (CELL_NUM) {
            ctx.fillStyle = '#8a97a3';
            ctx.fillText(r * 10 + c + 1, x + cell / 2, y + cell / 2 + 1);
          }
        }
    }

    function draw(now) {
      ctx.fillStyle = '#101418';
      ctx.fillRect(0, 0, W, H);
      const ox = cam(now);
      ctx.save();
      ctx.translate(-ox, 0);              // the world, under the camera
      drawGrid(now);
      const span = W * 0.52;
      TABLES.forEach((t, i) => {
        if (i === 0) drawSnake1(now);
        else heap(60 + i * span / 2.4, H - 46, t, i * 1.7, now);
      });
      ctx.restore();
      document.getElementById('reveal').textContent =
        s1.state === 'heap' ? 'Send ×5 ▸' : 'Recall ◂';
    }

    function frame(now) {
      try { draw(now); } catch (e) { /* a bad frame must not kill the loop */ }
      requestAnimationFrame(frame);
    }

    resize();
    draw(performance.now());
    requestAnimationFrame(frame);
  </script>

  <script src="nav.js?v=14"></script>
</body>

</html>
