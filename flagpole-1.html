<!DOCTYPE html>
<html lang="en">

<head>
  <script src="gate.js?v=2"></script>
  <link rel="icon" type="image/svg+xml" href="icons/icon-coil.svg">
  <link rel="icon" href="favicon.ico" sizes="any">
  <meta charset="utf-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#101418">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>Flagpole — Any Number of Times</title>
  <meta name="description" content="Put the pennant up and give it wind.">
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden;
      background: #101418; touch-action: none;
      -webkit-user-select: none; user-select: none;
      font-family: Andika, -apple-system, ui-monospace, Menlo, monospace;
    }
    canvas { display: block; position: fixed; inset: 0; }
  </style>
  <link rel="preload" href="fonts/andika-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/andika-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts/andika.css">
</head>

<body>
  <canvas id="c"></canvas>
  <script>
    'use strict';
    /* flagpole-1 — the irreducible machine (Roger 2026-11-27): a pole,
       a pennant, and a puff of wind. Drag the pennant to the top of
       the pole, drag the wind up beside it, tap the wind — the flag
       flutters and its mark blooms. Same grammar as the full machine
       (anchors pulse while carrying, amber refusal on the wrong spot,
       glide-home on a miss) so the first visit teaches the principle
       before flagpole.html adds pulleys, cord and a windmill. */

    /* ---------- tunables ---------- */
    const POLE_X = 0.55;       // pole across the screen
    const POLE_TOP = 0.14;     // pennant height (fraction of H)
    const GROUND = 0.90;
    const FLAG_W = 104, FLAG_H = 68;
    const PUFF_X = 0.20;       // wind anchor, distance right of pole
    const TRAY_H = 96;         // parts shelf at the bottom
    const SNAP_R = 56;         // anchor acceptance radius
    const REFUSE_R = 40;       // near-enough-to-mean-it radius
    const FLUTTER = 11;        // wave amplitude with the wind on
    const BREATHE = 1.6;       // faint sway with the wind off
    const ANCHOR_PULSE = 1.6;  // s per anchor glow cycle
    const RETURN_MS = 600;     // a rejected part glides home
    const MARK_FADE = 1.2;     // s for the numeral to bloom / dim

    const cv = document.getElementById('c');
    const ctx = cv.getContext('2d');
    let W = 0, H = 0, DPR = 1;

    function resize() {
      const vv = window.visualViewport;
      W = vv ? vv.width : window.innerWidth;
      H = vv ? vv.height : window.innerHeight;
      if (W < 50 || H < 50) return;
      DPR = Math.min(window.devicePixelRatio || 1, 3);
      cv.width = W * DPR; cv.height = H * DPR;
      cv.style.width = W + 'px'; cv.style.height = H + 'px';
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      layout();
    }
    window.addEventListener('resize', resize);
    if (window.visualViewport)
      window.visualViewport.addEventListener('resize', resize);

    /* ---------- geometry ---------- */
    let px = 0, pTop = 0, gy = 0;
    const parts = {};
    const ORDER = ['pennant', 'puff'];
    const LABEL = { pennant: 'pennant', puff: 'wind' };

    function anchors() {
      return {
        pennant: { x: px, y: pTop },                 // the summit
        puff: { x: px + W * PUFF_X, y: pTop + 10 },  // beside the flag
      };
    }
    function anchorOf(id) { return anchors()[id]; }

    function layout() {
      px = W * POLE_X; pTop = H * POLE_TOP; gy = H * GROUND;
      const n = ORDER.length, gap = Math.min(140, (W - 60) / n);
      ORDER.forEach((id, i) => {
        const p = parts[id];
        p.home = { x: W / 2 + (i - (n - 1) / 2) * gap, y: H - TRAY_H / 2 };
        if (!p.placed && !p.dragging) {
          p.x = p.retT ? p.x : p.home.x;
          p.y = p.retT ? p.y : p.home.y;
        }
      });
    }
    ORDER.forEach(id => parts[id] = {
      x: 0, y: 0, placed: false, dragging: false, retT: 0, retFrom: null,
      on: false,
    });

    /* ---------- machine state ---------- */
    let markK = 0;        // 0..1 the numeral's bloom
    let flutterT = 0;     // wave clock
    const Q = new URLSearchParams(location.search);

    /* ---------- input ---------- */
    let drag = null, touch = false;
    function pt(e) {
      const r = cv.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    }
    cv.addEventListener('pointerdown', e => {
      const p = pt(e);
      /* a placed puff IS its switch — tap to toggle the wind */
      const s = parts.puff;
      if (s.placed) {
        const a = anchorOf('puff');
        if (Math.hypot(p.x - a.x, p.y - a.y) < 44) { s.on = !s.on; return; }
      }
      for (const id of ORDER.slice().reverse()) {
        const q = parts[id];
        if (q.placed || Math.hypot(p.x - q.x, p.y - q.y) > 40) continue;
        drag = id; q.dragging = true; q.retT = 0;
        touch = e.pointerType === 'touch';
        cv.setPointerCapture(e.pointerId);
        e.preventDefault();
        return;
      }
    });
    cv.addEventListener('pointermove', e => {
      if (!drag) return;
      const p = pt(e), s = parts[drag];
      s.x = p.x;
      s.y = p.y - (touch ? 40 : 0);
    });
    cv.addEventListener('pointerup', e => {
      if (!drag) return;
      const s = parts[drag], id = drag;
      drag = null; s.dragging = false;
      const p = pt(e), dy = p.y - (touch ? 40 : 0);
      touch = false;
      const a = anchorOf(id);
      if (Math.hypot(p.x - a.x, dy - a.y) < SNAP_R) {
        s.placed = true; s.x = a.x; s.y = a.y;
        return;
      }
      /* a near miss on the OTHER anchor earns the amber refusal;
         a drop in space just glides home */
      for (const oid of ORDER) {
        if (oid === id) continue;
        const o = anchorOf(oid);
        if (Math.hypot(p.x - o.x, dy - o.y) < REFUSE_R) {
          s.flash = performance.now();
          break;
        }
      }
      s.retT = performance.now(); s.retFrom = { x: s.x, y: s.y };
    });
    cv.addEventListener('pointercancel', () => {
      if (!drag) return;
      const s = parts[drag];
      drag = null; s.dragging = false;
      s.retT = performance.now(); s.retFrom = { x: s.x, y: s.y };
    });

    /* ---------- the pennant (same cloth trick as flagpole) ---------- */
    const FLAG_T = parseInt(Q.get('t') || '10', 10);
    const FLAG_HUE = (FLAG_T * 31 + 200) % 360;
    let flagTex = null, markTex = null;
    function flagTextures() {
      if (flagTex) return;
      const S = 2;
      flagTex = document.createElement('canvas');
      flagTex.width = FLAG_W * S; flagTex.height = FLAG_H * S;
      const c2 = flagTex.getContext('2d'); c2.scale(S, S);
      /* pennant: triangle, hoist edge right (at the pole), tip left */
      c2.beginPath();
      c2.moveTo(FLAG_W - 1, 1); c2.lineTo(FLAG_W - 1, FLAG_H - 1);
      c2.lineTo(1, FLAG_H / 2); c2.closePath();
      const g = c2.createLinearGradient(FLAG_W, 0, 0, 0);
      g.addColorStop(0, 'hsl(' + FLAG_HUE + ',62%,56%)');
      g.addColorStop(1, 'hsl(' + FLAG_HUE + ',55%,42%)');
      c2.fillStyle = g; c2.fill();
      c2.lineWidth = 2; c2.strokeStyle = 'hsl(' + FLAG_HUE + ',45%,30%)';
      c2.stroke();
      /* the mark rides its own transparent cloth so it can bloom
         independently while bending with the same wave */
      markTex = document.createElement('canvas');
      markTex.width = FLAG_W * S; markTex.height = FLAG_H * S;
      const c3 = markTex.getContext('2d'); c3.scale(S, S);
      c3.fillStyle = 'rgba(255,255,255,.95)';
      c3.font = '700 30px Andika, system-ui, sans-serif';
      c3.textAlign = 'center'; c3.textBaseline = 'middle';
      c3.fillText(String(FLAG_T), FLAG_W * 0.66, FLAG_H / 2);
    }

    /* cloth in vertical strips: hoist edge pinned to the pole, wave
       travels outward and grows toward the tip; fold shade from slope */
    function drawPennant(x, y, amp, phase) {
      flagTextures();
      const N = 18;
      for (let i = 0; i < N; i++) {
        const k = i / (N - 1);                     // 0 tip .. 1 hoist
        const grow = 1 - k;                        // wave grows outward
        const w = amp * grow * grow;
        const ph = phase - grow * 2.6;
        const dy = Math.sin(ph) * w;
        const shade = Math.cos(ph) * 0.5 + 0.5;    // fold light
        const sx = i * (FLAG_W / N), sw = FLAG_W / N + 1;
        ctx.globalAlpha = 0.9 + 0.1 * shade;
        ctx.drawImage(flagTex, sx * 2, 0, sw * 2, FLAG_H * 2,
          x + sx, y + dy, sw, FLAG_H);
        if (markK > 0.02) {
          ctx.globalAlpha = markK * (0.7 + 0.3 * shade);
          ctx.drawImage(markTex, sx * 2, 0, sw * 2, FLAG_H * 2,
            x + sx, y + dy, sw, FLAG_H);
        }
      }
      ctx.globalAlpha = 1;
    }

    function drawPuff(x, y, on, scale) {
      ctx.save(); ctx.translate(x, y); ctx.scale(scale || 1, scale || 1);
      ctx.globalAlpha = on ? 1 : 0.5;
      ctx.font = '44px system-ui, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('\u{1F4A8}', 0, 0);            // 💨
      ctx.restore();
    }

    function drawWind(x0, y0, x1, y1, on, now) {
      if (!on) return;
      ctx.save();
      const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy);
      const ux = dx / L, uy = dy / L, n = Math.floor(L / 26);
      ctx.strokeStyle = 'rgba(140,180,200,.30)';
      ctx.lineWidth = 1.5;
      for (let i = 0; i < n; i++) {
        const k = ((i / n) + now / 1400) % 1;
        const bx = x0 + dx * k, by = y0 + dy * k;
        ctx.beginPath();
        ctx.moveTo(bx - ux * 9, by - uy * 9);
        ctx.quadraticCurveTo(bx, by - 4, bx + ux * 9, by + uy * 9);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawTray() {
      ctx.fillStyle = 'rgba(22,33,28,.85)';
      ctx.fillRect(0, H - TRAY_H, W, TRAY_H);
      ctx.beginPath(); ctx.moveTo(0, H - TRAY_H); ctx.lineTo(W, H - TRAY_H);
      ctx.strokeStyle = '#243528'; ctx.lineWidth = 2; ctx.stroke();
      for (const id of ORDER) {
        const s = parts[id];
        ctx.fillStyle = '#5f6e7c';
        ctx.font = '600 11px Andika, system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(LABEL[id], s.home.x, s.home.y + 34);
      }
    }

    function drawPart(id, s) {
      ctx.save(); ctx.translate(s.x, s.y);
      if (s.flash && performance.now() - s.flash < 500) {
        ctx.strokeStyle = '#e0a53a'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(0, 0, 30, 0, 7); ctx.stroke();
      }
      if (id === 'pennant') {
        ctx.translate(FLAG_W * 0.3, FLAG_H * 0.3 - 10);
        ctx.scale(0.45, 0.45);
        ctx.translate(-FLAG_W, -FLAG_H / 2);
        drawPennant(0, 0, 1.5, 0);
      } else {
        drawPuff(0, 0, true, 0.8);
      }
      ctx.restore();
    }

    function drawAnchor(id, now) {
      if (parts[id].placed) return;
      const a = anchorOf(id);
      const p = 0.5 + 0.5 * Math.sin(now / 1000 * Math.PI * 2 / ANCHOR_PULSE);
      const carrying = drag === id;
      const a2 = (carrying ? 0.55 : 0.18) + 0.25 * p;
      ctx.beginPath();
      ctx.arc(a.x, a.y, SNAP_R * (carrying ? 1 : 0.7), 0, 7);
      ctx.strokeStyle = 'rgba(53,199,149,' + a2 + ')';
      ctx.lineWidth = carrying ? 2.5 : 1.5;
      ctx.setLineDash([6, 7]);
      ctx.stroke(); ctx.setLineDash([]);
    }

    /* ---------- frame ---------- */
    let last = 0, diagDone = false;
    function draw(now) {
      const dt = Math.min(0.05, (now - last) / 1000 || 0); last = now;
      ctx.clearRect(0, 0, W, H);

      /* ?flag — diagnostic: machine pre-built, wind blowing */
      if (!diagDone && Q.has('flag')) {
        ORDER.forEach(id => parts[id].placed = true);
        parts.puff.on = true; markK = 1; diagDone = true;
      }

      const working = parts.pennant.placed && parts.puff.placed && parts.puff.on;
      if (parts.puff.placed && parts.puff.on) flutterT += dt;
      markK += (working ? dt / MARK_FADE : -dt / MARK_FADE);
      markK = Math.max(0, Math.min(1, markK));

      /* sky + ground */
      ctx.fillStyle = '#0d141a';
      ctx.fillRect(0, 0, W, gy);
      ctx.fillStyle = '#16211c';
      ctx.fillRect(0, gy, W, H - gy);
      ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy);
      ctx.strokeStyle = '#243528'; ctx.lineWidth = 2; ctx.stroke();

      /* the pole, with a little finial */
      ctx.beginPath(); ctx.moveTo(px, pTop - 20); ctx.lineTo(px, gy);
      ctx.lineWidth = 7; ctx.strokeStyle = '#5a6f80'; ctx.stroke();
      ctx.lineWidth = 2; ctx.strokeStyle = '#7a8fa0'; ctx.stroke();
      ctx.beginPath(); ctx.arc(px, pTop - 24, 5, 0, 7);
      ctx.fillStyle = '#e0a53a'; ctx.fill();

      /* the pennant on the summit, streaming left away from the wind */
      if (parts.pennant.placed) {
        const amp = parts.puff.placed && parts.puff.on ? FLUTTER : BREATHE;
        drawPennant(px - FLAG_W, pTop - FLAG_H / 2, amp, flutterT * 7);
      }

      /* the wind, its streaks reaching the flag */
      if (parts.puff.placed) {
        const a = anchorOf('puff');
        drawPuff(a.x, a.y, parts.puff.on, 1);
        drawWind(a.x - 26, a.y - 4, px - 8, pTop - 4, parts.puff.on, now);
      }

      drawTray();
      for (const id of ORDER) {
        const s = parts[id];
        if (!s.placed) {
          /* a rejected part glides home */
          if (s.retT) {
            const k = Math.min((now - s.retT) / RETURN_MS, 1);
            const e = 1 - (1 - k) * (1 - k);
            s.x = s.retFrom.x + (s.home.x - s.retFrom.x) * e;
            s.y = s.retFrom.y + (s.home.y - s.retFrom.y) * e;
            if (k >= 1) s.retT = 0;
          }
          drawPart(id, s);
        }
        drawAnchor(id, now);
      }
    }
    function frame(now) { draw(now); requestAnimationFrame(frame); }
    requestAnimationFrame(frame);
  </script>

  <script src="nav.js?v=20"></script>
</body>

</html>
