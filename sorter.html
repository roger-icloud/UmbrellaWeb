<!DOCTYPE html>
<html lang="en">

<head>
  <script src="gate.js?v=2"></script>
  <link rel="icon" type="image/svg+xml" href="icons/icon-coil.svg">
  <link rel="icon" href="favicon.ico" sizes="any">
  <meta charset="utf-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#101418">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>Sorter — Any Number of Times</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #101418;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    canvas {
      position: fixed;
      inset: 0;
      display: block;
    }
  </style>
  <link rel="preload" href="fonts/andika-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/andika-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts/andika.css">
  <meta name="description" content="A sloping rail with five holes, smallest to largest — each coin falls into the first one it fits.">
</head>

<body>
  <canvas id="c"></canvas>
  <script>
    'use strict';
    /* sorter v3 (Roger 2026-11-21): a rail slopes down left→right with
       five holes graduated smallest→largest. No doors — geometry sorts:
       a coin falls into the FIRST hole it fits, too big for the last
       hole → it rides to the reject cup. Each hole is labelled with an
       expression and the lift descends only when every pocket holds
       that product's coin — a near-miss coin gets physically misfiled
       and can be fished out of its pocket by hand. */

    /* ---------- tunables ---------- */
    const RAIL_Y0 = 0.26;        // rail surface at left (fraction of H)
    const RAIL_Y1 = 0.40;        // rail surface at right — the slope
    const RAIL_X0 = 0.05;        // rail extent (fractions of W)
    const RAIL_X1 = 0.86;
    const AP_X0 = 0.17;          // hole band along the rail
    const AP_X1 = 0.72;
    const HOLE_GAP = 3;          // hole diameter = coin diameter + this
                                 // (band gaps are >=10 values; clearance must
                                 // stay under 0.44*gap or an oversized coin
                                 // squeezes through a smaller hole)
    const SHELF_Y = 0.63;        // plank the pockets hang on
    const CUP_L = 0.845, CUP_T = 0.71, CUP_B = 0.815;  // reject bin
    const TRAY_H = 96;
    const AVENUES = 5;
    const STOCK_EXTRA = 3;       // decoy coins beyond the targets
    const GRAV = 2400;
    const ROLL_A = 660;
    const ROLL_MAX = 430;
    const CUP_MS = 1150;
    const RETURN_MS = 650;
    const HOLD_MS = 750;
    const DESCEND_MS = 1900;
    const ARRIVE_MS = 1400;
    const BIG_P = 0.4;           // chance a decoy is too big for the last hole

    const cv = document.getElementById('c');
    const ctx = cv.getContext('2d');
    let W = 0, H = 0, DPR = 1;

    function resize() {
      const vv = window.visualViewport;
      W = vv ? vv.width : window.innerWidth;
      H = vv ? vv.height : window.innerHeight;
      if (W < 50 || H < 50) return;
      DPR = Math.min(window.devicePixelRatio || 1, 3);
      cv.width = W * DPR; cv.height = H * DPR;
      cv.style.width = W + 'px'; cv.style.height = H + 'px';
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      layout();
    }
    window.addEventListener('resize', resize);
    if (window.visualViewport)
      window.visualViewport.addEventListener('resize', resize);

    /* ---------- the machine ---------- */
    let holes = [];              // five holes, diameter ascending L→R
    let coins = [];
    let phase = 'play';          // play | hold | descend | arrive
    let phaseT = 0;
    let descendK = 0, arriveK = 0;
    let cupN = 0;

    const rx0 = () => W * RAIL_X0, rx1 = () => W * RAIL_X1;
    function railYat(x) {
      const k = Math.min(1, Math.max(0, (x - rx0()) / (rx1() - rx0())));
      return H * (RAIL_Y0 + (RAIL_Y1 - RAIL_Y0) * k);
    }
    const cupFloor = () => H * CUP_B - 8;
    const coinR = v => 10 + v * 0.22;    // value → diameter

    function layout() {
      holes.forEach((a, i) => {
        a.x = W * AP_X0 + (W * (AP_X1 - AP_X0)) * (i / (AVENUES - 1));
        a.y = railYat(a.x);
        a.slot = { x: a.x, y: H * SHELF_Y - 10 - a.tr };
      });
      const n = coins.length, gap = Math.min(74, (W - 56) / Math.max(1, n));
      coins.forEach((c, i) => {
        c.home = { x: W / 2 + (i - (n - 1) / 2) * gap, y: H - TRAY_H / 2 };
        if (c.state === 'tray') { c.x = c.home.x; c.y = c.home.y; }
      });
    }

    /* ---------- the deal ---------- */
    /* five products, one per magnitude band, so hole sizes and target
       coin sizes both ascend left→right with clear separation */
    const BANDS = [[8, 14], [28, 34], [44, 50], [60, 66], [76, 81]];
    function productsIn(lo, hi) {
      const out = [];
      for (let a = 2; a <= 9; a++) for (let b = 2; b <= 9; b++) {
        const v = a * b;
        if (v >= lo && v <= hi) out.push([a, b, v]);
      }
      return out;
    }
    function deal() {
      const seen = new Set();
      holes = BANDS.map((band, i) => {
        const opts = productsIn(band[0], band[1])
          .filter(o => !seen.has(o[2]));
        const pick = opts[Math.floor(Math.random() * opts.length)];
        seen.add(pick[2]);
        return {
          i, x: 0, y: 0, expr: pick[0] + '×' + pick[1], val: pick[2],
          tr: coinR(pick[2]), d: 0,
          slot: { x: 0, y: 0 }, seated: null, bad: false, glint: 0,
        };
      });
      holes.forEach(a => a.d = 2 * a.tr + HOLE_GAP);

      /* stock: the five targets + decoys that misfile nearby */
      const vals = holes.map(a => a.val);
      const tMax = holes[AVENUES - 1].val;
      if (Math.random() < BIG_P) {
        /* a monster: bigger than the last hole, cup-bound on sight */
        vals.push(Math.min(99, tMax + 15 + Math.floor(Math.random() * 8)));
      }
      while (vals.length < AVENUES + STOCK_EXTRA + 1) {
        const t = vals[Math.floor(Math.random() * AVENUES)];
        const d = t + (Math.random() < 0.5 ? -1 : 1)
          * (1 + Math.floor(Math.random() * 4));
        if (d > 0 && !vals.includes(d) && d < tMax + 15) vals.push(d);
      }
      vals.sort(() => Math.random() - 0.5);
      coins = vals.map(v => ({
        v, x: 0, y: 0, r: coinR(v),
        state: 'tray', roll: 0, vx: 0, vy: 0,
        hole: -1, t: 0, falling: false,
        retT: 0, retFrom: null, home: { x: 0, y: 0 },
        cupX: 0, cupY: 0,
      }));
      cupN = 0;
      layout();
    }

    /* ---------- input ---------- */
    let drag = -1, touch = false;
    function pt(e) {
      const r = cv.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    }
    function overRail(x, y) {
      return x > rx0() - 10 && x < rx1() + 10 && y < railYat(x) - 6;
    }
    cv.addEventListener('pointerdown', e => {
      if (phase !== 'play' && phase !== 'hold') return;
      const p = pt(e);
      for (let i = coins.length - 1; i >= 0; i--) {
        const c = coins[i];
        const grabbable = c.state === 'tray' || c.state === 'cup'
          || c.state === 'seat';
        if (!grabbable || Math.hypot(p.x - c.x, p.y - c.y) > c.r + 12)
          continue;
        if (c.state === 'cup') cupN--;
        if (c.state === 'seat') {
          const a = holes[c.hole];
          a.seated = null; a.bad = false;
          c.hole = -1;
        }
        drag = i; c.state = 'drag'; c.retT = 0;
        touch = e.pointerType === 'touch';
        cv.setPointerCapture(e.pointerId);
        e.preventDefault();
        return;
      }
    });
    cv.addEventListener('pointermove', e => {
      if (drag < 0) return;
      const p = pt(e), c = coins[drag];
      c.x = Math.max(8, Math.min(W - 8, p.x));
      c.y = p.y - (touch ? 44 : 0);
    });
    function release(p, dy) {
      const c = coins[drag];
      touch = false; drag = -1;
      if (overRail(p.x, dy)) {
        c.x = Math.max(rx0() + 8, Math.min(rx1() - 8, p.x));
        c.y = dy;
        c.vy = 0;
        c.state = 'plop';
      } else {
        c.state = 'home'; c.retT = performance.now();
        c.retFrom = { x: c.x, y: c.y };
      }
    }
    cv.addEventListener('pointerup', e => {
      if (drag < 0) return;
      const p = pt(e);
      release(p, p.y - (touch ? 44 : 0));
    });
    cv.addEventListener('pointercancel', () => {
      if (drag < 0) return;
      const c = coins[drag]; drag = -1; touch = false;
      c.state = 'home'; c.retT = performance.now();
      c.retFrom = { x: c.x, y: c.y };
    });

    /* ---------- physics-lite ---------- */
    function step(c, dt, now) {
      if (c.state === 'plop') {
        c.vy += GRAV * dt;
        c.y += c.vy * dt;
        const ry = railYat(c.x) - c.r;
        if (c.y >= ry) {
          c.y = ry;
          c.vx = 80 + c.vy * 0.12;
          c.state = 'roll';
        }
      } else if (c.state === 'roll') {
        c.vx = Math.min(ROLL_MAX, c.vx + ROLL_A * dt);
        c.x += c.vx * dt;
        c.y = railYat(c.x) - c.r;
        c.roll += c.vx * dt / c.r;
        /* a coin falls into the first hole it fits — geometry sorts */
        for (const a of holes) {
          if (a.seated) continue;
          if (Math.abs(c.x - a.x) <= a.d / 2 - 4 && 2 * c.r <= a.d) {
            c.state = 'through'; c.hole = a.i; c.t = now;
            c.falling = false;
            return;
          }
        }
        if (c.x >= rx1() - 6) { c.state = 'spill'; c.vy = 0; }
      } else if (c.state === 'through') {
        const a = holes[c.hole];
        if (!c.falling) {
          /* sink to the hole mouth, then fall */
          c.x += (a.x - c.x) * Math.min(1, dt * 16);
          c.y += (railYat(c.x) - c.r * 0.4 - c.y) * Math.min(1, dt * 16);
          if (now - c.t > 90) { c.falling = true; c.vy = 60; }
        } else {
          c.vy += GRAV * dt;
          c.y += c.vy * dt;
          c.x += (a.slot.x - c.x) * Math.min(1, dt * 10);
          /* each coin finds the pocket floor by its own size —
             a wrong small coin sits visibly loose in the alcove */
          const floor = H * SHELF_Y - 8 - c.r;
          if (c.y >= floor) {
            c.y = floor; c.x = a.slot.x;
            c.state = 'seat'; a.seated = c;
            a.bad = c.v !== a.val;
            if (a.bad) a.glint = now;
            if (holes.every(q => q.seated && !q.bad)) {
              phase = 'hold'; phaseT = now;
            }
          }
        }
      } else if (c.state === 'spill') {
        c.vy += GRAV * dt;
        c.x += c.vx * dt;
        c.y += c.vy * dt;
        c.roll += c.vx * dt / c.r;
        const wall = W * 0.965 - c.r;
        if (c.x > wall) { c.x = wall; c.vx *= -0.25; }
        if (c.y >= cupFloor() - c.r) {
          c.y = cupFloor() - c.r;
          c.state = 'cup'; c.t = now;
          const slots = Math.max(1, Math.floor((W * 0.10 - 24) / 30));
          c.cupX = W * 0.865 + 14 + (cupN % slots) * 30
            + (Math.random() * 8 - 4);
          c.cupY = cupFloor() - c.r - Math.floor(cupN / slots) * (c.r + 4);
          cupN++;
        }
      } else if (c.state === 'cup') {
        c.x += (c.cupX - c.x) * Math.min(1, dt * 8);
        c.y += (c.cupY - c.y) * Math.min(1, dt * 8);
        if (now - c.t > CUP_MS) {
          c.state = 'home'; c.retT = now; c.retFrom = { x: c.x, y: c.y };
        }
      } else if (c.state === 'home') {
        const k = Math.min(1, (now - c.retT) / RETURN_MS);
        const e = 1 - (1 - k) * (1 - k);
        c.x = c.retFrom.x + (c.home.x - c.retFrom.x) * e;
        c.y = c.retFrom.y + (c.home.y - c.retFrom.y) * e;
        if (k >= 1) { c.state = 'tray'; c.hole = -1; }
      }
    }

    /* ---------- drawing ---------- */
    function drawCoin(c, ghost) {
      ctx.save(); ctx.translate(c.x, c.y);
      ctx.beginPath(); ctx.arc(0, 0, c.r, 0, 7);
      const g = ctx.createRadialGradient(-c.r * 0.3, -c.r * 0.3, c.r * 0.15,
        0, 0, c.r);
      g.addColorStop(0, ghost ? '#3a4750' : '#f0c76a');
      g.addColorStop(1, ghost ? '#2a343c' : '#c08a2e');
      ctx.fillStyle = g; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = ghost ? '#45545f' : '#8a5f1d';
      ctx.stroke();
      if (!ghost) {
        ctx.save(); ctx.rotate(c.roll);
        ctx.beginPath(); ctx.arc(c.r * 0.62, 0, 2.2, 0, 7);
        ctx.fillStyle = '#8a5f1d'; ctx.fill();
        ctx.restore();
      }
      ctx.font = '600 ' + Math.round(c.r * 0.95) + 'px Andika, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = ghost ? '#5a6b78' : '#5a3d10';
      ctx.fillText(String(c.v), 0, 1);
      ctx.restore();
    }

    function railSeg(x0, x1) {
      ctx.beginPath();
      ctx.moveTo(x0, railYat(x0));
      ctx.lineTo(x1, railYat(x1));
      ctx.lineWidth = 10;
      ctx.strokeStyle = '#1a242e'; ctx.lineCap = 'butt'; ctx.stroke();
      ctx.lineWidth = 2.5; ctx.strokeStyle = '#3d4f5f'; ctx.stroke();
    }

    function drawStructure(now, dy) {
      ctx.save(); ctx.translate(0, dy);

      /* the rail, broken into runs around the holes */
      let edge = rx0();
      holes.forEach(a => {
        railSeg(edge, a.x - a.d / 2);
        edge = a.x + a.d / 2;
      });
      railSeg(edge, rx1());
      /* downturned lip where coins leave */
      ctx.beginPath();
      ctx.moveTo(rx1(), railYat(rx1()) - 6);
      ctx.quadraticCurveTo(rx1() + 10, railYat(rx1()) - 2,
        rx1() + 12, railYat(rx1()) + 10);
      ctx.lineWidth = 4; ctx.strokeStyle = '#4a5f70';
      ctx.lineCap = 'round'; ctx.stroke();

      holes.forEach(a => {
        const hy = railYat(a.x);
        /* the hole itself: a shadowed gap with lipped edges */
        ctx.beginPath();
        ctx.ellipse(a.x, hy + 2, a.d / 2, 5.5, 0, 0, 7);
        ctx.fillStyle = '#070c10'; ctx.fill();
        ctx.lineWidth = 1.5; ctx.strokeStyle = '#2c3c49'; ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(a.x - a.d / 2, hy);
        ctx.lineTo(a.x - a.d / 2 - 3, hy + 7);
        ctx.moveTo(a.x + a.d / 2, hy);
        ctx.lineTo(a.x + a.d / 2 + 3, hy + 7);
        ctx.lineWidth = 2.5; ctx.strokeStyle = '#4a5f70';
        ctx.lineCap = 'round'; ctx.stroke();
        /* criterion, quiet, above the mouth */
        ctx.font = '600 13px Andika, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
        ctx.fillStyle = 'rgba(160,175,190,.85)';
        ctx.fillText(a.expr, a.x, hy - a.d / 2 - 14);
        /* hangers to the pocket */
        ctx.beginPath();
        ctx.moveTo(a.x - a.d / 2 - 7, hy + 6);
        ctx.lineTo(a.x - a.d / 2 - 7, a.slot.y + a.tr + 10);
        ctx.moveTo(a.x + a.d / 2 + 7, hy + 6);
        ctx.lineTo(a.x + a.d / 2 + 7, a.slot.y + a.tr + 10);
        ctx.lineWidth = 3; ctx.strokeStyle = '#2c3c49'; ctx.stroke();
        /* the pocket alcove, sized to its target coin */
        const pw = a.tr + 5;
        ctx.beginPath();
        ctx.moveTo(a.x - pw, a.slot.y + a.tr + 8);
        ctx.lineTo(a.x - pw, a.slot.y - a.tr - 4);
        ctx.moveTo(a.x + pw, a.slot.y + a.tr + 8);
        ctx.lineTo(a.x + pw, a.slot.y - a.tr - 4);
        ctx.lineWidth = 3; ctx.strokeStyle = '#33424e'; ctx.stroke();
        /* a wrong coin sits with a persistent amber halo — refusal
           is information, not alarm */
        if (a.bad && a.seated) {
          const k = a.glint ? Math.min(1, (now - a.glint) / 700) : 1;
          const alpha = 0.45 + 0.3 * Math.sin(now / 380);
          ctx.beginPath();
          ctx.arc(a.x, a.seated.y, a.seated.r + 4, 0, 7);
          ctx.strokeStyle = 'rgba(224,165,58,' + (alpha * k).toFixed(3) + ')';
          ctx.lineWidth = 3; ctx.stroke();
        }
      });

      /* the plank uniting the pockets — the shelf that descends */
      const pL = W * (AP_X0 - 0.05), pR = W * (AP_X1 + 0.05);
      ctx.beginPath();
      ctx.moveTo(pL, H * SHELF_Y); ctx.lineTo(pR, H * SHELF_Y);
      ctx.lineWidth = 8; ctx.strokeStyle = '#22303c'; ctx.stroke();
      ctx.lineWidth = 2; ctx.strokeStyle = '#3d4f5f'; ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(pL + 10, H * SHELF_Y + 4); ctx.lineTo(pL + 10, H * SHELF_Y + 46);
      ctx.moveTo(pR - 10, H * SHELF_Y + 4); ctx.lineTo(pR - 10, H * SHELF_Y + 46);
      ctx.lineWidth = 5; ctx.strokeStyle = '#22303c'; ctx.stroke();

      ctx.restore();
    }

    function drawCup() {
      const x0 = W * CUP_L, x1 = W * 0.97;
      const yt = H * CUP_T, yb = H * CUP_B;
      ctx.beginPath();
      ctx.moveTo(x0, yt); ctx.lineTo(x0 + 8, yb);
      ctx.lineTo(x1 - 8, yb); ctx.lineTo(x1, yt);
      ctx.lineWidth = 5; ctx.strokeStyle = '#22303c'; ctx.stroke();
      ctx.lineWidth = 1.5; ctx.strokeStyle = '#3d4f5f'; ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(rx1() + 12, railYat(rx1()) + 14);
      ctx.quadraticCurveTo(rx1() + 26, yt - 40, x0 + 12, yt - 4);
      ctx.lineWidth = 3; ctx.strokeStyle = '#2c3c49'; ctx.stroke();
    }

    /* ---------- frame ---------- */
    let last = 0;
    function frame(now) {
      try {
        const dt = Math.min(0.05, (now - last) / 1000 || 0); last = now;
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = '#0d141a';
        ctx.fillRect(0, 0, W, H);

        if (phase === 'hold' && now - phaseT > HOLD_MS) {
          phase = 'descend'; phaseT = now;
        } else if (phase === 'descend') {
          descendK = Math.min(1, (now - phaseT) / DESCEND_MS);
          if (descendK >= 1) {
            deal(); phase = 'arrive'; phaseT = now;
            arriveK = 0; descendK = 0;
          }
        } else if (phase === 'arrive') {
          arriveK = Math.min(1, (now - phaseT) / ARRIVE_MS);
          if (arriveK >= 1) { phase = 'play'; arriveK = 0; }
        }

        const ease = k => 1 - (1 - k) * (1 - k) * (1 - k);
        let dy = 0;
        if (phase === 'descend') dy = ease(descendK) * (H * SHELF_Y + 220);
        if (phase === 'arrive') dy = -(1 - ease(arriveK)) * (H * SHELF_Y + 220);

        coins.forEach(c => {
          if (c.state !== 'tray' && c.state !== 'drag' && c.state !== 'seat')
            step(c, dt, now);
        });

        drawStructure(now, dy);

        ctx.save(); ctx.translate(0, dy);
        coins.forEach(c => {
          if (c.state === 'plop' || c.state === 'roll'
            || c.state === 'through' || c.state === 'seat')
            drawCoin(c, false);
        });
        if (drag >= 0) {
          const c = coins[drag];
          if (overRail(c.x, c.y)) {
            const ry = railYat(c.x) - c.r;
            ctx.beginPath(); ctx.arc(c.x, ry, c.r, 0, 7);
            ctx.strokeStyle = 'rgba(53,199,149,.5)';
            ctx.lineWidth = 2; ctx.setLineDash([4, 5]); ctx.stroke();
            ctx.setLineDash([]);
            ctx.beginPath(); ctx.moveTo(c.x, c.y + c.r + 4);
            ctx.lineTo(c.x, ry - c.r - 4);
            ctx.strokeStyle = 'rgba(53,199,149,.25)';
            ctx.lineWidth = 1.5; ctx.setLineDash([3, 6]); ctx.stroke();
            ctx.setLineDash([]);
          }
        }
        ctx.restore();

        drawCup();
        coins.forEach(c => {
          if (c.state === 'spill' || c.state === 'cup'
            || c.state === 'home' || c.state === 'drag')
            drawCoin(c, false);
        });

        ctx.fillStyle = 'rgba(14,20,26,.88)';
        ctx.fillRect(0, H - TRAY_H, W, TRAY_H);
        ctx.strokeStyle = '#22303c'; ctx.beginPath();
        ctx.moveTo(0, H - TRAY_H); ctx.lineTo(W, H - TRAY_H); ctx.stroke();
        coins.forEach(c => { if (c.state === 'tray') drawCoin(c, false); });
      } catch (err) { /* a bad frame must not kill the machine */ }
      requestAnimationFrame(frame);
    }
    deal();
    resize();
    requestAnimationFrame(frame);
  </script>

  <script src="nav.js?v=22"></script>
</body>

</html>
