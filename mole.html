<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#101418">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>Moles — NumberFun</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #101418;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      font-family: Andika, -apple-system, ui-monospace, Menlo, monospace;
    }

    canvas {
      display: block;
      position: fixed;
      inset: 0;
    }

    #rotOverlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: rgba(10, 14, 18, .85);
      color: #cfd8e0;
      z-index: 9;
      text-align: center;
      padding: 24px;
    }

    #rotOverlay .sub {
      font-size: 13px;
      color: #8a97a3;
      margin-top: 14px;
      max-width: 340px;
    }

    .hidden {
      display: none !important;
    }
  </style>
  <link rel="preload" href="fonts/andika-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/andika-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts/andika.css">
</head>

<body>

  <canvas id="c"></canvas>

  <div id="rotOverlay" class="hidden">
    <div style="font-size:22px">Turn upright</div>
    <div class="sub">Portrait only for now.</div>
  </div>

  <script>
    'use strict';

    /* ---------- tunables ---------- */
    /* A whack-a-mole that isn't a time trial: numeral moles rise from
       holes and hold; tap the ones that belong to the table, leave
       the rest. Nothing chases — a mole left alone simply sinks back
       and returns later. The prize is the row: collected multiples
       self-order into ×1..×12 across the bottom — consolidation made
       physical. Distractors are near-misses (±1, ±2 of multiples) and
       other-table multiples — the recognition being exercised, not
       speed. */
    const HOLE_COLS = 3, HOLE_ROWS = 3;   // mole field
    const MAX_UP = 3;              // moles above ground at once
    const HOLD_SECS = 4.5;         // a mole holds this long if ignored
    const RISE_SECS = 0.35;        // pop-up time
    const SINK_SECS = 0.45;        // duck-back time (ignored or refused)
    const FLY_SECS = 0.55;         // collected mole flies to its socket
    const GAP_SECS = 0.6;          // pause before the next mole rises
    const MOLE_R = 24;
    const SOCKET_R = 13;           // sockets in the ×t row
    const FLASH_SECS = 0.6;        // amber refusal on a wrong tap
    const N_DISTRACT = 12;         // wrong numbers per round
    const BEAT_SECS = 0.12;        // row reinforcement step, per socket
    const END_PAUSE = 2.5;         // s the finished row rests before reset

    /* ---------- canvas: virtual resolution ----------
       Same scheme as the tilt games: world is DESIGN_W design-px wide,
       one scale K maps it to the device. */
    const DESIGN_W = 375;
    const K_MAX = 1.8;
    const MIN_DESIGN_H = 480;
    const cv = document.getElementById('c');
    const ctx = cv.getContext('2d');
    let W = 0, H = 0, Wd = 0, Hd = 0, DPR = 1, K = 1;

    function resize() {
      const vv = window.visualViewport;
      const w = vv ? vv.width : window.innerWidth;
      const h = vv ? vv.height : window.innerHeight;
      if (w < 50 || h < 50) return;
      DPR = Math.min(window.devicePixelRatio || 1, 3);
      W = w; H = h;
      K = Math.min(W / DESIGN_W, H / MIN_DESIGN_H, K_MAX);
      Wd = W / K; Hd = H / K;
      cv.width = W * DPR; cv.height = H * DPR;
      cv.style.width = W + 'px'; cv.style.height = H + 'px';
      ctx.setTransform(DPR * K, 0, 0, DPR * K, 0, 0);
    }
    window.addEventListener('resize', resize);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

    /* ---------- table & sockets ---------- */
    const qs = new URLSearchParams(location.search);
    const TABLE = Math.min(Math.max(parseInt(qs.get('t') || '7', 10) || 7, 2), 12);
    const TCOL = `hsl(${(TABLE * 31 + 200) % 360}, 60%, 45%)`;

    resize();
    const moles = [];            // up/holding/flying numeral discs
    const sockets = [];          // filled flags for ×1..×12
    let queue = [];              // values still to emerge
    let nextRiseAt = 0;          // pacing for the field
    let doneAt = 0;              // timestamp when the row completed
    let paused = false;

    /* hole positions: the field sits upper-middle; the sockets run in
       two short rows near the bottom, just above the thumb zone */
    function holePos(i) {
      const r = Math.floor(i / HOLE_COLS), c = i % HOLE_COLS;
      return {
        x: Wd * (0.2 + 0.3 * c) + (r % 2 ? Wd * 0.05 : -Wd * 0.05),
        y: Hd * (0.18 + 0.17 * r),
      };
    }
    const N_HOLES = HOLE_COLS * HOLE_ROWS;

    function socketPos(k) {      // k = 0..11, reading order
      const cols = 6, r = Math.floor(k / cols), c = k % cols;
      return { x: Wd * (0.5 + (c - (cols - 1) / 2) * 0.16), y: Hd * (0.80 + 0.11 * r) };
    }

    /* ---------- deal queue ---------- */
    function distractors() {
      const out = new Set();
      const ms = []; for (let k = 1; k <= 12; k++) ms.push(TABLE * k);
      while (out.size < N_DISTRACT) {
        const m = ms[Math.floor(Math.random() * ms.length)];
        const cands = [m - 2, m - 1, m + 1, m + 2,
          m + TABLE, m - TABLE];
        const v = cands[Math.floor(Math.random() * cands.length)];
        if (v > 1 && v % TABLE !== 0) out.add(v);
      }
      return [...out];
    }

    function reset(now) {
      queue = [];
      for (let k = 1; k <= 12; k++) queue.push(TABLE * k);
      queue.push(...distractors());
      for (let i = queue.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [queue[i], queue[j]] = [queue[j], queue[i]];
      }
      moles.length = 0;
      sockets.fill(false);
      doneAt = 0;
      nextRiseAt = now;
    }
    for (let k = 0; k < 12; k++) sockets.push(false);

    /* ---------- mole lifecycle ---------- */
    function rise(now) {
      if (!queue.length || doneAt) return;
      const free = [];
      for (let i = 0; i < N_HOLES; i++)
        if (!moles.some(m => m.hole === i)) free.push(i);
      if (!free.length) return;
      const v = queue.shift();
      moles.push({
        v, hole: free[Math.floor(Math.random() * free.length)],
        phase: 'rise', t0: now, flashUntil: 0,
        from: null, to: null,
      });
    }

    function tap(x, y) {
      for (const m of moles) {
        if (m.phase !== 'hold' && m.phase !== 'rise') continue;
        const p = holePos(m.hole);
        const my = p.y - MOLE_R * 1.1;           // risen centre
        if (Math.hypot(x - p.x, y - my) < MOLE_R + 14) {
          if (m.v % TABLE === 0) {
            m.phase = 'fly';
            m.t0 = performance.now();
            m.to = socketPos(m.v / TABLE - 1);
            m.from = { x: p.x, y: my };
            sockets[m.v / TABLE - 1] = 'flying';
          } else {
            m.phase = 'sink';
            m.t0 = performance.now();
            m.flashUntil = performance.now() + FLASH_SECS * 1000;
            queue.push(m.v);                   // ignored wrongs return later
          }
          return;
        }
      }
    }

    cv.addEventListener('pointerdown', (e) => tap(e.clientX / K, e.clientY / K));
    cv.addEventListener('touchmove', (t) => t.preventDefault(), { passive: false });

    /* ---------- step ---------- */
    function step(now) {
      const up = moles.filter(m => m.phase === 'hold' || m.phase === 'rise').length;
      if (up < MAX_UP && now >= nextRiseAt) { rise(now); nextRiseAt = now + GAP_SECS * 1000; }

      for (let i = moles.length - 1; i >= 0; i--) {
        const m = moles[i];
        const age = (now - m.t0) / 1000;
        if (m.phase === 'rise' && age >= RISE_SECS) { m.phase = 'hold'; m.t0 = now; }
        else if (m.phase === 'hold' && age >= HOLD_SECS) {
          m.phase = 'sink'; m.t0 = now;
          queue.push(m.v);                     // ignored moles return later
        }
        else if (m.phase === 'sink' && age >= SINK_SECS) moles.splice(i, 1);
        else if (m.phase === 'fly') {
          const k = Math.min(age / FLY_SECS, 1);
          const e = 1 - (1 - k) * (1 - k);       // ease-out
          m.x = m.from.x + (m.to.x - m.from.x) * e;
          m.y = m.from.y + (m.to.y - m.from.y) * e - Math.sin(k * Math.PI) * 30;
          if (k >= 1) { sockets[m.v / TABLE - 1] = true; moles.splice(i, 1); }
        }
      }
      if (!doneAt && sockets.every(s => s === true)) doneAt = now;
      if (doneAt && now - doneAt > (END_PAUSE + 12 * BEAT_SECS) * 1000) reset(now);
    }

    /* ---------- draw ---------- */
    function draw(now) {
      ctx.clearRect(0, 0, Wd, Hd);

      /* quiet table label top-left */
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#5f6e7c';
      ctx.font = '600 16px Andika, -apple-system, system-ui, sans-serif';
      ctx.fillText('×' + TABLE, 14, Hd * 0.06);

      /* holes — dark ellipses sunk into the field */
      for (let i = 0; i < N_HOLES; i++) {
        const p = holePos(i);
        ctx.fillStyle = '#0a0d10';
        ctx.beginPath();
        ctx.ellipse(p.x, p.y, MOLE_R + 8, (MOLE_R + 8) * 0.35, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      /* moles — numeral discs emerging; the front lip of the hole is
         redrawn over their base so they read as coming out */
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (const m of moles) {
        const p = holePos(m.hole);
        const age = (now - m.t0) / 1000;
        let my, rr = MOLE_R, a = 1;
        if (m.phase === 'rise') {
          const k = Math.min(age / RISE_SECS, 1);
          my = p.y - MOLE_R * 1.1 * (1 - (1 - k) * (1 - k));
        } else if (m.phase === 'hold') {
          my = p.y - MOLE_R * 1.1 + Math.sin(age * 2.2) * 1.6;   // gentle bob
        } else if (m.phase === 'sink') {
          const k = Math.min(age / SINK_SECS, 1);
          my = p.y - MOLE_R * 1.1 * (1 - k * k);
        } else { // fly
          my = m.y; rr = MOLE_R * (1 - 0.4 * Math.min(age / FLY_SECS, 1));
        }
        const mx = m.phase === 'fly' ? m.x : p.x;
        const flashing = now < m.flashUntil;
        ctx.globalAlpha = a;
        ctx.fillStyle = flashing ? '#e0a53a' : '#1a2430';
        ctx.strokeStyle = flashing ? '#e0a53a' : '#3a4a58';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(mx, my, rr, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = flashing ? '#e0a53a' : '#cfd8e0';
        ctx.font = '600 ' + Math.round(rr * 0.8) + 'px Andika, -apple-system, system-ui, sans-serif';
        ctx.fillText(String(m.v), mx, my + 1);
        ctx.globalAlpha = 1;
        if (m.phase !== 'fly') {
          /* front lip of the hole occludes the disc's base */
          ctx.fillStyle = '#101418';
          ctx.beginPath();
          ctx.ellipse(p.x, p.y + 2, MOLE_R + 8, (MOLE_R + 8) * 0.32, 0, 0, Math.PI);
          ctx.fill();
        }
      }

      /* the row being built — sockets fill in table colour as
         multiples come home; a complete row beats once in sequence */
      for (let k = 0; k < 12; k++) {
        const s = socketPos(k);
        const filled = sockets[k] === true;
        let glow = 0;
        if (doneAt) {
          const bt = (now - doneAt) / 1000 - k * BEAT_SECS;
          glow = bt > 0 && bt < 0.4 ? Math.sin((bt / 0.4) * Math.PI) : 0;
        }
        ctx.beginPath(); ctx.arc(s.x, s.y, SOCKET_R, 0, Math.PI * 2);
        ctx.fillStyle = filled ? TCOL : 'rgba(120,150,175,.18)';
        ctx.fill();
        if (filled) {
          ctx.fillStyle = '#fff';
          ctx.font = '600 11px Andika, -apple-system, system-ui, sans-serif';
          ctx.fillText(String(TABLE * (k + 1)), s.x, s.y + 0.5);
        }
        if (glow) {
          ctx.lineWidth = 2;
          ctx.strokeStyle = `rgba(255,244,196,${glow})`;
          ctx.beginPath(); ctx.arc(s.x, s.y, SOCKET_R + 3, 0, Math.PI * 2); ctx.stroke();
        }
      }
    }

    /* ---------- orientation guard ---------- */
    const rotOverlay = document.getElementById('rotOverlay');
    const handheld = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
    function checkOrientation() {
      const portrait = screen.orientation && screen.orientation.type
        ? screen.orientation.type.startsWith('portrait')
        : matchMedia('(orientation: portrait)').matches;
      paused = handheld && !portrait;
      rotOverlay.classList.toggle('hidden', portrait || !handheld);
    }
    window.addEventListener('orientationchange', checkOrientation);
    window.addEventListener('resize', checkOrientation);
    checkOrientation();

    function frame(now) {
      if (!paused) { step(now); draw(now); }
      requestAnimationFrame(frame);
    }
    reset(performance.now());
    requestAnimationFrame(frame);
  </script>

  <script src="nav.js?v=12"></script>
</body>

</html>
