<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#101418">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>Snake Puzzle — NumberFun</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #101418;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      font-family: Andika, -apple-system, system-ui, sans-serif;
    }

    canvas {
      display: block;
      position: fixed;
      inset: 0;
    }

    #chipRow {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      padding: 0 12px;
      z-index: 5;
    }

    #chipRow button {
      min-width: 44px;
      height: 44px;
      font-size: 15px;
      font-family: inherit;
      border-radius: 10px;
      border: 1px solid #3a4a58;
      background: rgba(30, 42, 54, .9);
      color: #cfd8e0;
    }

    /* a table finished this visit keeps a faint ring in its colour */
    #chipRow button.made {
      box-shadow: 0 0 0 2px var(--made);
    }

    #chipRow button.on {
      border-color: #4da3ff;
      color: #fff;
      background: rgba(40, 64, 88, .95);
    }

    /* table choice happens between games only — once a child starts
       dragging, the chips dim so the puzzle owns the screen */
    #chipRow.locked button {
      opacity: .35;
      pointer-events: none;
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: rgba(10, 14, 18, .88);
      color: #cfd8e0;
      z-index: 10;
      text-align: center;
      padding: 24px;
    }

    .overlay .title {
      font-size: 22px;
    }

    .overlay .sub {
      font-size: 13px;
      color: #8a97a3;
      margin-top: 14px;
      max-width: 340px;
    }

    .overlay button.go {
      font-size: 20px;
      padding: 16px 32px;
      border-radius: 14px;
      border: none;
      background: #4da3ff;
      color: #fff;
      margin-top: 16px;
    }

    .overlay .btnrow {
      display: flex;
      gap: 14px;
    }

    .overlay button.quiet {
      background: rgba(40, 64, 88, .95);
      color: #cfd8e0;
      border: 1px solid #3a4a58;
    }

    /* the end-bar fades up in the bottom strip while the coiled snake
       and its numeral stay on screen above it */
    #doneBar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 10px 18px;
      z-index: 12;
      color: #cfd8e0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }

    #doneBar.show {
      opacity: 1;
      pointer-events: auto;
    }

    #doneBar .prompt {
      font-size: 18px;
      font-weight: 600;
    }

    #doneBar button {
      font-size: 17px;
      font-family: inherit;
      padding: 10px 24px;
      border-radius: 12px;
      border: none;
      background: #4da3ff;
      color: #fff;
    }

    #doneBar button.quiet {
      background: rgba(40, 64, 88, .95);
      color: #cfd8e0;
      border: 1px solid #3a4a58;
    }

    .hidden {
      display: none !important;
    }

    /* build tag: confirms which revision a device is running — sits
       beside the nav snake */
    #buildTag {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 24px);
      right: 58px;
      height: 40px;
      line-height: 40px;
      font-size: 14px;
      color: #4a5a68;
      user-select: none;
      pointer-events: none;
      z-index: 40;
    }
  </style>
  <link rel="preload" href="fonts/andika-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/andika-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts/andika.css">
</head>

<body>

  <canvas id="c"></canvas>
  <div id="buildTag">19</div>
  <div id="chipRow"></div>

  <div id="rotOverlay" class="overlay hidden">
    <div class="title">Turn upright</div>
    <div class="sub">The game waits for you.</div>
  </div>

  <div id="doneBar">
    <span class="prompt">Another snake?</span>
    <button id="againYes">Yes</button>
    <button class="quiet" id="againNo">No</button>
  </div>

  <script src="anim.js?v=16"></script>

  <script>
    'use strict';

    /* ---------- tunables ---------- */
    /* the ladder: each finished snake makes the next a step harder.
       Same for every child (exploratory, not yet adaptive); held for
       the visit only. gaps = empty places, big = how strongly the gaps
       lean to the large multiples, run = gaps side by side */
    const LADDER = [
      { gaps: 4, big: 0,   run: 0 },  // as it was
      { gaps: 4, big: 0.7, run: 0 },  // larger multiples more often
      { gaps: 5, big: 0.7, run: 0 },  // a fifth gap
      { gaps: 5, big: 0.7, run: 2 },  // a pair side by side
      { gaps: 6, big: 0.8, run: 3 },  // a run of three
      { gaps: 7, big: 0.8, run: 3 },  // seven gaps, a run of three
    ];
    const BIG_FROM = 7;         // "large" means ×7 and above
    const DROP_TOL = 1.1;       // drop acceptance radius, in segment diameters
    const SPAWN_POS = { x: 0.88, y: 0.12 }; // normalized point the numbers appear at
    /* the number's arrival — a moment after the snake, with a pop
       and a spreading ring: "here I am, ready to be placed" */
    const SPAWN_DELAY = 0.9;    // s after the snake before the first number
    const SPAWN_NEXT = 0.35;    // s after a placement before the next number
    const FLOURISH_SECS = 0.6;  // the pop: grows past full size, settles
    const RING_SECS = 0.9;      // the ring of light spreading from it
    const READY_EVERY = 2.6;    // s between softer rings while it waits; 0 = none
    const SHAKE_SECS = 0.45;    // refusal shake on the mistaken segment
    const FLASH_SECS = 0.6;     // amber ring on a refused drop
    const TOP_RESERVE = 92;     // clearance below the menu button
    const BOT_RESERVE = 116;    // room for the table chips
    const BOARD_PAD = 16;
    const IDLE_WRIG_S = 10;     // s of stillness before the restless wriggle
    const WRIG_CYCLE = 7;       // s between wriggle bursts while idle
    const WRIG_SECS = 1.6;      // s in one burst
    const WRIG_AMP = 0.14;      // peak sway, × segD — draw-time only
    /* head animation — the pose is static, so the life is in the eyes:
       they drift toward the piece waiting to be placed and blink now
       and then (same grammar as the shared SnakeEyesView) */
    const GAZE_MAX = 0.85;      // rad the eyes may wander off the facing direction
    const GAZE_EASE = 0.14;     // per-frame approach of gaze to its target
    const BLINK_MIN = 2.4, BLINK_MAX = 6;  // s between blinks
    const BLINK_SECS = 0.28;    // lid dip duration
    /* the celebration — the snake stays where it is: its segments light
       ×1…×12, a satisfied wiggle, then it looks up at you and winks */
    const BEAT_STAGGER = 0.11;  // s between segment highlights, head → tail
    const BEAT_HOLD = 0.45;     // each highlight lingers this long
    const CHEER_AT = 1.6;       // s in: the wiggle starts, over the beat's tail
    const CHEER_SECS = 1.4;     // s of wiggling
    const CHEER_AMP = 0.3;      // peak sway, × segD
    const LOOK_AT = 2.8;        // s in: the head turns to face you
    const LOOK_SECS = 0.5;      // s for the turn
    const LOOK_GROW = 0.1;      // the head comes a little toward you
    const WINK_AT = 3.5;        // s in: one slow wink
    const WINK_SECS = 0.7;      // s for the wink, held shut in the middle
    const ASK_AT = 4.2;         // s in: "Another snake?" fades up
    const MADE_RING = 0.7;      // ring a finished table's chip keeps; 0 = none
    /* the opening — once per device, on the first visit */
    const DEMO_TABLE = 2;       // easy to follow
    const DEMO_BLANKS = 2;      // numbers the opening completes
    const DEMO_START = 1.6;     // s the snake is seen before the first number
    const DEMO_LOOK = 1.8;      // s the new number is seen before it's carried
    const DEMO_LIFT = 0.5;      // s it lifts before it moves, and settles after
    const DEMO_CARRY = 2.4;     // s to carry it home
    const DEMO_NEXT = 1.2;      // s after a placement before the next number
    const DEMO_PAUSE = 2.6;     // s the finished snake stands
    const DEMO_DARK = 1.1;      // s fade out
    const DEMO_UP = 1.1;        // s fade up to the fresh puzzle
    /* the opening's number floats; a child's drag stays plain */
    const FLOAT_RISE = 0.35;    // × segment: how high it lifts before moving
    const SHADOW = 0.8;         // shadow strength under it; 0 = none
    const SHADOW_GROUND = true; // true: shadow keeps to the straight path
                                // false: shadow stays directly beneath it
    const SHADOW_STYLE = 'outline';  // 'dark' shadow, 'light' — a pale
                                  // reflection on the dark floor, or
                                  // 'outline' — a faint ring on the floor
                                  // (?shadow=light / ?shadow=outline
                                  // try them without editing)

    /* ---------- canvas ---------- */
    const cv = document.getElementById('c');
    const ctx = cv.getContext('2d');
    let W = 0, H = 0, DPR = 1;
    let bX = 0, bY = 0, bW = 0, bH = 0;   // board rect (css px)
    let segD = 48;

    function resize() {
      const vv = window.visualViewport;
      W = vv ? vv.width : window.innerWidth;
      H = vv ? vv.height : window.innerHeight;
      if (W < 50 || H < 50) return;
      DPR = Math.min(window.devicePixelRatio || 1, 3);
      cv.width = W * DPR; cv.height = H * DPR;
      cv.style.width = W + 'px'; cv.style.height = H + 'px';
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      bX = BOARD_PAD; bY = TOP_RESERVE;
      bW = W - 2 * BOARD_PAD; bH = H - TOP_RESERVE - BOT_RESERVE;
      segD = Math.max(34, Math.min(72, Math.min(bW, bH) * 0.14));
      layout();
    }
    window.addEventListener('resize', resize);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

    /* ---------- poses ----------
       Poses come from Anim.pose — the shared heading-walk grammar:
       segment-adjacent points exactly one spacing apart, so the body
       is continuous AND already trail-ready. The celebration lifts the
       dealt pose as-is; nothing rearranges at the handover. rail is
       normalized 0..1 over a square centred on the board. */

    /* ---------- colours (same table-coding as the family) ---------- */
    function tableColour(t) { return 'hsl(' + ((t * 31 + 200) % 360) + ',60%,45%)'; }

    /* ---------- state ---------- */
    const N = 13;                 // head + twelve body segments
    let table = 3;
    let rail = [];               // normalized points
    let segs = [];               // {x,y, expected, filled, blank}
    let blanks = [];             // indices into segs awaiting values
    let remaining = [];          // values still to spawn
    let spawned = null;          // {value, x, y, born} — the piece in hand
    let dragging = false;
    let shakeIdx = -1, shakeT = 0;
    let flashIdx = -1, flashT = 0;
    let gaze = 0, nextBlinkAt = 0, blinkT0 = -1;
    let hasInteracted = false;
    let state = 'play';          // play | choose | celebrate | done
    let startT = 0, doneMs = 0;
    let lastAct = 0;             // last touch — a still patch wriggles
    let misses = 0;
    let poseSeed = 0;            // seed of the dealt pose — shareable
    let cheerT = 0;              // when the celebration began

    const qs = new URLSearchParams(location.search);
    // the ladder rung, for this visit only; ?rung=N starts on rung N (from 1)
    const RUNG_KEY = 'snakePuzzleRung';
    let rung = 0;
    function setRung(n) {
      rung = Math.max(0, Math.min(LADDER.length - 1, n));
      try { sessionStorage.setItem(RUNG_KEY, String(rung)); } catch (e) {}
    }
    try { rung = +sessionStorage.getItem(RUNG_KEY) || 0; } catch (e) {}
    if (qs.has('rung')) setRung((+qs.get('rung') || 1) - 1);
    // the tables finished this visit — their chips keep a faint ring
    const MADE_KEY = 'snakePuzzleMade';
    let made = [];
    try { made = JSON.parse(sessionStorage.getItem(MADE_KEY)) || []; } catch (e) {}
    function addMade(t) {
      if (!made.includes(t)) made.push(t);
      try { sessionStorage.setItem(MADE_KEY, JSON.stringify(made)); } catch (e) {}
    }
    // ?poseSeed=N pins every deal's pose for reproduction/auditioning
    const pinSeed = qs.has('poseSeed') ?
      (parseInt(qs.get('poseSeed'), 10) || 0) : null;

    const chipRow = document.getElementById('chipRow');
    const rotOverlay = document.getElementById('rotOverlay');
    const doneBar = document.getElementById('doneBar');

    function layout() {
      // normalized rail -> board px, inside the centred board square
      if (!rail.length) return;
      const sq = Math.min(bW, bH);
      for (let i = 0; i < N; i++) {
        segs[i].x = bX + (bW - sq) / 2 + rail[i].x * sq;
        segs[i].y = bY + (bH - sq) / 2 + rail[i].y * sq;
      }
      if (spawned && !dragging) homeSpawn();
      if (qs.has('dbg'))
        document.title = segs.map(p => Math.round(p.x) + ',' +
          Math.round(p.y)).join(' ');
    }

    function spawnHome() {
      return { x: bX + SPAWN_POS.x * bW, y: bY + SPAWN_POS.y * bH };
    }
    function homeSpawn() {
      const p = spawnHome();
      spawned.x = p.x; spawned.y = p.y;
    }

    function spawnNext(delay) {
      if (!remaining.length) { spawned = null; return; }
      const k = Math.floor(Math.random() * remaining.length);
      const value = remaining.splice(k, 1)[0];
      spawned = { value, x: 0, y: 0,
        born: performance.now() + (delay || 0) * 1000 };
      homeSpawn();
    }

    /* which places are empty: a fixed count (the opening) is spread
       evenly; otherwise the current rung of the ladder decides. Never
       the head, never ×1 — the first multiple stays as the foothold */
    function pickBlanks(fixed) {
      const pool = [];
      for (let i = 2; i < N; i++) pool.push(i);
      const take = i => { pool.splice(pool.indexOf(i), 1); return i; };
      const any = list => list[Math.floor(Math.random() * list.length)];
      const out = [];
      if (fixed !== undefined) {
        while (out.length < fixed && pool.length) out.push(take(any(pool)));
        return out;
      }
      const r = LADDER[Math.min(rung, LADDER.length - 1)];
      if (r.run > 1) {
        const last = N - r.run;
        const lo = Math.random() < r.big ? Math.min(Math.max(2, BIG_FROM), last) : 2;
        const s0 = lo + Math.floor(Math.random() * (last - lo + 1));
        for (let i = 0; i < r.run; i++) out.push(take(s0 + i));
      }
      // after the first rung the other gaps keep a neighbour each, so
      // the only gaps side by side are the run the rung asks for
      const apart = r.big > 0 || r.run > 0;
      while (out.length < r.gaps && pool.length) {
        let free = apart
          ? pool.filter(i => !out.includes(i - 1) && !out.includes(i + 1))
          : pool;
        if (!free.length) free = pool;
        const big = free.filter(i => i >= BIG_FROM);
        out.push(take(any(big.length && Math.random() < r.big ? big : free)));
      }
      return out;
    }

    function deal(fixedBlanks) {
      poseSeed = pinSeed !== null ? pinSeed
        : Math.floor(Math.random() * 1e9);
      rail = Anim.pose({
        board: { x: bX, y: bY, w: bW, h: bH },
        segD, count: N,
        family: qs.get('pose') || 'any',
        seed: poseSeed
      }).rail;
      segs = [];
      for (let i = 0; i < N; i++) {
        segs.push({
          x: 0, y: 0,
          expected: i === 0 ? 0 : i * table,
          filled: true, blank: false
        });
      }
      blanks = pickBlanks(fixedBlanks);
      remaining = [];
      for (const j of blanks) {
        segs[j].filled = false; segs[j].blank = true;
        remaining.push(segs[j].expected);
      }
      remaining.sort(() => Math.random() - 0.5);
      layout();
      spawnNext(SPAWN_DELAY);
      hasInteracted = false;
      misses = 0;
      state = 'play';
      startT = performance.now();
      lastAct = startT;
      gaze = Math.atan2(segs[0].y - segs[1].y, segs[0].x - segs[1].x);
      nextBlinkAt = startT + 2000 + Math.random() * 2000;
      blinkT0 = -1;
      chipRow.classList.remove('locked', 'hidden');
      doneBar.classList.remove('show');
    }

    /* ---------- chips ---------- */
    const chipBtns = [];
    for (let t = 2; t <= 12; t++) {
      const b = document.createElement('button');
      b.textContent = '×' + t;
      b.addEventListener('click', () => {
        lastAct = performance.now();
        if (state === 'choose') { table = t; syncChips(); deal(); return; }
        if (state !== 'play' || hasInteracted) return;
        if (t === table) return;
        table = t;
        syncChips();
        deal();
      });
      chipBtns.push(b);
      chipRow.appendChild(b);
    }
    function syncChips() {
      chipBtns.forEach((b, i) => {
        const t = i + 2, m = MADE_RING > 0 && made.includes(t);
        b.classList.toggle('on', t === table);
        b.classList.toggle('made', m);
        b.style.setProperty('--made', m ?
          'hsla(' + ((t * 31 + 200) % 360) + ',60%,55%,' + MADE_RING + ')' : '');
      });
      chipRow.classList.toggle('locked',
        hasInteracted && (state === 'play' || state === 'celebrate'));
    }

    /* ---------- input ---------- */
    function pt(e) {
      const r = cv.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    }

    cv.addEventListener('pointerdown', e => {
      lastAct = performance.now();
      if (state !== 'play' || !spawned) return;
      if (performance.now() < spawned.born) return;   // not arrived yet
      const p = pt(e);
      if (Math.hypot(p.x - spawned.x, p.y - spawned.y) <= segD * 0.7) {
        dragging = true;
        hasInteracted = true;
        syncChips();
        cv.setPointerCapture(e.pointerId);
        e.preventDefault();
      }
    });

    cv.addEventListener('pointermove', e => {
      if (!dragging || !spawned) return;
      lastAct = performance.now();
      const p = pt(e);
      spawned.x = p.x; spawned.y = p.y;
    });

    cv.addEventListener('pointerup', e => {
      if (!dragging || !spawned) return;
      dragging = false;
      lastAct = performance.now();
      const p = pt(e);
      // nearest segment within tolerance
      let best = -1, bestD = segD * DROP_TOL;
      for (let i = 0; i < N; i++) {
        const d = Math.hypot(p.x - segs[i].x, p.y - segs[i].y);
        if (d < bestD) { bestD = d; best = i; }
      }
      if (best >= 0 && segs[best].blank && segs[best].expected === spawned.value) {
        segs[best].filled = true; segs[best].blank = false;
        spawnNext(SPAWN_NEXT);
        if (!spawned) finish();
      } else if (best >= 0) {
        // a real target, but not this number's home — refusal is information
        shakeIdx = best; shakeT = performance.now();
        flashIdx = best; flashT = performance.now();
        misses++;
        homeSpawn();
      } else {
        homeSpawn(); // dropped on empty ground: quietly goes home
      }
    });

    /* the win: the snake celebrates where it lies — the reinforcement
       beat (×1…×12 light in turn), a satisfied wiggle, a look straight
       at the child and a wink. Then "Another snake?" */
    function finish() {
      state = 'celebrate';
      setRung(rung + 1);
      addMade(table);
      doneMs = Math.round(performance.now() - startT);
      cheerT = performance.now();
      nextBlinkAt = cheerT + (WINK_AT + WINK_SECS + 1.5) * 1000;
      blinkT0 = -1;
      syncChips();
    }

    /* the bottom prompt fades up while the snake stays on screen,
       still looking out, until the user responds */
    function showDone() {
      state = 'done';
      chipRow.classList.add('hidden');
      doneBar.classList.add('show');
    }
    /* Yes doesn't redeal — it offers the chips. No snake is drawn
       until a table is chosen */
    document.getElementById('againYes').addEventListener('click', () => {
      doneBar.classList.remove('show');
      chipRow.classList.remove('hidden');
      segs = []; rail = []; spawned = null; remaining = [];
      hasInteracted = false;
      state = 'choose';
      syncChips();
    });
    document.getElementById('againNo').addEventListener('click', () => {
      location.href = 'index.html';
    });

    /* ---------- orientation guard (handheld only) ---------- */
    const handheld = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
    function checkOrientation() {
      rotOverlay.classList.toggle('hidden',
        !handheld || H >= W);
    }
    window.addEventListener('resize', checkOrientation);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', checkOrientation);

    /* ---------- draw ---------- */
    function numeral(v, cx, cy, size, colour) {
      ctx.font = '700 ' + size + 'px Andika, -apple-system, system-ui, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = colour;
      ctx.fillText(v, cx, cy);
    }

    function wrapAngle(d) {
      while (d > Math.PI) d -= 2 * Math.PI;
      while (d < -Math.PI) d += 2 * Math.PI;
      return d;
    }

    /* the eyes watch the piece in hand (clamped to the face); with
       nothing to place they rest on the pose's facing direction */
    function eyeLook(s, facing) {
      let t = facing;
      if (spawned && performance.now() >= spawned.born) {
        const d = wrapAngle(Math.atan2(spawned.y - s.y, spawned.x - s.x) - facing);
        t = facing + Math.max(-GAZE_MAX, Math.min(GAZE_MAX, d));
      }
      gaze += wrapAngle(t - gaze) * GAZE_EASE;
      return gaze;
    }

    /* 1 = eyes open, dipping briefly toward shut and back — one smooth
       sinusoid so there are no blink states to manage */
    function blinkScale(now) {
      if (blinkT0 < 0) {
        if (now < nextBlinkAt) return 1;
        blinkT0 = now;
      }
      const k = (now - blinkT0) / 1000 / BLINK_SECS;
      if (k >= 1) {
        blinkT0 = -1;
        nextBlinkAt = now + (BLINK_MIN + Math.random() * (BLINK_MAX - BLINK_MIN)) * 1000;
        return 1;
      }
      return 1 - Math.sin(k * Math.PI) * 0.88;
    }

    /* same construction as the tilt-snake head — radial-shaded ball,
       rim stroke, pupil pair forward and across — but the hue comes
       from the table so the snake takes its table's colour */
    /* face: 0 = eyes on the heading, 1 = turned to look out at you;
       wink: 0..1 — how far the right eye is shut */
    function drawHead(s, now, face = 0, wink = 0) {
      const nxt = segs[1] || { x: s.x, y: s.y + 1 };
      const ang = Math.atan2(s.y - nxt.y, s.x - nxt.x);
      const r = segD / 2 * (1 + LOOK_GROW * face);
      const hue = (table * 31 + 200) % 360;

      const g = ctx.createRadialGradient(
        s.x - r * 0.33, s.y - r * 0.33, r * 0.2,
        s.x, s.y, r);
      g.addColorStop(0, 'hsl(' + hue + ',62%,64%)');
      g.addColorStop(1, 'hsl(' + hue + ',56%,28%)');
      ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, 7);
      ctx.fillStyle = g; ctx.fill();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = 'hsl(' + hue + ',58%,40%)';
      ctx.stroke();

      const look = eyeLook(s, ang);
      const ex = Math.cos(look), ey = Math.sin(look);
      const px = -ey, py = ex;
      const sq = blinkScale(now);
      // each eye eases from its place on the heading to the front of the
      // face — the left-hand eye stays the left-hand eye, so none cross
      const eyes = [-1, 1].map(side => ({
        x: s.x + ex * r * 0.38 + px * side * r * 0.36,
        y: s.y + ey * r * 0.38 + py * side * r * 0.36
      })).sort((a, b) => a.x - b.x);
      eyes.forEach((e, k) => {
        const fx = s.x + (k ? 1 : -1) * r * 0.34, fy = s.y - r * 0.06;
        const x = e.x + (fx - e.x) * face, y = e.y + (fy - e.y) * face;
        const er = r * (0.16 + 0.03 * face);
        const lid = k ? Math.min(sq, 1 - wink * 0.94)
          : Math.min(sq, 1 - wink * 0.15);
        ctx.beginPath();
        ctx.ellipse(x, y, er, Math.max(er * lid, r * 0.03),
          look * (1 - face), 0, 7);
        ctx.fillStyle = '#101418'; ctx.fill();
      });
    }

    function draw(now) {
      if (demo) stepDemo(now);
      if (state === 'choose') {
        // chips alone offer the next round — no snake until one is picked
        ctx.fillStyle = '#101418';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = 'rgba(120,140,160,.45)';
        ctx.font = '15px Andika, -apple-system, system-ui, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('pick a table', bX + bW / 2, bY + bH / 2);
        return;
      }
      // the celebration's clock: 0 while playing
      const el = state === 'celebrate' ? (now - cheerT) / 1000
        : state === 'done' ? Infinity : -1;
      if (state === 'celebrate' && el >= ASK_AT) showDone();
      const ease = k => { k = Math.max(0, Math.min(1, k)); return k * k * (3 - 2 * k); };
      const face = el < 0 ? 0 : ease((el - LOOK_AT) / LOOK_SECS);
      const wk = (el - WINK_AT) / WINK_SECS;
      const wink = wk > 0 && wk < 1 ? Math.min(1, Math.sin(wk * Math.PI) * 1.8) : 0;
      ctx.fillStyle = '#101418';
      ctx.fillRect(0, 0, W, H);

      // a still patch earns a restless wriggle — a travelling sway,
      // draw-time only, so dealt positions (and drop targets) never move
      const idleAge = (now - lastAct) / 1000;
      let wob = null;
      const ck = (el - CHEER_AT) / CHEER_SECS;
      if (ck > 0 && ck < 1) {
        // the satisfied wiggle — head to tail, swelling and dying away
        const k = Math.sin(ck * Math.PI);
        wob = segs.map((s, i) => {
          const a = segs[Math.max(0, i - 1)], b = segs[Math.min(N - 1, i + 1)];
          const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
          const m = Math.sin(now / 1000 * 9 - i * 0.9) * CHEER_AMP * segD * k;
          return { x: -dy / d * m, y: dx / d * m };
        });
      } else if (idleAge > IDLE_WRIG_S) {
        const c = (idleAge - IDLE_WRIG_S) % WRIG_CYCLE;
        if (c < WRIG_SECS) {
          const k = Math.sin(c / WRIG_SECS * Math.PI);
          wob = segs.map((s, i) => {
            const a = segs[Math.max(0, i - 1)], b = segs[Math.min(N - 1, i + 1)];
            const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
            const m = Math.sin(now / 1000 * 9 - i * 0.9) * WRIG_AMP * segD * k;
            return { x: -dy / d * m, y: dx / d * m };
          });
        }
      }

      // spine: a faint thread through the segments so the pose reads as
      // one animal even with gaps
      ctx.beginPath();
      segs.forEach((s, i) => {
        const x = s.x + (wob ? wob[i].x : 0), y = s.y + (wob ? wob[i].y : 0);
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      });
      ctx.strokeStyle = 'rgba(90,110,130,.25)';
      ctx.lineWidth = 3;
      ctx.stroke();

      for (let i = N - 1; i >= 0; i--) {
        const s = segs[i];
        let ox = 0;
        if (i === shakeIdx) {
          const t = (now - shakeT) / 1000;
          if (t > SHAKE_SECS) shakeIdx = -1;
          else ox = Math.sin(t * 30) * 5 * (1 - t / SHAKE_SECS);
        }
        const cx = s.x + ox + (wob ? wob[i].x : 0),
          cy = s.y + (wob ? wob[i].y : 0), r = segD / 2;
        if (i === 0) { drawHead({ x: cx, y: cy }, now, face, wink); continue; }
        if (s.blank) {
          ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7);
          ctx.fillStyle = 'rgba(20,28,36,.9)'; ctx.fill();
          ctx.setLineDash([5, 4]);
          ctx.lineWidth = 2;
          ctx.strokeStyle = tableColour(table);
          ctx.stroke();
          ctx.setLineDash([]);
        } else {
          // the reinforcement beat: each member swells and rings in turn
          const bk = el - i * BEAT_STAGGER;
          const pop = bk > 0 && bk < BEAT_HOLD ? Math.sin(bk / BEAT_HOLD * Math.PI) : 0;
          ctx.beginPath(); ctx.arc(cx, cy, r * (1 + pop * 0.12), 0, 7);
          ctx.fillStyle = tableColour(table); ctx.fill();
          if (pop > 0) {
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = 'rgba(255,255,255,' + (0.85 * pop) + ')';
            ctx.stroke();
          }
          numeral(s.expected, cx, cy, segD * 0.34, '#fff');
        }
        if (i === flashIdx) {
          const t = (now - flashT) / 1000;
          if (t > FLASH_SECS) flashIdx = -1;
          else {
            ctx.beginPath(); ctx.arc(cx, cy, r + 3, 0, 7);
            ctx.lineWidth = 3;
            ctx.strokeStyle = 'rgba(224,165,58,' + (1 - t / FLASH_SECS) + ')';
            ctx.stroke();
          }
        }
      }

      if (spawned) {
        const age = (now - spawned.born) / 1000;
        if (age >= 0) drawSpawn(age);
      }

      /* the opening's ending — the stage fades out, then the fresh
         puzzle fades up on the other side of it */
      if (darkA > 0) {
        ctx.fillStyle = 'rgba(16,20,24,' + Math.min(1, darkA) + ')';
        ctx.fillRect(0, 0, W, H);
      }
    }

    /* the piece in hand — arrives with a flourish: pops up past full
       size and settles, a ring of light spreading from it; while it
       waits, a softer ring now and then says "still here" */
    /* soft oval on the ground: slides out from under the number as it
       lifts, widens and fades with height, closes up again on landing */
    function drawShadow(r) {
      const d = demo, top = segD * (1.2 + FLOAT_RISE);
      const k = Math.min(1, (d.h || 0) / top);
      const sx = SHADOW_GROUND ? d.gx : spawned.x;
      const sy = (SHADOW_GROUND ? d.gy : spawned.y + (d.h || 0)) + r * 0.25;
      const style = qs.get('shadow') || SHADOW_STYLE;
      const light = style === 'light';
      const hue = (table * 31 + 200) % 360;
      if (style === 'outline') {
        /* a thin soft line where the shadow's edge would be: shows on
           the dark page where a dark fill disappears */
        const w = r * (1.0 + 0.35 * k), h = w * 0.35;
        const a = SHADOW * 0.5 * (1 - 0.45 * k);
        ctx.save();
        ctx.strokeStyle = 'hsla(' + hue + ',30%,80%,' + a * 0.35 + ')';
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.ellipse(sx, sy, w, h, 0, 0, 7); ctx.stroke();
        ctx.strokeStyle = 'hsla(' + hue + ',30%,82%,' + a + ')';
        ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.ellipse(sx, sy, w, h, 0, 0, 7); ctx.stroke();
        ctx.restore();
        return;
      }
      /* the pale one is flatter and crisper-edged, so it reads as a
         reflection on the floor rather than a puff of cloud */
      const w = r * (1.05 + 0.35 * k), h = w * (light ? 0.3 : 0.45);
      const rgb = light ? 'hsla(' + hue + ',35%,80%,' : 'rgba(0,0,0,';
      const alpha = SHADOW * (light ? 0.22 : 1) * (1 - 0.4 * k);
      ctx.save();
      ctx.translate(sx, sy); ctx.scale(1, h / w);
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, w);
      g.addColorStop(0, rgb + alpha + ')');
      if (light) g.addColorStop(0.8 - 0.2 * k, rgb + alpha * 0.8 + ')');
      else g.addColorStop(0.55 - 0.25 * k, rgb + alpha * 0.7 + ')');
      g.addColorStop(1, rgb + '0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, w, 0, 7); ctx.fill();
      ctx.restore();
    }

    function drawSpawn(age) {
      const r = segD / 2, hue = (table * 31 + 200) % 360;
      const held = dragging || (demo && demo.phase === 'carry');
      const a = held ? 1 : Math.min(1, age / FLOURISH_SECS);
      const u = a - 1;
      const lifted = demo && demo.phase === 'carry' ? demo.lift || 0 : 0;
      const sc = held ? 1 + 0.1 * lifted
        : Math.max(0, 1 + 3.2 * u * u * u + 2.2 * u * u);
      const x = spawned.x, y = spawned.y - (1 - a) * 14;
      if (demo && demo.phase === 'carry' && SHADOW > 0) drawShadow(r);
      if (!held) {
        let ring = -1, ringA = 0.6;
        if (age < RING_SECS) ring = age / RING_SECS;
        else if (READY_EVERY > 0) {
          const c = (age - RING_SECS) % READY_EVERY;
          if (c > READY_EVERY - RING_SECS) {
            ring = (c - (READY_EVERY - RING_SECS)) / RING_SECS; ringA = 0.3;
          }
        }
        if (ring >= 0) {
          ctx.beginPath(); ctx.arc(x, y, r * (1 + 1.3 * ring), 0, 7);
          ctx.lineWidth = 3 * (1 - ring) + 1;
          ctx.strokeStyle = 'hsla(' + hue + ',75%,72%,' + ringA * (1 - ring) + ')';
          ctx.stroke();
        }
      }
      ctx.globalAlpha = held ? 1 : Math.min(1, age / 0.15);
      ctx.beginPath();
      ctx.arc(x, y, r * sc, 0, 7);
      ctx.fillStyle = tableColour(table); ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.stroke();
      if (sc > 0.2) numeral(spawned.value, x, y, segD * 0.34 * sc, '#fff');
      ctx.globalAlpha = 1;
    }

    /* ---------- the opening (Roger, 2026-11-14) ----------
       Once per device, on the first visit: a ×2 snake missing two
       numbers completes itself — each number arrives as it will in
       play, is seen, and is carried home. The finished snake stands
       a moment, the stage fades out, and the fresh puzzle fades up.
       The first touch anywhere ends it.
       ?demo=1 plays it on request; ?demo=reset forgets it was seen */
    const DEMO_KEY = 'snakePuzzleDemoSeen';
    function demoSeen(mark) {          // private browsing may refuse storage
      try {
        if (mark === undefined) return !!localStorage.getItem(DEMO_KEY);
        if (mark) localStorage.setItem(DEMO_KEY, '1');
        else localStorage.removeItem(DEMO_KEY);
      } catch (e) { return false; }
    }
    if (qs.get('demo') === 'reset') demoSeen(false);
    let demo = null;                   // {phase, t0, keep, idx, from}
    let darkA = 0;                     // fade-to-dark level at the ending

    function startDemo() {
      demo = { phase: 'wait', t0: 0, keep: table, idx: -1, from: null };
      table = DEMO_TABLE; syncChips(); deal(DEMO_BLANKS);
      if (spawned) spawned.born = performance.now() + DEMO_START * 1000;
      chipRow.classList.add('locked');
      demoSeen(true);
    }

    function stepDemo(now) {
      const d = demo;
      if (d.phase === 'wait') {
        if (spawned && now >= spawned.born
            + (FLOURISH_SECS + DEMO_LOOK) * 1000) {
          d.idx = segs.findIndex(s => s.blank && s.expected === spawned.value);
          d.from = { x: spawned.x, y: spawned.y };
          d.phase = 'carry'; d.t0 = now;
        }
      } else if (d.phase === 'carry') {
        /* lifted, carried, set down: the piece swells a little as
           it's picked up and settles back as it lands */
        const T = DEMO_LIFT * 2 + DEMO_CARRY, el = (now - d.t0) / 1000;
        d.lift = Math.min(1, el / DEMO_LIFT, Math.max(0, (T - el) / DEMO_LIFT));
        const e = Math.min(1, Math.max(0, (el - DEMO_LIFT) / DEMO_CARRY));
        const q = e < 0.5 ? 2 * e * e : 1 - Math.pow(2 - 2 * e, 2) / 2;
        const to = segs[d.idx];
        const dx = to.x - d.from.x, dy = to.y - d.from.y;
        const L = Math.hypot(dx, dy) || 1;
        let nx = -dy / L, ny = dx / L;           // carried in a gentle arc,
        if (ny > 0) { nx = -nx; ny = -ny; }      // lifted, not slid
        const lift = Math.sin(q * Math.PI) * Math.min(L * 0.18, segD * 1.2);
        const rise = d.lift * FLOAT_RISE * segD;
        d.gx = d.from.x + dx * q; d.gy = d.from.y + dy * q;
        d.h = lift + rise;
        spawned.x = d.gx + nx * lift;
        spawned.y = d.gy + ny * lift - rise;
        if (el >= T) {
          to.filled = true; to.blank = false;
          spawnNext(DEMO_NEXT);
          d.phase = spawned ? 'wait' : 'pause'; d.t0 = now;
        }
      } else if (d.phase === 'pause') {
        if (now - d.t0 >= DEMO_PAUSE * 1000) { d.phase = 'dark'; d.t0 = now; }
      } else if (d.phase === 'dark') {
        darkA = Math.min(1, (now - d.t0) / 1000 / DEMO_DARK);
        if (darkA >= 1) {
          table = d.keep; syncChips(); deal();
          d.phase = 'up'; d.t0 = now;
        }
      } else if (d.phase === 'up') {
        darkA = 1 - (now - d.t0) / 1000 / DEMO_UP;
        if (darkA <= 0) { darkA = 0; demo = null; }
      }
    }

    /* a real touch ends the opening — the fresh puzzle at once */
    window.addEventListener('pointerdown', () => {
      if (!demo) return;
      const fresh = demo.phase === 'up';
      table = demo.keep; demo = null; darkA = 0;
      if (!fresh) { syncChips(); deal(); }
    }, true);

    function frame(now) {
      try { draw(now); } catch (e) { /* a bad frame must not kill the loop */ }
      requestAnimationFrame(frame);
    }

    resize();
    checkOrientation();
    syncChips();
    deal();
    // lab aids: ?t=N picks the table, ?pose=fam pins the pose, ?done jumps
    // to a completed round (watch the celebration)
    if (qs.has('t')) {
      table = Math.min(12, Math.max(2, +qs.get('t') || table));
      syncChips();
      deal();
    }
    if (qs.has('done')) {
      segs.forEach(s => { s.filled = true; s.blank = false; });
      remaining = []; spawned = null;
      finish();
    }
    if (qs.get('demo') === '1'
        || (!qs.has('t') && !qs.has('done') && !demoSeen())) startDemo();
    requestAnimationFrame(frame);
  </script>
